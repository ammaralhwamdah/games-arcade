<!DOCTYPE html>
<html>
<head>
<title>PlayKrux Logo - Download</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: Arial, sans-serif;
    flex-direction: column;
    gap: 40px;
  }
  .logo-box {
    width: 512px;
    height: 512px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid #333;
  }
  h2 { color: #fff; margin: 0; }
  p { color: #aaa; margin: 5px 0 0 0; font-size: 14px; }
</style>
</head>
<body>
  <div>
    <h2>Right-click the logo below → "Save image as..." → PNG</h2>
    <p>512 x 512 px — perfect for YouTube</p>
  </div>
  <div class="logo-box">
    <svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7c3aed"/>
          <stop offset="50%" stop-color="#8b5cf6"/>
          <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="btnPink" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f472b6"/>
          <stop offset="100%" stop-color="#c084fc"/>
        </linearGradient>
        <linearGradient id="btnCyan" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#67e8f9"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Background rounded square -->
      <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)"/>

      <!-- Gloss overlay -->
      <rect x="0" y="0" width="512" height="260" rx="100" fill="url(#gloss)"/>

      <!-- Controller body -->
      <rect x="120" y="200" width="272" height="120" rx="60" fill="#0f172a"/>

      <!-- Left grip -->
      <ellipse cx="128" cy="260" rx="45" ry="60" fill="#0f172a"/>

      <!-- Right grip -->
      <ellipse cx="384" cy="260" rx="45" ry="60" fill="#0f172a"/>

      <!-- D-pad -->
      <rect x="155" y="240" width="50" height="16" rx="5" fill="#334155"/>
      <rect x="172" y="223" width="16" height="50" rx="5" fill="#334155"/>

      <!-- Action buttons - diamond -->
      <circle cx="360" cy="230" r="16" fill="url(#btnPink)" filter="url(#glow)"/>
      <circle cx="390" cy="260" r="16" fill="url(#btnCyan)" filter="url(#glow)"/>
      <circle cx="360" cy="290" r="16" fill="#fbbf24" filter="url(#glow)"/>
      <circle cx="330" cy="260" r="16" fill="#34d399" filter="url(#glow)"/>

      <!-- Center indicator -->
      <circle cx="256" cy="260" r="12" fill="#8b5cf6" filter="url(#glow)"/>

      <!-- Text: PlayKrux -->
      <text x="256" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="white">
        Play<tspan fill="url(#btnCyan)">Krux</tspan>
      </text>
    </svg>
  </div>
</body>
</html>
