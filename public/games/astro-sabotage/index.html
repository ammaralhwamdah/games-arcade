<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Astro Sabotage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b1220; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #e2e8f0; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(94vmin, 540px, calc((94vh - 150px))); display: flex; flex-direction: column; align-items: center; }
  #stage { position: relative; width: 100%; aspect-ratio: 1/1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 16px; background: #0f172a; box-shadow: 0 10px 40px rgba(0,0,0,.5); touch-action: none; }
  #hud { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 14px; font-size: 13px; font-weight: 700; z-index: 4; pointer-events: none; }
  #hud .timer { color: #e2e8f0; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  #hud .o2 { color: #4ade80; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  #hud .o2.warn { color: #f87171; }
  #soundBtn { pointer-events: auto; background: rgba(255,255,255,.1); border: 0; border-radius: 10px; width: 30px; height: 30px; font-size: 15px; cursor: pointer; color: #fff; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #logbox { width: 100%; background: #0b1220; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; margin-top: 8px; padding: 8px 10px; font-size: 11px; line-height: 1.7; color: #94a3b8; min-height: 64px; max-height: 64px; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #logbox .bad { color: #f87171; }
  #logbox .good { color: #4ade80; }
  #logbox .info { color: #38bdf8; }
  #meetingBtn { width: 100%; margin-top: 8px; border: 0; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 800; cursor: pointer; background: #f43f5e; color: #fff; transition: filter .1s, transform .1s, opacity .1s; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #meetingBtn:active { transform: scale(.98); }
  #meetingBtn:disabled { opacity: .35; cursor: not-allowed; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(11,18,32,.88); border-radius: 16px; text-align: center; padding: 16px; z-index: 3; backdrop-filter: blur(3px); overflow-y: auto; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 30px; letter-spacing: 1px; color: #fff; }
  #overlay h1 span { color: #22d3ee; }
  #overlay .sub { font-size: 13px; color: #94a3b8; max-width: 300px; line-height: 1.5; }
  #overlay .final { font-size: 16px; color: #fbbf24; font-weight: 700; display: none; }
  #overlay .btn { background: #22d3ee; color: #082f36; border: 0; border-radius: 12px; padding: 12px 30px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform .1s, filter .1s; }
  #overlay .btn:hover { filter: brightness(1.1); }
  #overlay .btn:active { transform: scale(.96); }
  .crewGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 340px; margin-top: 4px; }
  .crewCard { border: 0; border-radius: 12px; background: rgba(255,255,255,.06); padding: 8px 2px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: transform .1s, background .1s; }
  .crewCard:active { transform: scale(.94); }
  .crewCard .dot { width: 30px; height: 30px; border-radius: 50%; box-shadow: 0 0 12px rgba(255,255,255,.15); }
  .crewCard .nm { font-size: 10px; font-weight: 700; color: #e2e8f0; }
  .crewCard:hover { background: rgba(255,255,255,.14); }
  .meetingLog { width: 100%; max-width: 340px; background: rgba(0,0,0,.3); border-radius: 10px; padding: 8px 10px; font-size: 10px; line-height: 1.8; text-align: left; color: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 90px; overflow: hidden; }
  .meetingLog .bad { color: #f87171; }
  @media (max-height: 560px) {
    #overlay { gap: 8px; padding: 10px; }
    #overlay h1 { font-size: 20px; }
    #overlay .sub { font-size: 11px; max-height: 24px; overflow: hidden; }
    #overlay .final { font-size: 13px; }
    #overlay .btn { padding: 9px 22px; font-size: 14px; }
    #logbox { min-height: 52px; max-height: 52px; font-size: 10px; }
    #meetingBtn { padding: 9px; font-size: 13px; }
  }
  @media (max-height: 480px) {
    #overlay .sub { display: none; }
    .crewCard .dot { width: 24px; height: 24px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="hud">
      <span class="timer">⏱ 1:15</span>
      <span class="o2" id="o2">O₂ 100%</span>
      <button id="soundBtn" title="Sound: on" aria-label="Toggle sound">🔊</button>
    </div>
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1>ASTRO<span> SABOTAGE</span></h1>
      <div class="sub">An impostor is hiding among the crew and sabotaging the ship's systems. Watch the crew, read the event log, and call a meeting to accuse the right crewmate.</div>
      <div class="final" id="finalMsg"></div>
      <button class="btn" id="playBtn">START SHIFT</button>
    </div>
  </div>
  <div id="logbox"></div>
  <button id="meetingBtn" disabled>🚨 CALL EMERGENCY MEETING</button>
</div>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var playBtn = document.getElementById("playBtn");
  var finalMsg = document.getElementById("finalMsg");
  var meetingBtn = document.getElementById("meetingBtn");
  var logbox = document.getElementById("logbox");
  var timerEl = document.querySelector("#hud .timer");
  var o2El = document.getElementById("o2");

  var DPR = window.devicePixelRatio || 1;
  var S = 0;

  var ROOMS = [
    { name: "Reactor", fx: .06, fy: .13, fw: .42, fh: .36, tint: "#f59e0b", ok: true },
    { name: "Medbay", fx: .52, fy: .13, fw: .42, fh: .36, tint: "#10b981", ok: true },
    { name: "Cafeteria", fx: .06, fy: .59, fw: .42, fh: .36, tint: "#6366f1", ok: true },
    { name: "Electrical", fx: .52, fy: .59, fw: .42, fh: .36, tint: "#e11d48", ok: true }
  ];

  var CREW = [
    { name: "Zed", color: "#ef4444", accent: "#b91c1c" },
    { name: "Kip", color: "#f97316", accent: "#c2410c" },
    { name: "Mara", color: "#22c55e", accent: "#15803d" },
    { name: "Nox", color: "#eab308", accent: "#a16207" },
    { name: "Romy", color: "#22d3ee", accent: "#0e7490" }
  ];

  var phase = "menu"; // menu | playing | meeting | won | lost
  var crew = [];      // live instances
  var impostor = null;
  var sabotages = 0;  // sabotage events caused
  var maxSabotage = 4;
  var roundTime = 75; // seconds
  var timerLeft = roundTime;
  var lastT = 0;
  var raf = null;
  var warnRoom = null;  // {room, until}
  var sabCooldownUntil = 0;
  var meetingLog = [];

  function resize() {
    var rect = canvas.getBoundingClientRect();
    S = rect.width;
    canvas.width = S * DPR;
    canvas.height = S * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (phase === "menu") draw();
  }

  // ---------- sound ----------
  var AC = null, master = null, soundOn = true, musicOn = false, musicTimer = null;
  function ensureAudio() {
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        master = AC.createGain();
        master.gain.value = 0.5;
        master.connect(AC.destination);
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === "suspended") AC.resume();
  }
  var soundBtn = document.getElementById("soundBtn");
  soundBtn.addEventListener("click", function () {
    ensureAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.title = soundOn ? "Sound: on" : "Sound: off";
    if (soundOn) { musicOn = true; startMusic(); }
    else { musicOn = false; stopMusic(); }
  });
  function tone(freq, dur, type, vol, when) {
    if (!AC || !master || !soundOn) return;
    var t = AC.currentTime + (when || 0);
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noiseBurst(dur, vol, when, filterFreq) {
    if (!AC || !master || !soundOn) return;
    var t = AC.currentTime + (when || 0);
    var len = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = filterFreq || 900;
    var g = AC.createGain(); g.gain.value = vol || 0.25;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
  }
  var sfx = {
    complete: function () { tone(660, .08, "sine", .14); tone(990, .12, "sine", .12, .06); },
    sabotage: function () {
      tone(220, .18, "square", .18); tone(165, .24, "square", .18, .12); tone(110, .3, "square", .18, .28);
    },
    meeting: function () { tone(392, .12, "square", .15); tone(523, .12, "square", .15, .12); tone(659, .2, "square", .15, .24); },
    win: function () { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, .18, "square", .15, i * .13); }); },
    lose: function () { [392, 330, 262, 196].forEach(function (f, i) { tone(f, .22, "sawtooth", .13, i * .15); }); }
  };
  function startMusic() {
    if (!soundOn || !musicOn || !AC || !master) return;
    stopMusic();
    var notes = [196, 233, 262, 196, 262, 330, 262, 233];
    var idx = 0, t = AC.currentTime + 0.1;
    musicTimer = setInterval(function () {
      if (!soundOn || !musicOn || !AC) { stopMusic(); return; }
      tone(notes[idx % notes.length], 0.14, "triangle", 0.04, t - AC.currentTime);
      idx++; t += 0.18;
    }, 180);
  }
  function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

  // ---------- game logic ----------
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function makeCrew() {
    var imp = Math.floor(Math.random() * CREW.length);
    var instances = [];
    for (var i = 0; i < CREW.length; i++) {
      var room = pick(ROOMS);
      instances.push({
        name: CREW[i].name,
        color: CREW[i].color,
        accent: CREW[i].accent,
        isImp: i === imp,
        mx: room.fx + room.fw / 2 + (Math.random() - 0.5) * room.fw * 0.3,
        my: room.fy + room.fh / 2 + (Math.random() - 0.5) * room.fh * 0.3,
        roomId: ROOMS.indexOf(room),
        target: null,
        work: null,       // {room, t, dur, fake, roomId}
        step: 0,
        nextAt: 0
      });
    }
    return instances;
  }

  function roomCenter(r) { return { x: r.fx + r.fw / 2, y: r.fy + r.fh / 2 }; }

  function chooseAction(c) {
    // 60% move somewhere else, 40% work in current room
    if (Math.random() < 0.6) {
      var others = ROOMS.filter(function (r) { return r !== ROOMS[c.roomId]; });
      var r = pick(others);
      var pt = roomCenter(r);
      c.target = {
        x: pt.x + (Math.random() - 0.5) * r.fw * 0.3,
        y: pt.y + (Math.random() - 0.5) * r.fh * 0.3,
        roomId: ROOMS.indexOf(r)
      };
      c.step = 0;
    } else {
      var r = ROOMS[c.roomId];
      var fake = false;
      if (c.isImp) {
        var now = performance.now() / 1000;
        fake = now >= sabCooldownUntil;
        if (fake) sabCooldownUntil = now + 12 + Math.random() * 6;
      }
      c.work = {
        roomId: ROOMS.indexOf(r),
        t: 0,
        dur: fake ? 1.1 + Math.random() * 0.9 : 3 + Math.random() * 3,
        fake: fake
      };
    }
  }

  function startGame() {
    crew = makeCrew();
    impostor = crew.filter(function (c) { return c.isImp; })[0];
    sabotages = 0;
    roundTime = 75;
    timerLeft = roundTime;
    warnRoom = null;
    sabCooldownUntil = 6 + Math.random() * 4;
    meetingLog = [];
    ROOMS.forEach(function (r) { r.ok = true; r.flashUntil = 0; });
    log("info", "Shift started. 5 crew aboard, one impostor among you.");
    updateHud();
    meetingBtn.disabled = true;
    meetingBtn.textContent = "🚨 CALL EMERGENCY MEETING";
    phase = "playing";
    overlay.classList.add("hidden");
    ensureAudio();
    if (soundOn) { musicOn = true; startMusic(); }
    sfx.complete();
    if (!raf) loop(performance.now());
  }

  function roomOf(roomId) { return ROOMS[roomId]; }

  function log(kind, text) {
    meetingLog.push({ kind: kind, text: text, t: (roundTime - timerLeft) });
    if (meetingLog.length > 30) meetingLog.shift();
    var line = document.createElement("div");
    var cls = kind === "bad" ? "bad" : (kind === "good" ? "good" : "info");
    var time = Math.max(0, Math.floor(roundTime - timerLeft));
    line.className = cls;
    line.textContent = "[" + (time < 10 ? "0" : "") + time + "s] " + text;
    logbox.appendChild(line);
    while (logbox.childNodes.length > 5) logbox.removeChild(logbox.firstChild);
  }

  function doSabotage(roomId) {
    var r = ROOMS[roomId];
    r.ok = false;
    r.flashUntil = performance.now() / 1000 + 2.5;
    warnRoom = { room: r, until: performance.now() / 1000 + 3 };
    sabotages++;
    log("bad", r.name + " system failure! O₂ dropping.");
    sfx.sabotage();
    updateHud();
    if (sabotages >= maxSabotage) {
      setTimeout(function () { endGame(false, "Oxygen depleted — the impostor won."); }, 800);
    }
  }

  function callMeeting() {
    if (phase !== "playing") return;
    phase = "meeting";
    stopMusic();
    sfx.meeting();
    meetingBtn.disabled = true;
    buildMeetingScreen();
  }

  function buildMeetingScreen() {
    overlay.innerHTML = "";
    var h = document.createElement("h1");
    h.innerHTML = 'EMERGENCY<span> MEETING</span>';
    overlay.appendChild(h);

    var blurb = document.createElement("div");
    blurb.className = "sub";
    blurb.textContent = "An impostor is among you. Who sabotaged the ship?";
    overlay.appendChild(blurb);

    var grid = document.createElement("div");
    grid.className = "crewGrid";
    CREW.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "crewCard";
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = c.color;
      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = c.name;
      b.appendChild(dot);
      b.appendChild(nm);
      b.addEventListener("click", function () {
        var target = crew.filter(function (x) { return x.name === c.name; })[0];
        endGame(target && target.isImp, null);
      });
      grid.appendChild(b);
    });
    overlay.appendChild(grid);

    var lg = document.createElement("div");
    lg.className = "meetingLog";
    lg.innerHTML = meetingLog.map(function (e) {
      var cls = e.kind === "bad" ? "bad" : "";
      return '<div class="' + cls + '">[' + e.t + "s] " + e.text + "</div>";
    }).join("");
    overlay.appendChild(lg);
    overlay.classList.remove("hidden");
  }

  function endGame(won, forcedMsg) {
    phase = won ? "won" : "lost";
    stopMusic();
    var msg;
    if (won) {
      msg = "You caught the impostor — " + impostor.name + "! Crew safe.";
      sfx.win();
    } else {
      if (forcedMsg) msg = forcedMsg;
      else msg = "Wrong accusation! The impostor is " + impostor.name + ".";
      sfx.lose();
    }
    finalMsg.textContent = msg;
    finalMsg.style.display = "block";
    playBtn.textContent = "PLAY AGAIN";
    overlay.innerHTML = "";
    var h = document.createElement("h1");
    h.innerHTML = won ? "CREW <span>WINS</span>" : "IMPOSTOR <span>WINS</span>";
    overlay.appendChild(h);
    var f = document.createElement("div");
    f.className = "final";
    f.id = "finalMsg";
    f.style.display = "block";
    f.textContent = msg;
    overlay.appendChild(f);
    var b = document.createElement("button");
    b.className = "btn";
    b.id = "playBtn";
    b.textContent = "PLAY AGAIN";
    b.addEventListener("click", startGame);
    overlay.appendChild(b);
    overlay.classList.remove("hidden");
  }

  function updateHud() {
    var m = Math.max(0, Math.floor(timerLeft / 60));
    var s = Math.max(0, Math.floor(timerLeft % 60));
    timerEl.textContent = "⏱ " + m + ":" + (s < 10 ? "0" : "") + s;
    var o2 = Math.max(0, 100 - sabotages * 25);
    o2El.textContent = "O₂ " + o2 + "%";
    o2El.className = o2 <= 50 ? "o2 warn" : "o2";
    meetingBtn.disabled = sabotages < 1 || phase !== "playing";
  }

  function loop(ts) {
    raf = requestAnimationFrame(loop);
    var dt = Math.min((ts - lastT) / 1000, 0.05);
    lastT = ts;
    if (phase !== "playing") { draw(); return; }

    timerLeft -= dt;
    if (timerLeft <= 0) {
      timerLeft = 0;
      callMeeting();
      return;
    }
    updateHud();

    var now = performance.now() / 1000;

    for (var i = 0; i < crew.length; i++) {
      var c = crew[i];
      if (c.target) {
        var dx = c.target.x - c.mx, dy = c.target.y - c.my;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var spd = 0.12 * dt;
        if (dist < 0.01) {
          c.mx = c.target.x; c.my = c.target.y;
          c.roomId = c.target.roomId;
          c.target = null;
          c.step = 0;
          c.nextAt = now + 0.4 + Math.random() * 0.8;
        } else {
          c.mx += dx / dist * spd;
          c.my += dy / dist * spd;
          c.step += dt * 8;
        }
      } else if (c.work) {
        c.work.t += dt;
        if (c.work.fake && c.work.t >= c.work.dur) {
          var rid = c.work.roomId;
          c.work = null;
          doSabotage(rid);
          if (phase !== "playing") break;
        } else if (!c.work.fake && c.work.t >= c.work.dur) {
          ROOMS[c.work.roomId].ok = true;
          log("good", c.name + " fixed " + ROOMS[c.work.roomId].name);
          sfx.complete();
          c.work = null;
          c.nextAt = now + 0.5 + Math.random();
        }
      } else if (now >= c.nextAt) {
        chooseAction(c);
      }
    }

    if (warnRoom && now > warnRoom.until) warnRoom = null;
    draw();
  }

  // ---------- drawing ----------
  function px(x) { return x * S; }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function draw() {
    ctx.fillStyle = "#0a0f1e";
    ctx.fillRect(0, 0, S, S);

    // corridor
    ctx.fillStyle = "#131b30";
    ctx.fillRect(px(.42), 0, px(.16), S);
    ctx.fillRect(0, px(.49), S, px(.06));

    var now = performance.now() / 1000;

    for (var i = 0; i < ROOMS.length; i++) {
      var r = ROOMS[i];
      var x = px(r.fx), y = px(r.fy), w = px(r.fw), h = px(r.fh);
      var flashing = r.flashUntil && now < r.flashUntil;
      ctx.fillStyle = flashing ? "rgba(239,68,68,.28)" : "rgba(255,255,255,.045)";
      rr(x, y, w, h, 10);
      ctx.fill();
      ctx.strokeStyle = flashing ? "#ef4444" : "rgba(255,255,255,.16)";
      ctx.lineWidth = flashing ? 3 : 1.5;
      rr(x, y, w, h, 10);
      ctx.stroke();

      // room label
      ctx.fillStyle = flashing ? "#fecaca" : "#cbd5e1";
      ctx.font = "700 " + Math.max(11, S * 0.032) + "px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(r.name.toUpperCase(), x + w / 2, y + 16);

      // equipment bar
      var bw = w * 0.55, bx = x + (w - bw) / 2, by = y + h - 14;
      ctx.fillStyle = "rgba(0,0,0,.4)";
      rr(bx, by, bw, 6, 3); ctx.fill();
      if (r.ok) {
        ctx.fillStyle = "#22c55e";
        ctx.globalAlpha = 0.85;
        rr(bx, by, bw, 6, 3); ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = "#ef4444";
        ctx.globalAlpha = 0.85;
        rr(bx, by, bw, 6, 3); ctx.fill();
        ctx.globalAlpha = 1;
      }

      // warning icon
      if (warnRoom && warnRoom.room === r) {
        var bounce = Math.abs(Math.sin(now * 8)) * 4;
        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(x + w / 2, y + 24 - bounce, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "800 " + Math.max(11, S * 0.03) + "px system-ui, sans-serif";
        ctx.fillText("!", x + w / 2, y + 28 - bounce);
      }
    }

    // door dots on corridor edges
    ctx.fillStyle = "rgba(148,163,184,.25)";
    for (var d = 0; d < 4; d++) {
      var dx2 = px(.50), dy2 = px(.52);
      var pos = d === 0 ? [dx2, px(.02)] : d === 1 ? [dx2, px(.98)] :
                d === 2 ? [px(.02), dy2] : [px(.98), dy2];
      ctx.beginPath();
      ctx.arc(pos[0], pos[1], 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // crew
    for (var j = 0; j < crew.length; j++) drawCrew(crew[j], now);
  }

  function drawCrew(c, now) {
    var cx = px(c.mx), cy = px(c.my);
    var h = S * 0.075;
    var w = h * 0.72;
    var moving = !!c.target;
    var bob = moving ? Math.abs(Math.sin(c.step)) * h * 0.14 : Math.sin(now * 2 + c.step) * h * 0.03;

    // shadow
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.beginPath();
    ctx.ellipse(cx, cy + h * 0.42, w * 0.55, h * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();

    // legs
    ctx.strokeStyle = c.accent;
    ctx.lineWidth = w * 0.18;
    ctx.lineCap = "round";
    var lx = moving ? w * 0.22 : w * 0.16, rx = moving ? -w * 0.22 : -w * 0.16;
    var lift = moving ? Math.sin(c.step * 2) * h * 0.12 : 0;
    ctx.beginPath();
    ctx.moveTo(cx + lx, cy + h * 0.12);
    ctx.lineTo(cx + lx + Math.sin(c.step * 2) * h * 0.1, cy + h * 0.4 - lift);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + rx, cy + h * 0.12);
    ctx.lineTo(cx + rx + Math.sin(c.step * 2 + Math.PI) * h * 0.1, cy + h * 0.4 + lift);
    ctx.stroke();

    // backpack
    ctx.fillStyle = c.accent;
    rr(cx - w / 2 - w * 0.12, cy - h * 0.34, w * 0.24, h * 0.5, 4);
    ctx.fill();

    // body (bean)
    var g = ctx.createLinearGradient(cx, cy - h * 0.5, cx, cy + h * 0.4);
    g.addColorStop(0, c.color);
    g.addColorStop(1, c.accent);
    ctx.fillStyle = g;
    rr(cx - w / 2, cy - h * 0.5, w, h * 0.62, w * 0.5);
    ctx.fill();

    // visor
    ctx.fillStyle = "#0c1226";
    rr(cx - w * 0.18, cy - h * 0.46, w * 0.62, h * 0.22, 6);
    ctx.fill();
    ctx.fillStyle = "rgba(148,197,255,.65)";
    rr(cx - w * 0.18, cy - h * 0.46, w * 0.62, h * 0.22, 6);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath();
    ctx.arc(cx + w * 0.08, cy - h * 0.4, w * 0.08, 0, Math.PI * 2);
    ctx.fill();

    // name
    ctx.fillStyle = "rgba(226,232,240,.85)";
    ctx.font = "700 " + Math.max(9, S * 0.026) + "px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(c.name, cx, cy + h * 0.6);

    // working indicator
    if (c.work && phase === "playing") {
      var prog = Math.min(1, c.work.t / c.work.dur);
      ctx.fillStyle = "rgba(0,0,0,.45)";
      rr(cx - w * 0.4, cy + h * 0.68, w * 0.8, 4, 2); ctx.fill();
      ctx.fillStyle = c.work.fake ? "#fbbf24" : "#4ade80";
      rr(cx - w * 0.4, cy + h * 0.68, w * 0.8 * prog, 4, 2); ctx.fill();
    }

    // impostor subtle tell (only when revealed/after win-lose)
    if (c.isImp && (phase === "won" || phase === "lost")) {
      ctx.fillStyle = "#f87171";
      ctx.font = "800 " + Math.max(10, S * 0.028) + "px system-ui, sans-serif";
      ctx.fillText("IMPOSTOR", cx, cy + h * 0.78);
    }
  }

  // ---------- input ----------
  meetingBtn.addEventListener("click", callMeeting);
  playBtn.addEventListener("click", startGame);

  resize();
  window.addEventListener("resize", resize);
  draw();
})();
</script>
</body>
</html>
