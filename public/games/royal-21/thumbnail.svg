<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#1a2c14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <g transform="rotate(-12 88 96) translate(88 96) translate(-40 -48)">
      <rect x="0" y="0" width="58" height="82" rx="6" fill="#f8fafc" stroke="#3b4a6b" stroke-width="2"/>
      <text x="12" y="16" font-family="Segoe UI, sans-serif" font-weight="800" font-size="16" fill="#ef4444">A</text>
      <text x="29" y="48" font-family="Segoe UI, sans-serif" font-size="34" fill="#ef4444" text-anchor="middle">♥</text>
    </g>
    <g transform="rotate(10 122 112) translate(122 112) translate(-40 -48)">
      <rect x="0" y="0" width="58" height="82" rx="6" fill="#f8fafc" stroke="#3b4a6b" stroke-width="2"/>
      <text x="12" y="16" font-family="Segoe UI, sans-serif" font-weight="800" font-size="16" fill="#e2e8f0">K</text>
      <text x="29" y="48" font-family="Segoe UI, sans-serif" font-size="34" fill="#e2e8f0" text-anchor="middle">♠</text>
    </g>
  </g>
  <text x="100" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#fff" filter="url(#glow)">Royal 21</text>
</svg>
