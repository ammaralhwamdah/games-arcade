<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Penalty Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:'Segoe UI',Arial,sans-serif;touch-action:none;user-select:none}
canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:rgba(15,23,42,.92)}
#overlay.hidden{display:none}
#overlay h1{font-size:clamp(2rem,8vw,4.5rem);color:#4ade80;text-shadow:0 0 30px rgba(74,222,128,.5);margin-bottom:.2em;letter-spacing:.05em}
#overlay .subtitle{color:#94a3b8;font-size:clamp(.8rem,2.5vw,1.2rem);margin-bottom:2em}
#playBtn{padding:.8em 3em;font-size:clamp(1rem,3vw,1.5rem);border:none;border-radius:12px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(34,197,94,.4);transition:transform .15s,box-shadow .15s}
#playBtn:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(34,197,94,.6)}
#overlay .instructions{color:#64748b;font-size:clamp(.65rem,1.8vw,.85rem);margin-top:2em;text-align:center;line-height:1.6;max-width:340px}
</style>
</head>
<body>
<div id="overlay">
<h1>PENALTY PRO</h1>
<p class="subtitle">12-Yard Showdown</p>
<button id="playBtn">PLAY</button>
<p class="instructions">Click or tap a zone on the goal to shoot.<br>Beat the keeper 10 times to dominate!<br>Consecutive goals boost your multiplier.</p>
</div>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay");
const playBtn=document.getElementById("playBtn");

let W,H,dpr;
let fieldRect={x:0,y:0,w:0,h:0};
let goalRect={x:0,y:0,w:0,h:0};
let goalZones=[];
let kickerPos={x:0,y:0};

const STATE={MENU:0,AIMING:0.5,SHOOTING:1,GOAL:2,SAVED:3,MISSED:4,ROUND_END:5,GAME_OVER:6};
let state=STATE.MENU;
let score=0;
let highScore=parseInt(localStorage.getItem("penaltyProHS"))||0;
let kicksLeft=10;
let streak=0;
let bestStreak=0;
let multiplier=1;
let soundOn=true;
let animFrame=0;
let aimZone=null;

let ball={x:0,y:0,z:0,vx:0,vy:0,vz:0,spin:0,active:false,t:0};
let keeper={x:0,y:0,baseX:0,baseY:0,diveDir:0,diveT:0,diving:false,saved:false,saveX:0,saveY:0};
let netWave=[];
let particles=[];
let shakeT=0;
let shakeAmp=0;
let lastTime=0;
let cumulativeT=0;
let goalTextT=0;
let savedTextT=0;
let missTextT=0;
let comboTextT=0;
let crowdReactionT=0;
let savedX=0,savedY=0;

const audioCtx=(function(){
try{return new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
})();

function resumeAudio(){if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume()}

function playSound(type){
if(!audioCtx||!soundOn)return;
resumeAudio();
const now=audioCtx.currentTime;
try{
if(type==="kick"){
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type="sine";osc.frequency.setValueAtTime(180,now);osc.frequency.exponentialRampToValueAtTime(60,now+.15);
gain.gain.setValueAtTime(.5,now);gain.gain.exponentialRampToValueAtTime(.001,now+.15);
osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.15);
const n=audioCtx.createBufferSource();
const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.08,audioCtx.sampleRate);
const d=buf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
n.buffer=buf;const ng=audioCtx.createGain();ng.gain.setValueAtTime(.3,now);ng.gain.exponentialRampToValueAtTime(.001,now+.08);
n.connect(ng);ng.connect(audioCtx.destination);n.start(now);
}else if(type==="goal"){
[523,659,784,1047].forEach((f,i)=>{
const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();
osc.type="sine";osc.frequency.value=f;
gain.gain.setValueAtTime(0,now+i*.08);gain.gain.linearRampToValueAtTime(.2,now+i*.08+.02);gain.gain.exponentialRampToValueAtTime(.001,now+i*.08+.4);
osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+i*.08);osc.stop(now+i*.08+.4);
});
const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.8,audioCtx.sampleRate);
const d=buf.getChannelData(0);
for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*.15*Math.pow(1-i/d.length,1.5)}
const n=audioCtx.createBufferSource();n.buffer=buf;
const ng=audioCtx.createGain();ng.gain.setValueAtTime(.4,now);ng.gain.exponentialRampToValueAtTime(.001,now+.8);
n.connect(ng);ng.connect(audioCtx.destination);n.start(now);
}else if(type==="save"){
const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();
osc.type="triangle";osc.frequency.setValueAtTime(400,now);osc.frequency.exponentialRampToValueAtTime(150,now+.3);
gain.gain.setValueAtTime(.35,now);gain.gain.exponentialRampToValueAtTime(.001,now+.3);
osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.3);
}else if(type==="miss"){
const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();
osc.type="sawtooth";osc.frequency.setValueAtTime(200,now);osc.frequency.exponentialRampToValueAtTime(80,now+.4);
gain.gain.setValueAtTime(.15,now);gain.gain.exponentialRampToValueAtTime(.001,now+.4);
osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.4);
}else if(type==="whistle"){
const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();
osc.type="sine";osc.frequency.value=880;
gain.gain.setValueAtTime(.25,now);gain.gain.setValueAtTime(0,now+.15);gain.gain.setValueAtTime(.25,now+.2);gain.gain.exponentialRampToValueAtTime(.001,now+.6);
osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.6);
}
}catch(e){}
}

function resize(){
dpr=window.devicePixelRatio||1;
W=window.innerWidth;H=window.innerHeight;
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.width=W+"px";canvas.style.height=H+"px";
ctx.setTransform(dpr,0,0,dpr,0,0);
layoutField();
}

function layoutField(){
const isLandscape=W>H;
const fw=isLandscape?W*.7:W*.92;
const fh=isLandscape?H*.75:H*.55;
const fx=(W-fw)/2;
const fy=isLandscape?(H-fh)/2:H*.12;
fieldRect={x:fx,y:fy,w:fw,h:fh};

const gw=Math.min(fw*.55,360);
const gh=Math.min(fh*.4,170);
const gx=(W-gw)/2;
const gy=fieldRect.y+15;
goalRect={x:gx,y:gy,w:gw,h:gh};

const zw=gw/3,zh=gh/3;
goalZones=[];
for(let r=0;r<3;r++){
for(let c=0;c<3;c++){
goalZones.push({x:gx+c*zw,y:gy+r*zh,w:zw,h:zh,row:r,col:c,id:r*3+c});
}
}

kickerPos={x:W/2,y:fieldRect.y+fh-35};
keeper.baseX=W/2;keeper.baseY=gy+gh/2;
keeper.x=keeper.baseX;keeper.y=keeper.baseY;

netWave=[];
for(let i=0;i<=12;i++)netWave.push({y:0,vy:0});
}

function spawnParticles(x,y,color,count,speed){
for(let i=0;i<count;i++){
const a=Math.random()*Math.PI*2;
const s=Math.random()*speed+1;
particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.015+Math.random()*.02,color:color,r:Math.random()*3+1});
}
}

function drawField(){
const f=fieldRect;
ctx.fillStyle="#1a472a";
ctx.fillRect(f.x,f.y,f.w,f.h);

const grad=ctx.createLinearGradient(f.x,f.y,f.x,f.y+f.h);
grad.addColorStop(0,"rgba(255,255,255,.04)");
grad.addColorStop(.5,"rgba(0,0,0,.02)");
grad.addColorStop(1,"rgba(255,255,255,.04)");
ctx.fillStyle=grad;ctx.fillRect(f.x,f.y,f.w,f.h);

ctx.strokeStyle="rgba(255,255,255,.6)";ctx.lineWidth=2;
ctx.strokeRect(f.x,f.y,f.w,f.h);

const cx=f.x+f.w/2;
ctx.beginPath();ctx.moveTo(cx,f.y);ctx.lineTo(cx,f.y+f.h);ctx.stroke();
ctx.beginPath();
ctx.arc(cx,f.y+f.h/2,f.h*.3,0,Math.PI*2);
ctx.stroke();

ctx.fillStyle="rgba(255,255,255,.5)";
ctx.beginPath();ctx.arc(cx,f.y+f.h/2,4,0,Math.PI*2);ctx.fill();

const g=goalRect;
ctx.fillStyle="rgba(200,200,200,.15)";
ctx.fillRect(g.x,g.y,g.w,g.h);

ctx.strokeStyle="#fff";ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(g.x-10,g.y);ctx.lineTo(g.x,g.y);ctx.lineTo(g.x,g.y+g.h);
ctx.lineTo(g.x+g.w,g.y+g.h);ctx.lineTo(g.x+g.w,g.y);ctx.lineTo(g.x+g.w+10,g.y);
ctx.stroke();

ctx.lineWidth=2;
for(let i=1;i<3;i++){
ctx.beginPath();ctx.moveTo(g.x+i*g.w/3,g.y);ctx.lineTo(g.x+i*g.w/3,g.y+g.h);ctx.stroke();
}
for(let i=1;i<3;i++){
ctx.beginPath();ctx.moveTo(g.x,g.y+i*g.h/3);ctx.lineTo(g.x+g.w,g.y+i*g.h/3);ctx.stroke();
}

for(let i=0;i<netWave.length;i++){
const nx=g.x+i*(g.w/12);
const ny=g.y+g.h;
ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(nx,ny);ctx.lineTo(nx+g.w/24,ny+20+netWave[i].y);ctx.stroke();
}
for(let j=0;j<5;j++){
ctx.beginPath();
const baseY=g.y+g.h+j*5;
for(let i=0;i<=12;i++){
const nx=g.x+i*(g.w/12);
const ny=baseY+netWave[i].y*(1-j*.15);
if(i===0)ctx.moveTo(nx,ny);else ctx.lineTo(nx,ny);
}
ctx.stroke();
}

if(state===STATE.AIMING||state===STATE.SHOOTING){
const g2=goalRect;
for(let i=0;i<9;i++){
const z=goalZones[i];
const isTarget=aimZone===i;
ctx.fillStyle=isTarget?"rgba(74,222,128,.25)":"rgba(255,255,255,.06)";
ctx.fillRect(z.x+2,z.y+2,z.w-4,z.h-4);
ctx.strokeStyle=isTarget?"rgba(74,222,128,.7)":"rgba(255,255,255,.15)";
ctx.lineWidth=isTarget?2:1;
ctx.strokeRect(z.x+2,z.y+2,z.w-4,z.h-4);
}
}
}

function drawKeeper(){
const k=keeper;
const t=k.diveT;
const dir=k.diveDir;
let offX=0,offY=0;
let rotation=0;
const sc=Math.min(W/400,H/300,1);

if(k.diving){
const progress=Math.min(t,1);
const eased=Math.sin(progress*Math.PI/2);
offX=dir===0?-70:dir===2?70:dir%3===0?-50:dir%3===2?50:0;
offY=dir<3?-50:dir<6?0:50;
offX*=eased*sc;offY*=eased*sc;
rotation=eased*(dir===0||dir===3?-1:dir===2||dir===5?1:0)*.6;
}

const x=k.x+offX;
const y=k.y+offY;

ctx.save();
ctx.translate(x,y);
ctx.scale(sc,sc);
ctx.rotate(rotation);

ctx.fillStyle="#f59e0b";
ctx.fillRect(-12,-18,24,36);

ctx.fillStyle="#f59e0b";
ctx.beginPath();ctx.arc(0,-24,8,0,Math.PI*2);ctx.fill();

ctx.fillStyle="#1e293b";
ctx.fillRect(-18,-16,36,8);

const armSpread=k.diving?Math.min(t*3,1)*28:0;
ctx.fillStyle="#f59e0b";
if(k.diving){
ctx.save();ctx.rotate(-Math.PI/4*Math.min(t*3,1));
ctx.fillRect(-4-armSpread,-14,8,20);ctx.restore();
ctx.save();ctx.rotate(Math.PI/4*Math.min(t*3,1));
ctx.fillRect(-4+armSpread-8,-14,8,20);ctx.restore();
}else{
ctx.fillRect(-22,-14,8,20);
ctx.fillRect(14,-14,8,20);
}

ctx.fillStyle="#78350f";
ctx.fillRect(-8,18,7,10);
ctx.fillRect(1,18,7,10);

ctx.restore();
}

function drawKicker(){
const kx=kickerPos.x;
const ky=kickerPos.y;
const kicking=state===STATE.SHOOTING&&ball.t<.15;
const kickAngle=kicking?-.3:0;
const sc=Math.min(W/400,H/300,1);

ctx.save();
ctx.translate(kx,ky);
ctx.scale(sc,sc);
ctx.rotate(kickAngle);

ctx.fillStyle="#3b82f6";
ctx.fillRect(-10,-20,20,24);

ctx.fillStyle="#fbbf24";
ctx.beginPath();ctx.arc(0,-26,7,0,Math.PI*2);ctx.fill();

ctx.fillStyle="#f8fafc";
ctx.fillRect(-14,-18,28,8);

ctx.fillStyle="#3b82f6";
ctx.fillRect(-12,4,9,18);
ctx.fillRect(3,4,9,18);

if(kicking){
ctx.save();ctx.rotate(-.5);
ctx.fillStyle="#1e293b";
ctx.fillRect(-4,22,8,12);
ctx.restore();
}else{
ctx.fillStyle="#1e293b";
ctx.fillRect(-10,22,8,10);
ctx.fillRect(2,22,8,10);
}

ctx.restore();
}

function drawBall(){
if(!ball.active&&state!==STATE.SHOOTING)return;
const bx=ball.x;
const by=ball.y-ball.z;
const size=(8+ball.z*.02)*Math.min(W/400,H/300,1);

const shadowAlpha=Math.max(0,.3-ball.z*.003);
ctx.fillStyle=`rgba(0,0,0,${shadowAlpha})`;
ctx.beginPath();ctx.ellipse(bx,ball.y+5,size*.8,size*.3,0,0,Math.PI*2);ctx.fill();

ctx.fillStyle="#fff";
ctx.beginPath();ctx.arc(bx,by,size,0,Math.PI*2);ctx.fill();

ctx.strokeStyle="#333";ctx.lineWidth=1;
ctx.beginPath();ctx.arc(bx,by,size,0,Math.PI*2);ctx.stroke();

const patternAngle=ball.spin*cumulativeT;
ctx.save();ctx.translate(bx,by);ctx.rotate(patternAngle);
ctx.fillStyle="#333";
for(let i=0;i<5;i++){
const a=i*Math.PI*2/5;
ctx.beginPath();ctx.arc(Math.cos(a)*size*.45,Math.sin(a)*size*.45,size*.18,0,Math.PI*2);ctx.fill();
}
ctx.restore();
}

function drawAimGuide(){
if(state!==STATE.AIMING)return;
const mx=lastMouse.x,my=lastMouse.y;
if(mx===0&&my===0)return;

ctx.strokeStyle="rgba(74,222,128,.3)";ctx.lineWidth=2;
ctx.setLineDash([6,4]);
ctx.beginPath();ctx.moveTo(kickerPos.x,kickerPos.y-10);
ctx.lineTo(mx,my);ctx.stroke();
ctx.setLineDash([]);
}

function drawParticles(){
for(const p of particles){
ctx.globalAlpha=p.life;
ctx.fillStyle=p.color;
ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
}
ctx.globalAlpha=1;
}

function drawHUD(){
const pad=15;
const fontSize=Math.max(14,W*.022);

ctx.fillStyle="rgba(15,23,42,.7)";
roundRect(8,8,W*.38,fontSize*2.8+16,10);

ctx.fillStyle="#f8fafc";ctx.font=`bold ${fontSize}px 'Segoe UI',Arial,sans-serif`;ctx.textAlign="left";
ctx.fillText(`Score: ${score}`,pad,pad+fontSize);

ctx.fillStyle="#94a3b8";ctx.font=`${fontSize*.85}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText(`Kicks: ${kicksLeft}`,pad,pad+fontSize*1.7);

if(multiplier>1){
ctx.fillStyle="#fbbf24";ctx.font=`bold ${fontSize}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText(`x${multiplier}`,pad+fontSize*7,pad+fontSize);
}

if(streak>=2){
ctx.fillStyle="#4ade80";ctx.font=`bold ${fontSize*.85}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText(`Streak: ${streak}`,pad,pad+fontSize*2.5);
}

ctx.fillStyle="rgba(15,23,42,.7)";
roundRect(W-52,8,44,36,8);
ctx.fillStyle=soundOn?"#4ade80":"#64748b";
ctx.font=`${fontSize}px Arial,sans-serif`;ctx.textAlign="center";
ctx.fillText(soundOn?"\u266b":"\u2716",W-30,32);

ctx.textAlign="center";

if(goalTextT>0){
const a=Math.min(goalTextT*3,1);
ctx.save();ctx.globalAlpha=a;
const s=1+(1-a)*.5;
ctx.translate(W/2,H*.45);ctx.scale(s,s);
ctx.fillStyle="#4ade80";ctx.font=`bold ${fontSize*3}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText("GOAL!",0,0);
if(multiplier>1){ctx.fillStyle="#fbbf24";ctx.font=`bold ${fontSize*1.5}px 'Segoe UI',Arial,sans-serif`;ctx.fillText(`x${multiplier}!`,0,fontSize*2.5)}
ctx.restore();
ctx.globalAlpha=1;
}

if(savedTextT>0){
const a=Math.min(savedTextT*3,1);
ctx.save();ctx.globalAlpha=a;
ctx.fillStyle="#ef4444";ctx.font=`bold ${fontSize*2.5}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText("SAVED!",W/2,H*.45);
ctx.restore();ctx.globalAlpha=1;
}

if(missTextT>0){
const a=Math.min(missTextT*3,1);
ctx.save();ctx.globalAlpha=a;
ctx.fillStyle="#f97316";ctx.font=`bold ${fontSize*2.5}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText("MISSED!",W/2,H*.45);
ctx.restore();ctx.globalAlpha=1;
}

if(comboTextT>0){
const a=Math.min(comboTextT*4,1);
ctx.save();ctx.globalAlpha=a;
ctx.fillStyle="#fbbf24";ctx.font=`bold ${fontSize*1.3}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText("COMBO!",W/2,H*.52);
ctx.restore();ctx.globalAlpha=1;
}

if(highScore>0&&state!==STATE.GAME_OVER){
ctx.fillStyle="#64748b";ctx.font=`${fontSize*.75}px 'Segoe UI',Arial,sans-serif`;ctx.textAlign="right";
ctx.fillText(`Best: ${highScore}`,W-15,pad+fontSize);
}
}

function drawGameOver(){
if(state!==STATE.GAME_OVER)return;
ctx.fillStyle="rgba(15,23,42,.85)";
ctx.fillRect(0,0,W,H);

const fs=Math.max(18,W*.04);
ctx.textAlign="center";

ctx.fillStyle="#f8fafc";ctx.font=`bold ${fs*2}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText("GAME OVER",W/2,H*.3);

ctx.fillStyle="#4ade80";ctx.font=`bold ${fs*1.8}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText(`Score: ${score}`,W/2,H*.42);

if(score>=highScore){
ctx.fillStyle="#fbbf24";ctx.font=`bold ${fs}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText("NEW HIGH SCORE!",W/2,H*.5);
}

ctx.fillStyle="#94a3b8";ctx.font=`${fs*.8}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText(`Best Streak: ${bestStreak}`,W/2,H*.57);

ctx.fillStyle="rgba(74,222,128,.2)";roundRect(W/2-80,H*.65,160,fs*1.8,10);
ctx.fillStyle="#4ade80";ctx.font=`bold ${fs}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText("PLAY AGAIN",W/2,H*.65+fs*1.2);
}

function drawRoundEnd(){
if(state!==STATE.ROUND_END)return;
ctx.fillStyle="rgba(15,23,42,.75)";
ctx.fillRect(0,0,W,H);

const fs=Math.max(16,W*.032);
ctx.textAlign="center";
ctx.fillStyle="#f8fafc";ctx.font=`bold ${fs*1.5}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText("ROUND COMPLETE",W/2,H*.35);
ctx.fillStyle="#94a3b8";ctx.font=`${fs}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText(`Score: ${score}`,W/2,H*.44);

ctx.fillStyle="rgba(74,222,128,.2)";roundRect(W/2-90,H*.52,180,fs*1.8,10);
ctx.fillStyle="#4ade80";ctx.font=`bold ${fs}px 'Segoe UI',Arial,sans-serif`;
ctx.fillText("NEXT ROUND",W/2,H*.52+fs*1.2);
}

function roundRect(x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
ctx.closePath();ctx.fill();
}

let lastMouse={x:0,y:0};
function getZoneFromPos(px,py){
for(let i=0;i<9;i++){
const z=goalZones[i];
if(px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h)return i;
}
return null;
}

function startGame(){
state=STATE.AIMING;
score=0;kicksLeft=10;streak=0;bestStreak=0;multiplier=1;
ball.active=false;ball.z=0;
keeper.diving=false;keeper.diveT=0;keeper.diveDir=0;
keeper.x=keeper.baseX;keeper.y=keeper.baseY;
particles=[];aimZone=null;
playSound("whistle");
}

function shoot(zone){
if(state!==STATE.AIMING)return;
state=STATE.SHOOTING;
aimZone=zone;
resumeAudio();

const z=goalZones[zone];
const tx=z.x+z.w/2;
const ty=z.y+z.h/2;

ball.x=kickerPos.x;
ball.y=kickerPos.y-10;
ball.z=0;
ball.spin=(Math.random()-.5)*2;
ball.active=true;
ball.t=0;

const dist=Math.hypot(tx-kickerPos.x,ty-kickerPos.y);
const dur=.45;
ball.vx=(tx-kickerPos.x)/60;
ball.vy=(ty-kickerPos.y-20)/60;
ball.vz=140/dur;

keeper.diveDir=Math.floor(Math.random()*9);
keeper.diving=true;
keeper.diveT=0;

playSound("kick");
spawnParticles(kickerPos.x,kickerPos.y,"#fff",6,3);
}

function onGoal(){
state=STATE.GOAL;
ball.active=false;
score+=10*multiplier;
streak++;
if(streak>bestStreak)bestStreak=streak;
multiplier=Math.min(1+Math.floor(streak/2),5);
goalTextT=2;
crowdReactionT=1.5;
playSound("goal");
playSound("whistle");
shakeT=.3;shakeAmp=5;

for(let i=0;i<netWave.length;i++){
netWave[i].vy=-8-Math.random()*4;
}

spawnParticles(ball.x,ball.y-ball.z,"#4ade80",20,4);
spawnParticles(ball.x,ball.y-ball.z,"#fbbf24",10,3);

if(streak>=3)comboTextT=1.5;
}

function onSaved(){
state=STATE.SAVED;
ball.active=false;
streak=0;multiplier=1;
savedTextT=2;
playSound("save");
shakeT=.2;shakeAmp=3;
spawnParticles(keeper.x,keeper.y,"#ef4444",12,3);
savedX=keeper.x;savedY=keeper.y;
}

function onMiss(){
state=STATE.MISSED;
ball.active=false;
streak=0;multiplier=1;
missTextT=2;
playSound("miss");
}

function nextKick(){
kicksLeft--;
if(kicksLeft<=0){
state=STATE.ROUND_END;
playSound("whistle");
if(score>highScore){highScore=score;localStorage.setItem("penaltyProHS",highScore)}
return;
}
state=STATE.AIMING;
keeper.diving=false;keeper.diveT=0;
keeper.x=keeper.baseX;keeper.y=keeper.baseY;
ball.active=false;ball.z=0;
aimZone=null;
}

function update(dt){
cumulativeT+=dt;
animFrame+=dt*60;

if(goalTextT>0)goalTextT-=dt;
if(savedTextT>0)savedTextT-=dt;
if(missTextT>0)missTextT-=dt;
if(comboTextT>0)comboTextT-=dt;
if(crowdReactionT>0)crowdReactionT-=dt;

if(state===STATE.SHOOTING&&ball.active){
ball.t+=dt*2.2;
ball.x+=ball.vx*60*dt;
ball.y+=ball.vy*60*dt;
ball.vz-=220*dt;
ball.z+=ball.vz*dt;

if(ball.z<=0){
ball.z=0;
if(keeper.diving){
const kx=keeper.x;
const ky=keeper.y;
const bx=ball.x;
const by=ball.y;
const dist=Math.hypot(bx-kx,by-ky);
const sc=Math.min(W/400,H/300,1);
if(dist<30*sc){
onSaved();return;
}
}
const gz=goalRect;
if(ball.x>gz.x&&ball.x<gz.x+gz.w&&ball.y>gz.y&&ball.y<gz.y+gz.h){
onGoal();return;
}else{
onMiss();return;
}
}
}

if(keeper.diving&&keeper.diveT<1.5){
keeper.diveT+=dt*2.5;
}

for(let i=0;i<netWave.length;i++){
netWave[i].vy+=(-netWave[i].y*12)*dt;
netWave[i].vy*=.92;
netWave[i].y+=netWave[i].vy*60*dt;
}

for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx;p.y+=p.vy;
p.vy+=.1;
p.life-=p.decay;
if(p.life<=0)particles.splice(i,1);
}

if(shakeT>0){shakeT-=dt;if(shakeT<=0){shakeT=0;shakeAmp=0}}
}

function render(){
ctx.clearRect(0,0,W,H);

ctx.save();
if(shakeT>0){
const sx=(Math.random()-.5)*shakeAmp;
const sy=(Math.random()-.5)*shakeAmp;
ctx.translate(sx,sy);
}

drawField();
drawKicker();
drawKeeper();
drawBall();
drawAimGuide();
drawParticles();

ctx.restore();

drawHUD();
drawGameOver();
drawRoundEnd();
}

function loop(ts){
const dt=Math.min((ts-lastTime)/1000,.05);
lastTime=ts;
update(dt);
render();
requestAnimationFrame(loop);
}

canvas.addEventListener("click",function(e){
resumeAudio();
if(state===STATE.GAME_OVER||state===STATE.ROUND_END){
startGame();return;
}
if(state!==STATE.AIMING)return;
const rect=canvas.getBoundingClientRect();
const px=(e.clientX-rect.left);
const py=(e.clientY-rect.top);
const z=getZoneFromPos(px,py);
if(z!==null)shoot(z);
});

canvas.addEventListener("mousemove",function(e){
const rect=canvas.getBoundingClientRect();
lastMouse.x=e.clientX-rect.left;
lastMouse.y=e.clientY-rect.top;
if(state===STATE.AIMING){
aimZone=getZoneFromPos(lastMouse.x,lastMouse.y);
}
});

canvas.addEventListener("touchstart",function(e){
e.preventDefault();
resumeAudio();
if(state===STATE.GAME_OVER||state===STATE.ROUND_END){
startGame();return;
}
if(state!==STATE.AIMING)return;
const touch=e.touches[0];
const rect=canvas.getBoundingClientRect();
const px=(touch.clientX-rect.left);
const py=(touch.clientY-rect.top);
const z=getZoneFromPos(px,py);
if(z!==null)shoot(z);
},{passive:false});

canvas.addEventListener("touchmove",function(e){
e.preventDefault();
},{passive:false});

playBtn.addEventListener("click",function(){
resumeAudio();
overlay.classList.add("hidden");
startGame();
});

window.addEventListener("resize",resize);
resize();
lastTime=performance.now();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
