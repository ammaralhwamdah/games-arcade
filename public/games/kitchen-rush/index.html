<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kitchen Rush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<script>
(function(){
"use strict";

var canvas=document.getElementById("gc"),ctx=canvas.getContext("2d");
var dpr=window.devicePixelRatio||1;
var W,H,scale=1;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scale=Math.min(W/480,H/800);
}
resize();
window.addEventListener("resize",resize);

var soundOn=true;
var audioCtx=null;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}

function playSound(type){
  if(!soundOn)return;ensureAudio();
  var o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);
  var t=audioCtx.currentTime;
  switch(type){
    case"sizzle":
      o.type="sawtooth";o.frequency.setValueAtTime(120,t);o.frequency.linearRampToValueAtTime(80,t+.3);
      g.gain.setValueAtTime(.06,t);g.gain.linearRampToValueAtTime(0,t+.3);
      o.start(t);o.stop(t+.3);break;
    case"ding":
      o.type="sine";o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(440,t+.15);
      g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);
      o.start(t);o.stop(t+.4);break;
    case"chop":
      o.type="square";o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(100,t+.08);
      g.gain.setValueAtTime(.1,t);g.gain.linearRampToValueAtTime(0,t+.08);
      o.start(t);o.stop(t+.08);break;
    case"wrong":
      o.type="square";o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(100,t+.25);
      g.gain.setValueAtTime(.1,t);g.gain.linearRampToValueAtTime(0,t+.25);
      o.start(t);o.stop(t+.25);break;
    case"combo":
      o.type="sine";o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+.08);
      o.frequency.setValueAtTime(784,t+.16);o.frequency.setValueAtTime(1047,t+.24);
      g.gain.setValueAtTime(.12,t);g.gain.linearRampToValueAtTime(0,t+.4);
      o.start(t);o.stop(t+.4);break;
    case"levelup":
      o.type="triangle";o.frequency.setValueAtTime(440,t);o.frequency.setValueAtTime(554,t+.12);
      o.frequency.setValueAtTime(659,t+.24);o.frequency.setValueAtTime(880,t+.36);
      g.gain.setValueAtTime(.12,t);g.gain.linearRampToValueAtTime(0,t+.55);
      o.start(t);o.stop(t+.55);break;
    case"gameover":
      o.type="sawtooth";o.frequency.setValueAtTime(400,t);o.frequency.linearRampToValueAtTime(100,t+.6);
      g.gain.setValueAtTime(.1,t);g.gain.linearRampToValueAtTime(0,t+.6);
      o.start(t);o.stop(t+.6);break;
  }
}

var RECIPES=[
  {name:"Burger",icon:"burger",ingredients:["bun","patty","lettuce","bun"],color:"#e8a435"},
  {name:"Pizza",icon:"pizza",ingredients:["dough","sauce","cheese","topping"],color:"#e05555"},
  {name:"Salad",icon:"salad",ingredients:["lettuce","tomato","onion","dressing"],color:"#5cb85c"},
  {name:"Sushi",icon:"sushi",ingredients:["rice","fish","seaweed","rice"],color:"#5bc0de"},
  {name:"Taco",icon:"taco",ingredients:["shell","meat","cheese","salsa"],color:"#f0ad4e"},
  {name:"Pasta",icon:"pasta",ingredients:["pasta","sauce","cheese","herb"],color:"#d9534f"},
  {name:"Soup",icon:"soup",ingredients:["broth","vegetable","spice","cream"],color:"#c27ba0"},
  {name:"Sandwich",icon:"sandwich",ingredients:["bread","meat","lettuce","bread"],color:"#8e6e53"}
];

var INGREDIENT_LIST=[
  {id:"bun",label:"Bun",color:"#e8a435",shape:"round"},
  {id:"patty",label:"Patty",color:"#8B4513",shape:"round"},
  {id:"lettuce",label:"Lettuce",color:"#5cb85c",shape:"leaf"},
  {id:"dough",label:"Dough",color:"#f5deb3",shape:"round"},
  {id:"sauce",label:"Sauce",color:"#e05555",shape:"drop"},
  {id:"cheese",label:"Cheese",color:"#f0c040",shape:"triangle"},
  {id:"topping",label:"Topping",color:"#c0392b",shape:"dot"},
  {id:"tomato",label:"Tomato",color:"#e74c3c",shape:"round"},
  {id:"onion",label:"Onion",color:"#dda0dd",shape:"ring"},
  {id:"dressing",label:"Dressing",color:"#f39c12",shape:"drop"},
  {id:"rice",label:"Rice",color:"#f5f5dc",shape:"mound"},
  {id:"fish",label:"Fish",color:"#5bc0de",shape:"fish"},
  {id:"seaweed",label:"Seaweed",color:"#2d572c",shape:"sheet"},
  {id:"shell",label:"Shell",color:"#f0ad4e",shape:"half"},
  {id:"meat",label:"Meat",color:"#a0522d",shape:"round"},
  {id:"salsa",label:"Salsa",color:"#ff6347",shape:"drop"},
  {id:"pasta",label:"Pasta",color:"#f5deb3",shape:"strand"},
  {id:"herb",label:"Herb",color:"#228B22",shape:"leaf"},
  {id:"broth",label:"Broth",color:"#deb887",shape:"drop"},
  {id:"vegetable",label:"Veggie",color:"#32CD32",shape:"round"},
  {id:"spice",label:"Spice",color:"#ff4500",shape:"dot"},
  {id:"cream",label:"Cream",color:"#fffdd0",shape:"drop"},
  {id:"bread",label:"Bread",color:"#cd853f",shape:"round"}
];

var state="menu";
var score=0,highScore=0,timer=0,combo=0,comboMult=1;
var difficulty=1;
var orders=[];
var particles=[];
var screenShake=0;
var lastTime=0;
var dt=0;
var timerBlink=0;
var servedCount=0;
var levelUnlocks=[0,150,400];

try{highScore=parseInt(localStorage.getItem("kr_hi"))||0}catch(e){}

function getIngredientDef(id){for(var i=0;i<INGREDIENT_LIST.length;i++)if(INGREDIENT_LIST[i].id===id)return INGREDIENT_LIST[i];return INGREDIENT_LIST[0]}

function spawnOrder(){
  var maxRecipes=difficulty===1?4:difficulty===2?6:8;
  var r=RECIPES[Math.floor(Math.random()*maxRecipes)];
  var baseTime=[30,22,16][difficulty-1];
  var timeVariance=[8,6,4][difficulty-1];
  orders.push({
    recipe:r,
    progress:0,
    timer:baseTime+Math.random()*timeVariance,
    maxTimer:baseTime+timeVariance,
    shakeX:0,shakeY:0,
    flash:0
  });
}

function spawnParticles(x,y,color,count,speed){
  for(var i=0;i<count;i++){
    var a=Math.random()*Math.PI*2;
    var sp=(Math.random()*.5+.5)*(speed||3);
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:Math.random()*.02+.015,color:color,size:Math.random()*4+2});
  }
}

function drawIngredientIcon(cx,cy,id,sz){
  var d=getIngredientDef(id);
  ctx.save();ctx.translate(cx,cy);
  var s=sz/24;
  ctx.fillStyle=d.color;
  switch(d.shape){
    case"round":
      ctx.beginPath();ctx.arc(0,0,12*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.25)";ctx.beginPath();ctx.arc(-3*s,-3*s,5*s,0,Math.PI*2);ctx.fill();
      break;
    case"leaf":
      ctx.beginPath();ctx.moveTo(0,-10*s);ctx.quadraticCurveTo(12*s,0,0,10*s);ctx.quadraticCurveTo(-12*s,0,0,-10*s);ctx.fill();
      ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(0,-8*s);ctx.lineTo(0,8*s);ctx.stroke();
      break;
    case"drop":
      ctx.beginPath();ctx.moveTo(0,-10*s);ctx.quadraticCurveTo(10*s,2*s,0,10*s);ctx.quadraticCurveTo(-10*s,2*s,0,-10*s);ctx.fill();
      break;
    case"triangle":
      ctx.beginPath();ctx.moveTo(0,-10*s);ctx.lineTo(11*s,8*s);ctx.lineTo(-11*s,8*s);ctx.closePath();ctx.fill();
      break;
    case"dot":
      ctx.beginPath();ctx.arc(0,0,8*s,0,Math.PI*2);ctx.fill();
      break;
    case"mound":
      ctx.beginPath();ctx.arc(0,2*s,11*s,Math.PI,0);ctx.lineTo(11*s,6*s);ctx.arc(0,6*s,11*s,0,Math.PI);ctx.closePath();ctx.fill();
      break;
    case"fish":
      ctx.beginPath();ctx.moveTo(10*s,0);ctx.quadraticCurveTo(0,-10*s,-10*s,0);ctx.quadraticCurveTo(0,10*s,10*s,0);ctx.fill();
      ctx.beginPath();ctx.moveTo(-10*s,0);ctx.lineTo(-15*s,-6*s);ctx.lineTo(-15*s,6*s);ctx.closePath();ctx.fill();
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(5*s,-2*s,2*s,0,Math.PI*2);ctx.fill();
      break;
    case"sheet":
      ctx.fillRect(-10*s,-8*s,20*s,16*s);ctx.fillStyle="rgba(0,0,0,.15)";ctx.fillRect(-8*s,-6*s,3*s,3*s);ctx.fillRect(2*s,1*s,3*s,3*s);
      break;
    case"half":
      ctx.beginPath();ctx.arc(0,2*s,11*s,Math.PI,0);ctx.closePath();ctx.fill();
      break;
    case"strand":
      for(var i=-1;i<=1;i++){ctx.strokeStyle=d.color;ctx.lineWidth=3*s;ctx.beginPath();ctx.moveTo(i*5*s,-10*s);ctx.quadraticCurveTo(i*5*s+4*s,0,i*5*s,10*s);ctx.stroke()}
      break;
    case"ring":
      ctx.beginPath();ctx.arc(0,0,10*s,0,Math.PI*2);ctx.fill();ctx.fillStyle="#0f172a";ctx.beginPath();ctx.arc(0,0,5*s,0,Math.PI*2);ctx.fill();
      break;
  }
  ctx.restore();
}

function drawFoodIcon(cx,cy,type,sz){
  ctx.save();ctx.translate(cx,cy);var s=sz/48;
  switch(type){
    case"burger":
      ctx.fillStyle="#e8a435";ctx.beginPath();ctx.ellipse(0,-8*s,18*s,8*s,0,Math.PI,0);ctx.fill();
      ctx.fillStyle="#5cb85c";ctx.fillRect(-16*s,-4*s,32*s,4*s);
      ctx.fillStyle="#8B4513";ctx.fillRect(-15*s,0,30*s,8*s);
      ctx.fillStyle="#e8a435";ctx.fillRect(-16*s,8*s,32*s,6*s);
      break;
    case"pizza":
      ctx.fillStyle="#f5deb3";ctx.beginPath();ctx.moveTo(-16*s,-12*s);ctx.lineTo(16*s,-12*s);ctx.lineTo(0,14*s);ctx.closePath();ctx.fill();
      ctx.fillStyle="#e05555";ctx.beginPath();ctx.arc(-4*s,-2*s,5*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#f0c040";ctx.beginPath();ctx.arc(5*s,-5*s,3*s,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-2*s,5*s,3*s,0,Math.PI*2);ctx.fill();
      break;
    case"salad":
      ctx.fillStyle="#5cb85c";ctx.beginPath();ctx.ellipse(0,2*s,16*s,10*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#e74c3c";ctx.beginPath();ctx.arc(-5*s,0,3*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#f0c040";ctx.beginPath();ctx.arc(6*s,-2*s,2.5*s,0,Math.PI*2);ctx.fill();
      break;
    case"sushi":
      ctx.fillStyle="#2d572c";ctx.fillRect(-14*s,-8*s,28*s,16*s);
      ctx.fillStyle="#f5f5dc";ctx.beginPath();ctx.ellipse(0,0,10*s,6*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#5bc0de";ctx.beginPath();ctx.ellipse(0,-1*s,7*s,3.5*s,0,0,Math.PI*2);ctx.fill();
      break;
    case"taco":
      ctx.fillStyle="#f0ad4e";ctx.beginPath();ctx.arc(0,4*s,16*s,Math.PI,0);ctx.closePath();ctx.fill();
      ctx.fillStyle="#a0522d";ctx.fillRect(-10*s,-2*s,6*s,6*s);
      ctx.fillStyle="#f0c040";ctx.fillRect(-2*s,-3*s,6*s,5*s);
      ctx.fillStyle="#ff6347";ctx.fillRect(6*s,-2*s,4*s,4*s);
      break;
    case"pasta":
      ctx.fillStyle="#f5deb3";for(var i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*5*s,-10*s);ctx.quadraticCurveTo(i*5*s+6*s,0,i*5*s,10*s);ctx.lineWidth=3*s;ctx.strokeStyle="#f5deb3";ctx.stroke()}
      ctx.fillStyle="#e05555";ctx.beginPath();ctx.arc(0,0,6*s,0,Math.PI*2);ctx.fill();
      break;
    case"soup":
      ctx.fillStyle="#c27ba0";ctx.beginPath();ctx.ellipse(0,4*s,16*s,8*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#deb887";ctx.beginPath();ctx.ellipse(0,2*s,14*s,5*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#228B22";ctx.beginPath();ctx.arc(-4*s,1*s,2*s,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3*s,2*s,1.5*s,0,Math.PI*2);ctx.fill();
      break;
    case"sandwich":
      ctx.fillStyle="#cd853f";ctx.fillRect(-14*s,-12*s,28*s,6*s);
      ctx.fillStyle="#5cb85c";ctx.fillRect(-12*s,-6*s,24*s,3*s);
      ctx.fillStyle="#a0522d";ctx.fillRect(-12*s,-3*s,24*s,5*s);
      ctx.fillStyle="#f0c040";ctx.fillRect(-12*s,2*s,24*s,3*s);
      ctx.fillStyle="#cd853f";ctx.fillRect(-14*s,5*s,28*s,6*s);
      break;
  }
  ctx.restore();
}

function drawBg(){
  ctx.fillStyle="#0f172a";ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.03;
  for(var i=0;i<W;i+=40){
    for(var j=0;j<H;j+=40){
      ctx.fillStyle=(i+j)%80===0?"#e8a435":"#f5deb3";
      ctx.fillRect(i,j,20,20);
    }
  }
  ctx.globalAlpha=1;
  var grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,"rgba(232,164,53,.04)");grd.addColorStop(.5,"rgba(245,214,53,.02)");grd.addColorStop(1,"rgba(232,164,53,.06)");
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
}

function drawHUD(){
  var hudH=50*scale;
  ctx.fillStyle="rgba(15,23,42,.92)";
  ctx.fillRect(0,0,W,hudH);
  ctx.fillStyle="#e8a435";ctx.fillRect(0,hudH,W,2);

  ctx.fillStyle="#f5deb3";ctx.font="bold "+(16*scale)+"px 'Segoe UI',sans-serif";ctx.textBaseline="middle";
  ctx.textAlign="left";ctx.fillText("Score: "+score,12*scale,hudH/2);

  ctx.textAlign="center";
  var tColor=timer<=5?"#e74c3c":timer<=10?"#f39c12":"#5cb85c";
  if(timer<=5){timerBlink+=dt*8;if(Math.sin(timerBlink)>.3)tColor="#fff"}
  ctx.fillStyle=tColor;ctx.fillText("Time: "+Math.ceil(timer)+"s",W/2,hudH/2);

  ctx.textAlign="right";
  ctx.fillStyle="#f0ad4e";
  var cText="x"+comboMult;
  if(combo>1)cText="Combo x"+comboMult+" ("+combo+")";
  ctx.fillText(cText,W-12*scale,hudH/2);

  var sbW=36*scale,sbH=30*scale,sbX=W-sbW-8*scale,sbY=hudH+8*scale;
  ctx.fillStyle="rgba(255,255,255,.1)";
  roundRect(sbX,sbY,sbW,sbH,6);ctx.fill();
  ctx.fillStyle=soundOn?"#5cb85c":"#666";
  ctx.font=(14*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(soundOn?"🔊":"🔇",sbX+sbW/2,sbY+sbH/2);

  var diffNames=["Easy","Medium","Hard"];
  ctx.fillStyle="rgba(255,255,255,.35)";ctx.font=(10*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="left";
  ctx.fillText(diffNames[difficulty-1]+" | Served: "+servedCount,12*scale,hudH+8*scale+14*scale);

  ctx.textAlign="right";ctx.font=(10*scale)+"px 'Segoe UI',sans-serif";ctx.fillStyle="rgba(255,255,255,.35)";
  ctx.fillText("Best: "+highScore,W-12*scale,hudH+8*scale+14*scale);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function drawOrders(){
  var orderZoneH=110*scale;
  var y0=65*scale;
  var count=orders.length;
  var maxVisible=Math.min(count,Math.floor((W-20*scale)/(100*scale)));
  if(maxVisible<1)maxVisible=1;
  var cardW=Math.min(90*scale,(W-20*scale)/maxVisible-8*scale);
  var totalW=maxVisible*cardW+(maxVisible-1)*6*scale;
  var startX=(W-totalW)/2;

  for(var i=0;i<Math.min(count,maxVisible);i++){
    var o=orders[i];
    var cx=startX+i*(cardW+6*scale)+cardW/2;
    var cy=y0+orderZoneH/2;

    var pulse=1+Math.sin(Date.now()/300+i)*.015;
    var cardH=orderZoneH*pulse;

    ctx.save();
    ctx.translate(o.shakeX,o.shakeY);

    var urgency=(1-o.timer/o.maxTimer);
    var borderColor=urgency>.8?"#e74c3c":urgency>.5?"#f39c12":"#e8a435";

    ctx.fillStyle="rgba(30,40,60,.92)";
    roundRect(cx-cardW/2,cy-cardH/2,cardW,cardH,8*scale);ctx.fill();
    ctx.strokeStyle=borderColor;ctx.lineWidth=2*scale;
    roundRect(cx-cardW/2,cy-cardH/2,cardW,cardH,8*scale);ctx.stroke();

    if(o.flash>0){
      ctx.fillStyle="rgba(92,184,92,"+o.flash*.3+")";
      roundRect(cx-cardW/2,cy-cardH/2,cardW,cardH,8*scale);ctx.fill();
    }

    drawFoodIcon(cx,cy-14*scale,o.recipe.icon,28*scale);

    ctx.fillStyle="#f5deb3";ctx.font="bold "+(9*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(o.recipe.name,cx,cy+18*scale);

    var barW=cardW-10*scale,barH=4*scale,barX=cx-barW/2,barY=cy+28*scale;
    ctx.fillStyle="rgba(255,255,255,.1)";
    roundRect(barX,barY,barW,barH,2);ctx.fill();
    var fill=o.timer/o.maxTimer;
    var fColor=fill>.5?"#5cb85c":fill>.25?"#f39c12":"#e74c3c";
    ctx.fillStyle=fColor;
    roundRect(barX,barY,barW*Math.max(fill,0),barH,2);ctx.fill();

    var dotY=cy-cardH/2+12*scale;
    var dotSpacing=Math.min(12*scale,cardW/(o.recipe.ingredients.length+1));
    var dotStartX=cx-((o.recipe.ingredients.length-1)*dotSpacing)/2;
    for(var j=0;j<o.recipe.ingredients.length;j++){
      var dx=dotStartX+j*dotSpacing;
      if(j<o.progress){
        ctx.fillStyle="#5cb85c";ctx.beginPath();ctx.arc(dx,dotY,3*scale,0,Math.PI*2);ctx.fill();
      }else if(j===o.progress){
        ctx.fillStyle="#f0ad4e";ctx.beginPath();ctx.arc(dx,dotY,3.5*scale,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle="#f0ad4e";ctx.lineWidth=1.5*scale;ctx.beginPath();ctx.arc(dx,dotY,6*scale,0,Math.PI*2);ctx.stroke();
      }else{
        ctx.fillStyle="rgba(255,255,255,.2)";ctx.beginPath();ctx.arc(dx,dotY,2.5*scale,0,Math.PI*2);ctx.fill();
      }
    }

    ctx.restore();
  }
}

var ingredientBtns=[];
function drawIngredientPanel(){
  var panelH=H*.28;
  var panelY=H-panelH;
  ctx.fillStyle="rgba(20,30,50,.95)";ctx.fillRect(0,panelY,W,panelH);
  ctx.fillStyle="#e8a435";ctx.fillRect(0,panelY,W,2);

  var activeIng=[];
  if(orders.length>0){
    var cur=orders[0];
    var needed=cur.recipe.ingredients[cur.progress];
    for(var i=0;i<cur.recipe.ingredients.length;i++){
      if(i>=cur.progress){
        var id=cur.recipe.ingredients[i];
        var found=false;
        for(var j=0;j<activeIng.length;j++)if(activeIng[j]===id){found=true;break}
        if(!found)activeIng.push(id);
      }
    }
  }

  if(orders.length===0){
    ctx.fillStyle="rgba(255,255,255,.4)";ctx.font=(14*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("Waiting for orders...",W/2,panelY+panelH/2);
    ingredientBtns=[];
    return;
  }

  var curOrder=orders[0];
  var neededId=curOrder.recipe.ingredients[curOrder.progress];

  var cols=Math.min(activeIng.length,5);
  var rows=Math.ceil(activeIng.length/cols);
  var btnSize=Math.min(52*scale,(W-20*scale)/(cols)-8*scale);
  var gap=8*scale;
  var gridW=cols*btnSize+(cols-1)*gap;
  var gridH=rows*btnSize+(rows-1)*gap;
  var offX=(W-gridW)/2;
  var offY=panelY+(panelH-gridH)/2;

  ingredientBtns=[];
  for(var i=0;i<activeIng.length;i++){
    var col=i%cols,row=Math.floor(i/cols);
    var bx=offX+col*(btnSize+gap);
    var by=offY+row*(btnSize+gap);
    var d=getIngredientDef(activeIng[i]);

    var isNeeded=activeIng[i]===neededId;
    var pulse=isNeeded?(1+Math.sin(Date.now()/200)*.06):1;

    ctx.save();
    var cx2=bx+btnSize/2,cy2=by+btnSize/2;
    ctx.translate(cx2,cy2);ctx.scale(pulse,pulse);ctx.translate(-cx2,-cy2);

    var glow=isNeeded?1:0;
    if(glow>0){
      ctx.shadowColor=d.color;ctx.shadowBlur=15*scale;
    }

    ctx.fillStyle="rgba(40,55,80,.9)";
    roundRect(bx,by,btnSize,btnSize,10*scale);ctx.fill();
    ctx.strokeStyle=isNeeded?d.color:"rgba(255,255,255,.15)";
    ctx.lineWidth=isNeeded?2.5*scale:1*scale;
    roundRect(bx,by,btnSize,btnSize,10*scale);ctx.stroke();

    ctx.shadowBlur=0;

    drawIngredientIcon(cx2,cy2-2*scale,activeIng[i],btnSize*.55);

    ctx.fillStyle="rgba(255,255,255,.7)";ctx.font=(8*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";ctx.textBaseline="top";
    ctx.fillText(d.label,cx2,by+btnSize-12*scale);

    ctx.restore();
    ingredientBtns.push({x:bx,y:by,w:btnSize,h:btnSize,id:activeIng[i]});
  }

  ctx.fillStyle="rgba(255,255,255,.35)";ctx.font="bold "+(11*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";
  ctx.fillText("Next: "+getIngredientDef(neededId).label,W/2,panelY+10*scale);
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawStartScreen(){
  drawBg();

  var cy=H*.32;
  ctx.save();
  var titlePulse=1+Math.sin(Date.now()/500)*.02;
  ctx.translate(W/2,cy);ctx.scale(titlePulse,titlePulse);ctx.translate(-W/2,-cy);

  ctx.fillStyle="#e8a435";ctx.font="bold "+(42*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.shadowColor="#e8a435";ctx.shadowBlur=20*scale;
  ctx.fillText("KITCHEN",W/2,cy-22*scale);
  ctx.fillStyle="#f0c040";
  ctx.fillText("RUSH",W/2,cy+22*scale);
  ctx.shadowBlur=0;
  ctx.restore();

  var icons=["burger","pizza","salad","sushi","taco","pasta"];
  for(var i=0;i<icons.length;i++){
    var a=(Date.now()/1000+i*Math.PI*2/icons.length);
    var ix=W/2+Math.cos(a)*90*scale;
    var iy=cy+Math.sin(a)*40*scale;
    drawFoodIcon(ix,iy,icons[i],30*scale);
  }

  ctx.fillStyle="rgba(255,255,255,.5)";ctx.font=(13*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";
  ctx.fillText("Time-Management Cooking Game",W/2,cy+70*scale);

  var btnW=180*scale,btnH=50*scale;
  var btnX=W/2-btnW/2,btnY=H*.55;
  var grd=ctx.createLinearGradient(btnX,btnY,btnX,btnY+btnH);
  grd.addColorStop(0,"#e8a435");grd.addColorStop(1,"#d4872a");
  ctx.fillStyle=grd;
  roundRect(btnX,btnY,btnW,btnH,12*scale);ctx.fill();
  ctx.fillStyle="#0f172a";ctx.font="bold "+(18*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("PLAY",W/2,btnY+btnH/2);

  if(highScore>0){
    ctx.fillStyle="rgba(255,255,255,.45)";ctx.font=(12*scale)+"px 'Segoe UI',sans-serif";
    ctx.fillText("High Score: "+highScore,W/2,btnY+btnH+30*scale);
  }

  var diffBtnW=100*scale,diffBtnH=34*scale;
  var diffY=btnY+btnH+55*scale;
  var diffNames=["Easy","Medium","Hard"];
  var diffColors=["#5cb85c","#f39c12","#e74c3c"];
  var unlocked=[true,score>=levelUnlocks[1]||highScore>=levelUnlocks[1],score>=levelUnlocks[2]||highScore>=levelUnlocks[2]];

  for(var i=0;i<3;i++){
    var dx=W/2+(i-1)*(diffBtnW+10*scale)-diffBtnW/2;
    if(unlocked[i]){
      ctx.fillStyle=difficulty===i+1?diffColors[i]:"rgba(255,255,255,.1)";
      roundRect(dx,diffY,diffBtnW,diffBtnH,8*scale);ctx.fill();
      ctx.fillStyle=difficulty===i+1?"#0f172a":"rgba(255,255,255,.5)";
      ctx.font="bold "+(11*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";
      ctx.fillText(diffNames[i],dx+diffBtnW/2,diffY+diffBtnH/2);
    }else{
      ctx.fillStyle="rgba(255,255,255,.05)";roundRect(dx,diffY,diffBtnW,diffBtnH,8*scale);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.2)";ctx.font=(11*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";
      ctx.fillText("🔒 "+diffNames[i],dx+diffBtnW/2,diffY+diffBtnH/2);
    }
  }

  ctx.fillStyle="rgba(255,255,255,.3)";ctx.font=(10*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";
  ctx.fillText("Tap ingredients in the correct order!",W/2,H-40*scale);
  ctx.fillText("Wrong ingredients lose time | Consecutive orders build combo",W/2,H-24*scale);
}

function drawGameOver(){
  ctx.fillStyle="rgba(15,23,42,.88)";ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#e74c3c";ctx.font="bold "+(36*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("TIME'S UP!",W/2,H*.3);

  ctx.fillStyle="#f5deb3";ctx.font=(18*scale)+"px 'Segoe UI',sans-serif";
  ctx.fillText("Score: "+score,W/2,H*.4);

  if(score>=highScore&&score>0){
    ctx.fillStyle="#f0c040";ctx.font="bold "+(14*scale)+"px 'Segoe UI',sans-serif";
    ctx.fillText("NEW HIGH SCORE!",W/2,H*.46);
  }

  ctx.fillStyle="rgba(255,255,255,.5)";ctx.font=(13*scale)+"px 'Segoe UI',sans-serif";
  ctx.fillText("Orders Served: "+servedCount,W/2,H*.52);
  ctx.fillText("Best Combo: x"+comboMult,W/2,H*.57);

  var btnW=180*scale,btnH=50*scale;
  var btnX=W/2-btnW/2,btnY=H*.65;
  var grd=ctx.createLinearGradient(btnX,btnY,btnX,btnY+btnH);
  grd.addColorStop(0,"#e8a435");grd.addColorStop(1,"#d4872a");
  ctx.fillStyle=grd;roundRect(btnX,btnY,btnW,btnH,12*scale);ctx.fill();
  ctx.fillStyle="#0f172a";ctx.font="bold "+(18*scale)+"px 'Segoe UI',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("PLAY AGAIN",W/2,btnY+btnH/2);

  ctx.fillStyle="rgba(255,255,255,.3)";ctx.font=(11*scale)+"px 'Segoe UI',sans-serif";
  ctx.fillText("High Score: "+highScore,W/2,btnY+btnH+25*scale);
}

function startGame(){
  state="playing";score=0;combo=0;comboMult=1;
  timer=60;orders=[];particles=[];servedCount=0;timerBlink=0;
  spawnOrder();spawnOrder();
}

function handleIngredientTap(id){
  if(state!=="playing"||orders.length===0)return;
  var cur=orders[0];
  var needed=cur.recipe.ingredients[cur.progress];
  if(id===needed){
    cur.progress++;
    playSound("chop");
    spawnParticles(W/2,H*.65,getIngredientDef(id).color,6,2.5);
    if(cur.progress>=cur.recipe.ingredients.length){
      combo++;
      comboMult=1+Math.floor(combo/3);
      var pts=10*comboMult*difficulty;
      score+=pts;
      servedCount++;
      cur.flash=1;
      playSound("ding");
      if(combo%3===0&&combo>0)playSound("combo");

      spawnParticles(W/2,100*scale,"#f0c040",15,4);
      spawnParticles(W/2,100*scale,"#5cb85c",10,3);

      orders.splice(0,1);
      timer=Math.min(timer+5+difficulty,90);

      var newDiff=1;
      if(score>=levelUnlocks[2])newDiff=3;else if(score>=levelUnlocks[1])newDiff=2;
      if(newDiff>difficulty){difficulty=newDiff;playSound("levelup")}

      while(orders.length<Math.min(2+difficulty,4))spawnOrder();
    }
  }else{
    combo=0;comboMult=1;
    timer=Math.max(timer-3,0);
    playSound("wrong");
    spawnParticles(W/2,H*.65,"#e74c3c",8,3);
    screenShake=.3;
  }
}

function updateGame(){
  timer-=dt;
  if(timer<=0){timer=0;state="gameover";playSound("gameover");
    if(score>highScore){highScore=score;try{localStorage.setItem("kr_hi",String(highScore))}catch(e){}}
    return;
  }

  for(var i=orders.length-1;i>=0;i--){
    orders[i].timer-=dt;
    if(orders[i].timer<=0){
      orders.splice(i,1);
      combo=0;comboMult=1;
      timer=Math.max(timer-5,0);
      playSound("wrong");
      screenShake=.4;
      if(orders.length===0)spawnOrder();
    }
  }

  for(var i=0;i<orders.length;i++){
    var o=orders[i];
    if(o.shakeX!==0||o.shakeY!==0){
      o.shakeX*=.85;o.shakeY*=.85;
      if(Math.abs(o.shakeX)<.5){o.shakeX=0;o.shakeY=0}
    }
    if(o.flash>0)o.flash-=dt*2;
  }

  if(screenShake>0){
    screenShake-=dt*2;
    ctx.save();
    ctx.translate((Math.random()-.5)*screenShake*10,(Math.random()-.5)*screenShake*10);
  }

  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=dt*40;
    p.life-=p.decay;
    if(p.life<=0)particles.splice(i,1);
  }
}

function draw(){
  if(state==="menu"){drawStartScreen();return}

  drawBg();
  if(screenShake<=0||state!=="playing"){
    drawHUD();drawOrders();drawIngredientPanel();drawParticles();
  }
}

function gameLoop(ts){
  if(!lastTime)lastTime=ts;
  dt=Math.min((ts-lastTime)/1000,.05);
  lastTime=ts;

  ctx.clearRect(0,0,W,H);

  if(state==="playing"){
    updateGame();
    if(screenShake>0){
      ctx.save();
      ctx.translate((Math.random()-.5)*screenShake*12,(Math.random()-.5)*screenShake*12);
    }
    draw();
    if(screenShake>0)ctx.restore();
  }else{
    draw();
  }

  if(state==="gameover")drawGameOver();

  requestAnimationFrame(gameLoop);
}

var soundBtnRect={x:0,y:0,w:0,h:0};
function handleTap(x,y){
  ensureAudio();

  if(state==="menu"){
    var btnW=180*scale,btnH=50*scale;
    var btnX=W/2-btnW/2,btnY=H*.55;
    if(x>=btnX&&x<=btnX+btnW&&y>=btnY&&y<=btnY+btnH){
      startGame();return;
    }

    var diffBtnW=100*scale,diffBtnH=34*scale;
    var diffY=btnY+btnH+55*scale;
    var unlocked=[true,score>=levelUnlocks[1]||highScore>=levelUnlocks[1],score>=levelUnlocks[2]||highScore>=levelUnlocks[2]];
    for(var i=0;i<3;i++){
      var dx=W/2+(i-1)*(diffBtnW+10*scale)-diffBtnW/2;
      if(unlocked[i]&&x>=dx&&x<=dx+diffBtnW&&y>=diffY&&y<=diffY+diffBtnH){
        difficulty=i+1;return;
      }
    }
    return;
  }

  if(state==="gameover"){
    var btnW2=180*scale,btnH2=50*scale;
    var btnX2=W/2-btnW2/2,btnY2=H*.65;
    if(x>=btnX2&&x<=btnX2+btnW2&&y>=btnY2&&y<=btnY2+btnH2){
      startGame();return;
    }
    return;
  }

  if(state==="playing"){
    var sbW=36*scale,sbH=30*scale,sbX=W-sbW-8*scale,sbY=65*scale;
    if(x>=sbX&&x<=sbX+sbW&&y>=sbY&&y<=sbY+sbH){
      soundOn=!soundOn;return;
    }

    for(var i=0;i<ingredientBtns.length;i++){
      var b=ingredientBtns[i];
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
        handleIngredientTap(b.id);return;
      }
    }
  }
}

canvas.addEventListener("mousedown",function(e){var r=canvas.getBoundingClientRect();handleTap(e.clientX-r.left,e.clientY-r.top)});
canvas.addEventListener("touchstart",function(e){e.preventDefault();var t=e.touches[0];var r=canvas.getBoundingClientRect();handleTap(t.clientX-r.left,t.clientY-r.top)},{passive:false});

requestAnimationFrame(gameLoop);

})();
</script>
</body>
