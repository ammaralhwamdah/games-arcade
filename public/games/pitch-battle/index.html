<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pitch Battle</title>
<style>
  html,body{margin:0;height:100%;background:#04100a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{background:#0e2a17;touch-action:none;outline:none;border-radius:8px}
  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#5d7a68;font:13px system-ui;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<div id="hint">P1: WASD · P2: Arrows · Touch: drag your side</div>
<script>
"use strict";
/* Pitch Battle - GameVerse Exclusive Edition. Original code. */
(function () {
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 480, H = 680;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    var scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = (W * scale) + "px";
    canvas.style.height = (H * scale) + "px";
    canvas.width = Math.round(W * scale * DPR);
    canvas.height = Math.round(H * scale * DPR);
    ctx.setTransform(scale * DPR, 0, 0, scale * DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  var TOP = 40, BOT = H - 40;
  var GOAL_HALF = 52;
  var RP = 13, RB = 8, PICK = RP + RB + 4;
  var WIN_SCORE = 5;
  var C1 = "#38bdf8", C2 = "#f472b6";
  var C1_D = "#0c4a6e", C2_D = "#831843";

  var mode = "title";
  var winner = 0, p1s = 0, p2s = 0;
  var cd = 0, cdLabel = "", goalText = "", goalT = 0;

  function mkPlayer(team, x, y, c, cd) {
    return { team: team, x: x, y: y, dx: 0, dy: 0, fx: 0, fy: team === 1 ? -1 : 1, stun: 0, c: c, cd: cd };
  }
  var p1 = mkPlayer(1, W / 2, BOT - 76, C1, C1_D);
  var p2 = mkPlayer(2, W / 2, TOP + 76, C2, C2_D);
  var ball = { x: W / 2, y: (TOP + BOT) / 2, vx: 0, vy: 0, owner: 0 };
  var particles = [];

  /* ------- audio ------- */
  var AC = null;
  function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
  function tone(f0, f1, dur, type, vol) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type || "square";
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol || 0.04, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function sPick() { tone(720, 520, 0.06, "square", 0.03); }
  function sKick() { tone(190, 70, 0.12, "sawtooth", 0.05); }
  function sTackle() { tone(340, 150, 0.08, "square", 0.05); }
  function sGoal() { tone(520, 1040, 0.35, "triangle", 0.07); tone(660, 1320, 0.35, "triangle", 0.05); }

  /* ------- input ------- */
  var keys = {};
  var stick1 = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
  var stick2 = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };

  document.addEventListener("keydown", function (e) {
    if (e.code === "Enter") {
      e.preventDefault();
      if (mode === "title" || mode === "over") startKickoff();
      return;
    }
    if (e.code === "Space") {
      e.preventDefault();
      if (mode === "title" || mode === "over") { startKickoff(); return; }
      if (ball.owner === 1) shootBall(p1);
      else if (ball.owner === 2) shootBall(p2);
      return;
    }
    keys[e.code] = true;
  });
  document.addEventListener("keyup", function (e) { keys[e.code] = false; });
  window.addEventListener("blur", function () { keys = {}; stick1.active = stick2.active = false; });

  function pt(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / (r.width / W), y: (e.clientY - r.top) / (r.height / H) };
  }
  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    canvas.focus();
    var p = pt(e);
    if (mode === "title" || mode === "over") { startKickoff(); return; }
    var st = p.x < W / 2 ? stick1 : stick2;
    if (!st.active) { st.active = true; st.id = e.pointerId; st.ox = p.x; st.oy = p.y; st.dx = 0; st.dy = 0; }
  });
  function stickMove(e) {
    if (e.pointerId !== stick1.id && e.pointerId !== stick2.id) return;
    var st = e.pointerId === stick1.id ? stick1 : stick2;
    var p = pt(e);
    var dx = p.x - st.ox, dy = p.y - st.oy;
    var m = Math.hypot(dx, dy), mx = 34;
    if (m > mx) { var k = mx / m; dx *= k; dy *= k; }
    st.dx = dx / mx; st.dy = dy / mx;
  }
  function stickEnd(e) {
    if (e.pointerId === stick1.id) { stick1.active = false; stick1.dx = stick1.dy = 0; stick1.id = -1; if (ball.owner === 1) shootBall(p1); }
    if (e.pointerId === stick2.id) { stick2.active = false; stick2.dx = stick2.dy = 0; stick2.id = -1; if (ball.owner === 2) shootBall(p2); }
  }
  canvas.addEventListener("pointermove", stickMove);
  canvas.addEventListener("pointerup", stickEnd);
  canvas.addEventListener("pointercancel", stickEnd);

  function inputVec(p) {
    var dx = 0, dy = 0;
    var st = p.team === 1 ? stick1 : stick2;
    if (st.active) { dx = st.dx; dy = st.dy; }
    else if (p.team === 1) {
      if (keys["KeyW"]) dy -= 1; if (keys["KeyS"]) dy += 1;
      if (keys["KeyA"]) dx -= 1; if (keys["KeyD"]) dx += 1;
    } else {
      if (keys["ArrowUp"]) dy -= 1; if (keys["ArrowDown"]) dy += 1;
      if (keys["ArrowLeft"]) dx -= 1; if (keys["ArrowRight"]) dx += 1;
    }
    var m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    return { x: dx, y: dy };
  }

  function shootBall(p) {
    if (ball.owner !== p.team) return;
    var fx = p.fx, fy = p.fy;
    if (fx === 0 && fy === 0) fy = p.team === 1 ? -1 : 1;
    var sp2 = 260;
    ball.vx = fx * sp2; ball.vy = fy * sp2;
    ball.owner = 0;
    sKick();
    burst(ball.x, ball.y, "#ffffff", 6);
  }

  /* ------- world ------- */
  function resetPositions() {
    p1.x = W / 2; p1.y = BOT - 76; p1.fx = 0; p1.fy = -1; p1.stun = 0; p1.dx = 0; p1.dy = 0;
    p2.x = W / 2; p2.y = TOP + 76; p2.fx = 0; p2.fy = 1; p2.stun = 0; p2.dx = 0; p2.dy = 0;
    ball.x = W / 2; ball.y = (TOP + BOT) / 2; ball.vx = 0; ball.vy = 0; ball.owner = 0;
    particles = [];
  }
  function startKickoff() {
    p1s = 0; p2s = 0; winner = 0; goalText = ""; goalT = 0;
    resetPositions();
    mode = "kickoff"; cd = 1.1;
  }
  function burst(x, y, c, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = Math.random() * 130 + 30;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, l: 0.5 + Math.random() * 0.45, t: 0, c: c });
    }
  }
  function tickParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.t > p.l) particles.splice(i, 1);
    }
  }

  function movePlayer(p, dt) {
    if (p.stun > 0) { p.stun -= dt; return; }
    var v = inputVec(p);
    p.dx = v.x; p.dy = v.y;
    if (v.x !== 0 || v.y !== 0) { p.fx = v.x; p.fy = v.y; }
    var spd = ball.owner === p.team ? 118 : 162;
    p.x += v.x * spd * dt;
    p.y += v.y * spd * dt;
    p.x = Math.max(RP, Math.min(W - RP, p.x));
    p.y = Math.max(TOP + RP, Math.min(BOT - RP, p.y));
  }

  function dribble(p, dt) {
    if (ball.owner !== p.team) return;
    var sp = RP + RB + 3;
    ball.x = p.x + p.fx * sp;
    ball.y = p.y + p.fy * sp;
    ball.vx = 0; ball.vy = 0;
    if (p.team === 1) ball.y = Math.min(ball.y, BOT - RB - 2);
    else ball.y = Math.max(ball.y, TOP + RB + 2);
  }

  function tryPickup(p) {
    if (p.stun > 0) return;
    var d = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (d <= PICK) { ball.owner = p.team; sPick(); }
  }

  function tryTackle() {
    if (ball.owner === 0) return;
    var carrier = ball.owner === 1 ? p1 : p2;
    var defender = ball.owner === 1 ? p2 : p1;
    if (carrier.stun > 0 || defender.stun > 0) return;
    var d = Math.hypot(carrier.x - defender.x, carrier.y - defender.y);
    if (d <= RP * 2) {
      var a = Math.atan2(defender.y - carrier.y, defender.x - carrier.x);
      ball.owner = 0;
      ball.vx = Math.cos(a) * 220; ball.vy = Math.sin(a) * 220;
      carrier.stun = 0.45;
      burst(defender.x, defender.y, "#ffffff", 10);
      sTackle();
    }
  }

  function moveBall(dt) {
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.x - RB < 0) { ball.x = RB; ball.vx = Math.abs(ball.vx) * 0.8; }
    if (ball.x + RB > W) { ball.x = W - RB; ball.vx = -Math.abs(ball.vx) * 0.8; }
    if (ball.y - RB < TOP) {
      if (Math.abs(ball.x - W / 2) > GOAL_HALF) { ball.y = TOP + RB; ball.vy = Math.abs(ball.vy) * 0.8; }
    }
    if (ball.y + RB > BOT) {
      if (Math.abs(ball.x - W / 2) > GOAL_HALF) { ball.y = BOT - RB; ball.vy = -Math.abs(ball.vy) * 0.8; }
    }
    var fr = Math.max(0, 1 - 1.05 * dt);
    ball.vx *= fr; ball.vy *= fr;
    if (ball.vx * ball.vx + ball.vy * ball.vy < 16) { ball.vx = 0; ball.vy = 0; }
  }

  function checkGoal() {
    var inMouth = Math.abs(ball.x - W / 2) <= GOAL_HALF;
    if (ball.y - RB <= TOP && inMouth) { goalScored(1); return; }
    if (ball.y + RB >= BOT && inMouth) { goalScored(2); return; }
  }
  function goalScored(team) {
    winner = team;
    goalText = "GOAL! PLAYER " + team;
    goalT = 0.8;
    burst(ball.x, ball.y, "#fbbf24", 26);
    burst(ball.x, ball.y, "#ffffff", 18);
    sGoal();
    if ((team === 1 ? ++p1s : ++p2s) >= WIN_SCORE) { mode = "over"; return; }
    resetPositions();
    mode = "kickoff"; cd = 1.5;
  }

  function update(dt) {
    if (mode === "kickoff") {
      cd -= dt; goalT -= dt;
      if (cd > 0.6) cdLabel = "READY...";
      else if (cd > 0.2) cdLabel = "GO!";
      else { mode = "play"; }
      tickParticles(dt);
      return;
    }
    if (mode === "over") { tickParticles(dt); return; }
    if (mode === "title") { tickParticles(dt); return; }

    var v1 = inputVec(p1), v2 = inputVec(p2);
    var wasHeld1 = p1.dx !== 0 || p1.dy !== 0;
    var wasHeld2 = p2.dx !== 0 || p2.dy !== 0;
    var holding1 = v1.x !== 0 || v1.y !== 0;
    var holding2 = v2.x !== 0 || v2.y !== 0;
    if (ball.owner === 1 && p1.stun <= 0 && wasHeld1 && !holding1) shootBall(p1);
    if (ball.owner === 2 && p2.stun <= 0 && wasHeld2 && !holding2) shootBall(p2);

    movePlayer(p1, dt); movePlayer(p2, dt);
    dribble(p1, dt); dribble(p2, dt);
    if (ball.owner === 0) moveBall(dt);
    if (ball.owner === 0) { tryPickup(p1); tryPickup(p2); }
    tryTackle();
    checkGoal();
    tickParticles(dt);
  }

  /* ------- draw ------- */
  function drawHudBars() {
    ctx.fillStyle = "rgba(4,14,8,0.62)";
    ctx.fillRect(0, 0, W, TOP);
    ctx.fillRect(0, BOT, W, H - BOT);
    ctx.font = "900 20px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = C1; ctx.fillText(p1s, W / 2 - 30, TOP / 2 + 1);
    ctx.fillStyle = "#e2e8f0"; ctx.font = "900 15px system-ui, sans-serif";
    ctx.fillText("·", W / 2 - 14, TOP / 2 + 1);
    ctx.fillStyle = C2; ctx.font = "900 20px system-ui, sans-serif";
    ctx.fillText(p2s, W / 2 + 4, TOP / 2 + 1);
    ctx.font = "700 11px system-ui, sans-serif";
    ctx.fillStyle = C1; ctx.textAlign = "left"; ctx.fillText("PLAYER 1", 8, TOP / 2 + 1);
    ctx.fillStyle = C2; ctx.textAlign = "right"; ctx.fillText("PLAYER 2", W - 8, TOP / 2 + 1);
    ctx.textAlign = "center";
    ctx.fillStyle = "#64846f"; ctx.font = "600 10px system-ui, sans-serif";
    ctx.fillText("First to " + WIN_SCORE + " wins", W / 2, TOP / 2 + 15);
    ctx.fillStyle = "#5d7a68"; ctx.font = "600 11px system-ui, sans-serif";
    ctx.fillText("Hold to dribble · Release or Space to shoot · Tackle to steal", W / 2, (BOT + H) / 2);
  }

  function drawGoal(atTop) {
    var y = atTop ? TOP : BOT;
    var gx1 = W / 2 - GOAL_HALF, gx2 = W / 2 + GOAL_HALF;
    var ny1 = atTop ? 6 : y, ny2 = atTop ? y : H - 6;
    ctx.fillStyle = "rgba(255,255,255,0.07)";
    ctx.fillRect(gx1, ny1, gx2 - gx1, ny2 - ny1);
    ctx.strokeStyle = "rgba(255,255,255,0.13)";
    ctx.lineWidth = 1;
    var gwd = gx2 - gx1;
    for (var i = 0; i <= 6; i++) {
      var vx = gx1 + i * gwd / 6;
      ctx.beginPath(); ctx.moveTo(vx, ny1); ctx.lineTo(vx, ny2); ctx.stroke();
    }
    for (var j = 0; j <= 4; j++) {
      var hy = ny1 + (ny2 - ny1) * j / 4;
      ctx.beginPath(); ctx.moveTo(gx1, hy); ctx.lineTo(gx2, hy); ctx.stroke();
    }
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(gx1, y); ctx.lineTo(gx1, atTop ? y + 16 : y - 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx2, y); ctx.lineTo(gx2, atTop ? y + 16 : y - 16); ctx.stroke();
  }

  function drawPitch() {
    var g = ctx.createLinearGradient(0, TOP, 0, BOT);
    g.addColorStop(0, "#0a2212"); g.addColorStop(1, "#0e2c18");
    ctx.fillStyle = g;
    ctx.fillRect(0, TOP, W, BOT - TOP);
    ctx.fillStyle = "rgba(255,255,255,0.03)";
    for (var i = 0; i < 8; i++) if (i % 2 === 0) ctx.fillRect(i * W / 8, TOP, W / 8, BOT - TOP);
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    ctx.strokeRect(2, TOP + 2, W - 4, BOT - TOP - 4);
    ctx.beginPath(); ctx.moveTo(0, (TOP + BOT) / 2); ctx.lineTo(W, (TOP + BOT) / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, (TOP + BOT) / 2, 46, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.beginPath(); ctx.arc(W / 2, (TOP + BOT) / 2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeRect(W / 2 - 92, TOP + 4, 184, 66);
    ctx.strokeRect(W / 2 - 92, BOT - 70, 184, 66);
  }

  function drawBall() {
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 9;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(ball.x, ball.y, RB, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#1f2937";
    for (var i = 0; i < 5; i++) {
      var a = i * Math.PI * 2 / 5;
      ctx.beginPath();
      ctx.arc(ball.x + Math.cos(a) * RB * 0.5, ball.y + Math.sin(a) * RB * 0.5, 1.7, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlayer(p) {
    ctx.save();
    if (p.stun > 0) {
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 40);
      ctx.fillStyle = "#fbbf24";
      for (var i = 0; i < 3; i++) {
        var a = p.stun * 9 + i * Math.PI * 2 / 3;
        ctx.fillRect(p.x + Math.cos(a) * 22 - 2, p.y + Math.sin(a) * 22 - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
    }
    ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 10;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, RP, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = p.cd; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, RP, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(p.x + p.fx * RP * 0.55, p.y + p.fy * RP * 0.55, 3.4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.l);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function drawOverlay() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (mode === "title") {
      ctx.fillStyle = "rgba(4,10,6,0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ffffff"; ctx.font = "900 44px system-ui, sans-serif";
      ctx.fillText("PITCH BATTLE", W / 2, H / 2 - 118);
      ctx.fillStyle = "#38bdf8"; ctx.font = "900 20px system-ui, sans-serif";
      ctx.fillText("2-Player · Same-Screen Duel", W / 2, H / 2 - 76);
      ctx.fillStyle = "#9fb8a8"; ctx.font = "700 14px system-ui, sans-serif";
      ctx.fillText("First to " + WIN_SCORE + " goals wins", W / 2, H / 2 - 44);
      ctx.fillStyle = "#cbd5e1"; ctx.font = "600 13px system-ui, sans-serif";
      ctx.fillText("PLAYER 1", W / 2 - 150, H / 2 + 10);
      ctx.fillStyle = "#38bdf8"; ctx.font = "900 20px system-ui, sans-serif";
      ctx.fillText("WASD", W / 2 - 150, H / 2 + 38);
      ctx.fillStyle = "#cbd5e1"; ctx.font = "600 13px system-ui, sans-serif";
      ctx.fillText("PLAYER 2", W / 2 + 150, H / 2 + 10);
      ctx.fillStyle = "#f472b6"; ctx.font = "900 20px system-ui, sans-serif";
      ctx.fillText("Arrows", W / 2 + 150, H / 2 + 38);
      ctx.fillStyle = "#7c96a8"; ctx.font = "600 12px system-ui, sans-serif";
      ctx.fillText("Touch: drag your side of the screen", W / 2, H / 2 + 74);
      ctx.fillStyle = "#94a3b8"; ctx.font = "600 13px system-ui, sans-serif";
      ctx.fillText("Hold to dribble · Release or Space to shoot · Tackle to steal", W / 2, H / 2 + 104);
      ctx.fillStyle = "#fbbf24"; ctx.font = "700 15px system-ui, sans-serif";
      ctx.fillText("Press Enter or tap to begin", W / 2, H / 2 + 146);
    } else if (mode === "kickoff") {
      ctx.fillStyle = "rgba(4,10,6,0.38)";
      ctx.fillRect(0, 0, W, H);
      if (goalT > 0 && goalText) {
        ctx.fillStyle = "#fbbf24"; ctx.font = "900 40px system-ui, sans-serif";
        ctx.fillText(goalText, W / 2, H / 2 - 60);
      }
      ctx.fillStyle = "#ffffff"; ctx.font = "900 54px system-ui, sans-serif";
      ctx.fillText(cdLabel, W / 2, H / 2 - 10);
    } else if (mode === "over") {
      ctx.fillStyle = "rgba(4,10,6,0.78)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fbbf24"; ctx.font = "900 40px system-ui, sans-serif";
      ctx.fillText("PLAYER " + winner + " WINS!", W / 2, H / 2 - 42);
      ctx.fillStyle = "#cbd5e1"; ctx.font = "700 20px system-ui, sans-serif";
      ctx.fillText(p1s + " : " + p2s, W / 2, H / 2 + 4);
      ctx.fillStyle = "#94a3b8"; ctx.font = "600 13px system-ui, sans-serif";
      ctx.fillText("Press Enter or tap to play again", W / 2, H / 2 + 44);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawHudBars();
    drawGoal(true);
    drawGoal(false);
    drawPitch();
    drawBall();
    drawPlayer(p1);
    drawPlayer(p2);
    drawParticles();
    if (mode !== "play") drawOverlay();
  }

  /* ------- loop ------- */
  var lastT = performance.now();
  function loop(now) {
    var dt = (now - lastT) / 1000;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0.016;
    lastT = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__game = {
    getMode: function () { return mode; },
    getScore: function () { return [p1s, p2s]; },
    getWinner: function () { return winner; },
    getOwner: function () { return ball.owner; }
  };
})();
</script>
</body>
</html>
