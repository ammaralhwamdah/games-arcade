<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Nano Serpent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b1220; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #e2e8f0; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(92vmin, 620px, calc(94vh * 9 / 9)); aspect-ratio: 1/1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 16px; background: #0f172a; box-shadow: 0 10px 40px rgba(0,0,0,.5); touch-action: none; }
  #hud { position: absolute; top: 8px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-size: 15px; font-weight: 700; z-index: 4; pointer-events: none; }
  #hud .left { display: flex; gap: 14px; align-items: center; }
  #hud .score { color: #4ade80; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #hud .best { color: #fbbf24; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #soundBtn { pointer-events: auto; background: rgba(255,255,255,.1); border: 0; border-radius: 10px; width: 30px; height: 30px; font-size: 15px; cursor: pointer; color: #fff; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(11,18,32,.82); border-radius: 16px; text-align: center; padding: 20px; z-index: 3; backdrop-filter: blur(3px); }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 42px; letter-spacing: 2px; color: #fff; }
  #overlay h1 span { color: #22d3ee; }
  #overlay .sub { font-size: 15px; color: #94a3b8; max-width: 300px; line-height: 1.5; }
  #overlay .final { font-size: 18px; color: #fbbf24; font-weight: 700; display: none; }
  #overlay .btn { background: #22d3ee; color: #082f36; border: 0; border-radius: 12px; padding: 13px 34px; font-size: 17px; font-weight: 800; cursor: pointer; transition: transform .1s, filter .1s; }
  #overlay .btn:hover { filter: brightness(1.1); }
  #overlay .btn:active { transform: scale(.96); }
  .controls { display: none; grid-template-columns: repeat(3, 54px); gap: 8px; margin-top: 6px; }
  .controls button { height: 54px; border: 0; border-radius: 12px; background: rgba(255,255,255,.08); color: #e2e8f0; font-size: 22px; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .controls button:active { background: rgba(255,255,255,.18); }
  .controls .empty { visibility: hidden; }
  @media (hover: none), (pointer: coarse), (max-width: 768px) { .controls { display: grid; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span class="left"><span class="score">SCORE 0</span><span class="best">BEST 0</span></span><button id="soundBtn" title="Sound: on" aria-label="Toggle sound">🔊</button></div>
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1>NANO<span> SERPENT</span></h1>
    <div class="sub">Use arrow keys or WASD to move. Eat the food, don't hit the walls or yourself.</div>
    <div class="final" id="finalMsg">Game Over — Score: 0</div>
    <button class="btn" id="playBtn">PLAY</button>
    <div class="controls">
      <div class="empty"></div><button data-dir="up">▲</button><div class="empty"></div>
      <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const playBtn = document.getElementById("playBtn");
  const finalMsg = document.getElementById("finalMsg");
  const scoreEl = document.querySelector("#hud .score");
  const bestEl = document.querySelector("#hud .best");

  const DPR = window.devicePixelRatio || 1;
  const GRID = 20; // cells per side

  let cols, rows, cell;
  let snake, dir, nextDir, food, score, best, running, loopTimer, speed;

  function resize() {
    const size = canvas.getBoundingClientRect().width;
    canvas.width = size * DPR;
    canvas.height = size * DPR;
    cols = GRID;
    rows = GRID;
    cell = canvas.width / GRID;
    if (snake) draw();
  }

  best = parseInt(localStorage.getItem("snake.best") || "0", 10);
  bestEl.textContent = "BEST " + best;

  function spawnFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * cols),
        y: 1 + Math.floor(Math.random() * (rows - 1)),
      };
      if (!snake.some((s) => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function startGame() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 200;
    running = true;
    scoreEl.textContent = "SCORE 0";
    overlay.classList.add("hidden");
    spawnFood();
    clearInterval(loopTimer);
    loopTimer = setInterval(tick, speed);
  }

  function endGame() {
    running = false;
    clearInterval(loopTimer);
    if (score > best) {
      best = score;
      localStorage.setItem("snake.best", String(best));
      bestEl.textContent = "BEST " + best;
    }
    finalMsg.textContent = "Game Over — Score: " + score;
    finalMsg.style.display = "block";
    document.querySelector("#overlay h1").textContent = "GAME OVER";
    playBtn.textContent = "PLAY AGAIN";
    overlay.classList.remove("hidden");
    draw();
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows) return endGame();
    if (snake.some((s) => s.x === head.x && s.y === head.y)) return endGame();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      sfx.eat();
      scoreEl.textContent = "SCORE " + score;
      spawnFood();
      if (speed > 80) { speed -= 3; clearInterval(loopTimer); loopTimer = setInterval(tick, speed); }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid dots
    ctx.fillStyle = "rgba(148,163,184,0.08)";
    for (let x = 0; x < cols; x++)
      for (let y = 0; y < rows; y++) {
        ctx.beginPath();
        ctx.arc(x * cell + cell / 2, y * cell + cell / 2, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }

    // food
    const fx = food.x * cell + cell / 2;
    const fy = food.y * cell + cell / 2;
    const pulse = 0.85 + 0.15 * Math.sin(Date.now() / 120);
    ctx.save();
    ctx.shadowColor = "#ef4444";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.arc(fx, fy, cell * 0.38 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // snake body
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const inset = i === 0 ? 2 : 5;
      const g = Math.min(255, 150 + (snake.length - i) * 2);
      ctx.fillStyle = i === 0 ? "#4ade80" : "rgb(34,197,94)";
      if (i === 0) { ctx.shadowColor = "#4ade80"; ctx.shadowBlur = 10; }
      else { ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; }
      roundRect(s.x * cell + inset, s.y * cell + inset, cell - inset * 2, cell - inset * 2, 7);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // eyes on head
    const h = snake[0];
    const hx = h.x * cell, hy = h.y * cell;
    ctx.fillStyle = "#052e16";
    if (dir.x !== 0) {
      ctx.fillRect(hx + (dir.x > 0 ? cell - 9 : 3), hy + 5, 4, 5);
      ctx.fillRect(hx + (dir.x > 0 ? cell - 9 : 3), hy + cell - 10, 4, 5);
    } else {
      ctx.fillRect(hx + 5, hy + (dir.y > 0 ? cell - 9 : 3), 5, 4);
      ctx.fillRect(hx + cell - 10, hy + (dir.y > 0 ? cell - 9 : 3), 5, 4);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right" };
  const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };

  function setDir(name) {
    const d = DIRS[name];
    if (!d) return;
    if (d.x === -dir.x && d.y === -dir.y) return;
    if (d.x === dir.x && d.y === dir.y) return;
    nextDir = d;
  }

  document.addEventListener("keydown", (e) => {
    const name = KEYS[e.key];
    if (!name) return;
    e.preventDefault();
    if (!running) { startGame(); return; }
    setDir(name);
  });

  playBtn.addEventListener("click", () => startGame());

  document.querySelectorAll(".controls button").forEach((btn) => {
    btn.addEventListener("click", () => { setDir(btn.dataset.dir); });
  });

  // Swipe support on the board
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchmove", (e) => { e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? "right" : "left");
    else setDir(dy > 0 ? "down" : "up");
  }, { passive: true });

  // ---------- sound (Web Audio API, generated — no external files) ----------
  let AC = null;
  let master = null;
  let soundOn = true;
  let musicOn = false;
  let musicTimer = null;

  function ensureAudio() {
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        master = AC.createGain();
        master.gain.value = 0.5;
        master.connect(AC.destination);
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === "suspended") AC.resume();
  }

  const soundBtn = document.getElementById("soundBtn");
  soundBtn.addEventListener("click", () => {
    ensureAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.title = soundOn ? "Sound: on" : "Sound: off";
    if (soundOn) { musicOn = true; startMusic(); }
    else { musicOn = false; stopMusic(); }
  });

  function tone(freq, dur, type, vol, when) {
    if (!AC || !master || !soundOn) return;
    const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  function noiseBurst(dur, vol, when, filterFreq) {
    if (!AC || !master || !soundOn) return;
    const t = AC.currentTime + (when || 0);
    const len = Math.floor(AC.sampleRate * dur);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = AC.createBufferSource();
    src.buffer = buf;
    const f = AC.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = filterFreq || 900;
    const g = AC.createGain();
    g.gain.value = vol || 0.25;
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t);
  }

  const sfx = {
    eat: function () {
      tone(660, 0.09, "square", 0.14);
      tone(990, 0.14, "square", 0.12, 0.06);
    },
    crash: function () {
      noiseBurst(0.5, 0.32, 0, 500);
      tone(150, 0.35, "sawtooth", 0.2);
      tone(90, 0.45, "square", 0.18, 0.05);
    },
    go: function () {
      tone(523, 0.1, "square", 0.12);
      tone(784, 0.16, "square", 0.12, 0.12);
    }
  };

  function startMusic() {
    if (!soundOn || !musicOn || !AC || !master) return;
    stopMusic();
    const notes = [220, 277, 330, 220, 330, 392, 330, 277];
    let idx = 0;
    let t = AC.currentTime + 0.1;
    musicTimer = setInterval(function () {
      if (!soundOn || !musicOn || !AC) { stopMusic(); return; }
      tone(notes[idx % notes.length], 0.12, "triangle", 0.045, t - AC.currentTime);
      idx++;
      t += 0.16;
    }, 160);
  }

  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  // hook sounds into game flow
  const origStart = startGame;
  startGame = function () {
    ensureAudio();
    if (soundOn) { musicOn = true; startMusic(); }
    sfx.go();
    origStart();
  };

  const origEnd = endGame;
  endGame = function () {
    stopMusic();
    sfx.crash();
    origEnd();
  };

  window.addEventListener("resize", resize);
  resize();

  // idle animation on menu
  (function idle() {
    if (!snake) {
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(148,163,184,0.08)";
      for (let x = 0; x < cols; x++)
        for (let y = 0; y < rows; y++) {
          ctx.beginPath();
          ctx.arc(x * cell + cell / 2, y * cell + cell / 2, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
    }
    if (!running) requestAnimationFrame(idle);
  })();
})();
</script>
</body>
</html>
