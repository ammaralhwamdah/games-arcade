<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sizzle Stack</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0807;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const C=document.getElementById("c"),X=C.getContext("2d");
let W,H,dpr;
let muted=false;
let state={phase:"menu",score:0,best:0,orderNum:0,t:0,timer:0,pending:[],stack:[],streak:0,combo:0,feedback:"",fbT:0,confetti:[]};
const INGREDIENTS=[
  {name:"Bottom Bun",emoji:"🍔",col:"#d97706"},
  {name:"Patty",emoji:"🍖",col:"#7c2d12"},
  {name:"Lettuce",emoji:"🥬",col:"#4ade80"},
  {name:"Tomato",emoji:"🍅",col:"#ef4444"},
  {name:"Cheese",emoji:"🧀",col:"#facc15"},
  {name:"Bacon",emoji:"🥓",col:"#d64b2a"},
  {name:"Onion",emoji:"🧅",col:"#c8a8d8"},
  {name:"Top Bun",emoji:"🍔",col:"#e8890c"}
];
const BURGERS=[
  ["Bottom Bun","Patty","Cheese","Top Bun"],
  ["Bottom Bun","Patty","Lettuce","Tomato","Top Bun"],
  ["Bottom Bun","Patty","Cheese","Bacon","Lettuce","Top Bun"],
  ["Bottom Bun","Patty","Tomato","Onion","Lettuce","Cheese","Top Bun"],
  ["Bottom Bun","Patty","Cheese","Bacon","Tomato","Onion","Lettuce","Top Bun"]
];
function resize(){dpr=Math.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0)}
resize();addEventListener("resize",resize);
const AC=new(window.AudioContext||window.webkitAudioContext)();
function snd(freq,dur,type="sine",vol=0.1,slide=0){
  if(AC.state==="suspended")AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,AC.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
}
function sfxTap(){snd(500,0.05,"triangle",0.07)}
function sfxCorrect(){snd(640,0.08,"sine",0.1);setTimeout(()=>snd(860,0.09,"sine",0.09),60)}
function sfxWrong(){snd(210,0.14,"sawtooth",0.07,120)}
function sfxOrder(){[660,880].forEach((f,i)=>setTimeout(()=>snd(f,0.12,"triangle",0.1),i*90))}
function sfxOver(){snd(300,0.3,"sawtooth",0.09,140)}

function startGame(){
  state.phase="play";state.score=0;state.orderNum=0;state.streak=0;state.combo=1;state.t=0;state.feedback="";state.fbT=0;state.confetti=[];
  nextOrder();
}

function nextOrder(){
  const recipe=BURGERS[Math.floor(Math.random()*BURGERS.length)];
  state.pending=recipe.slice();
  state.stack=[];
  state.orderNum++;
  state.timer=Math.max(12,20-state.orderNum*0.8);
  if(!muted)sfxOrder();
}

function ingredientIndex(name){return INGREDIENTS.findIndex(i=>i.name===name)}

function update(dt){
  const d=dt/1000;
  state.t+=d;
  if(state.phase==="play"){
    state.timer-=d;
    if(state.timer<=0){failOrder();}
  }
  if(state.fbT>0)state.fbT-=d;
  for(let i=state.confetti.length-1;i>=0;i--){
    const p=state.confetti[i];p.y+=p.vy;p.x+=p.vx;p.rot+=p.vr;if(p.y>H+20)state.confetti.splice(i,1);
  }
}

function gridGeo(){
  const cols=4,padX=W*0.04;
  const cellW=(W-padX*2)/cols;
  const rows=Math.ceil(INGREDIENTS.length/cols);
  const gridBot=H*0.96;
  const cellH=Math.min(Math.max(34,(gridBot-H*0.42)/rows),cellW*0.75);
  return {cols,padX,cellW,cellH,rows,gridTop:gridBot-cellH*rows};
}

function tapIndex(px,py){
  const g=gridGeo();
  const c=Math.floor((px-g.padX)/g.cellW);
  const r=Math.floor((py-g.gridTop)/g.cellH);
  const idx=r*g.cols+c;
  if(r<0||r>=g.rows||c<0||c>=g.cols||idx>=INGREDIENTS.length)return -1;
  // hit check within cell bounds
  const gx=g.padX+c*g.cellW,gy=g.gridTop+r*g.cellH;
  if(px<gx+2||px>gx+g.cellW-2||py<gy+2||py>gy+g.cellH-2)return -1;
  return idx;
}

function wrongAction(){
  state.combo=1;state.feedback="✗";state.fbT=1.2;
  if(!muted)sfxWrong();
  reduceTimer();
}

function reduceTimer(){state.timer=Math.max(1,state.timer-2);}

function tapIngredient(idx){
  const chosen=INGREDIENTS[idx];
  if(state.pending.length===0){return;}
  if(chosen.name===state.pending[0]){
    state.stack.push(chosen.name);
    state.pending.shift();
    state.score+=10*state.combo;
    state.streak++;state.combo=Math.min(5,state.combo+(state.streak>=4?1:0));
    state.feedback="✓";state.fbT=0.5;
    if(!muted)sfxCorrect();
    if(state.pending.length===0){completeOrder();}
  }else{
    wrongAction();
  }
}

function completeOrder(){
  const bonus=Math.round(state.timer)*5;
  state.score+=bonus;
  if(!muted)sfxOrder();
  launchConfetti(Math.floor(W/2),H*0.2);
  nextOrder();
}

function failOrder(){
  state.combo=1;state.feedback="⏱";state.fbT=1.4;
  if(!muted)sfxOver();
  nextOrder();
}

function launchConfetti(x,y){
  for(let i=0;i<60;i++)state.confetti.push({x,y,vx:(Math.random()-0.5)*6,vy:-2-Math.random()*4,s:3+Math.random()*5,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.3,col:["#4ade80","#facc15","#ef4444","#22d3ee"][i%4]});
}

function drawIngredientIcon(x,y,s,col,emoji){
  X.save();X.translate(x,y);
  X.fillStyle=col;X.shadowColor=col;X.shadowBlur=8;
  X.beginPath();X.arc(0,0,s/2,0,Math.PI*2);X.fill();
  X.shadowBlur=0;
  X.font=`${s*0.62}px "Segoe UI",sans-serif`;
  X.textAlign="center";X.textBaseline="middle";
  X.fillText(emoji,0,0);
  X.restore();
}

function drawMenu(){
  X.fillStyle="#0a0807";X.fillRect(0,0,W,H);
  X.textAlign="center";X.textBaseline="middle";
  X.font=`900 ${Math.max(26,Math.min(W*0.11,H*0.19))}px "Segoe UI",sans-serif`;
  X.fillStyle="#fff";X.shadowColor="#facc15";X.shadowBlur=26;
  X.fillText("Sizzle Stack",W/2,H*0.2);
  X.shadowBlur=0;
  const subs=["Build burgers by tapping ingredients in order.","Follow the recipe - tap the next layer before time runs out.","Score streaks and combos to climb the board."];
  X.font=`500 ${Math.max(11,Math.min(W*0.029,H*0.048))}px "Segoe UI",sans-serif`;
  X.fillStyle="#94a3b8";
  subs.forEach((s,i)=>X.fillText(s,W/2,H*0.29+Math.min(H*0.1,W*0.045)*i));
  const bw=Math.min(W*0.82,420),bh=Math.max(52,Math.min(H*0.13,W*0.14)),x0=(W-bw)/2,y0=Math.max(H*0.52,H*0.5);
  X.shadowColor="#facc15";X.shadowBlur=18;
  rr(x0,y0,bw,bh,14);X.fillStyle="#3a2505";X.fill();
  X.shadowBlur=0;
  X.fillStyle="#facc15";X.font=`700 ${bh*0.32}px "Segoe UI",sans-serif`;
  X.fillText("COOK!",W/2,y0+bh*0.5);
  X.font=`600 ${Math.min(W,H)*0.022}px "Segoe UI",sans-serif`;
  X.fillStyle="#64748b";
  X.fillText("Tap ingredients in recipe order · M to mute"+(muted?" (muted)":""),W/2,H*0.9);
  if(state.best>0){X.font=`700 ${Math.min(W,H)*0.03}px "Segoe UI",sans-serif`;X.fillStyle="#4ade80";X.fillText("High Score "+state.best,W/2,H*0.42);}
}

function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}

function drawPlay(){
  X.fillStyle="#0a0807";X.fillRect(0,0,W,H);
  // header
  X.textAlign="left";X.textBaseline="middle";
  X.fillStyle="#94a3b8";X.font=`700 ${Math.min(W*0.09,H*0.05)}px "Segoe UI",sans-serif`;
  X.fillText("Score "+state.score,W*0.04,H*0.045);
  X.textAlign="right";X.fillText("Order #"+state.orderNum,W*0.96,H*0.045);
  X.textAlign="center";
  X.fillStyle="#fff";X.font=`800 ${Math.max(12,Math.min(W*0.05,H*0.04))}px "Segoe UI",sans-serif`;
  X.fillText("Sizzle Stack",W/2,H*0.045);

  // timer bar
  const tbW=W*0.9,tbX=(W-tbW)/2,tbY=H*0.08,tbH=Math.max(6,H*0.02);
  const ratio=Math.max(0,Math.min(1,state.timer/20));
  X.fillStyle="rgba(255,255,255,0.1)";rr(tbX,tbY,tbW,tbH,4);X.fill();
  X.fillStyle=ratio>0.4?"#4ade80":(ratio>0.2?"#facc15":"#ef4444");
  rr(tbX,tbY,tbW*ratio,tbH,4);X.fill();

  // order recipe row (the remaining needed layers)
  const needed=state.pending;
  const remW=Math.min(W*0.9,W),remX=(W-remW)/2,remY=H*0.14,itemS=Math.min(W*0.09,H*0.06);
  const totalW=needed.length*itemS;
  let dx=remX+(remW-totalW)/2;
  for(const n of needed){
    const idx=ingredientIndex(n);
    drawIngredientIcon(dx+itemS/2,remY,itemS,INGREDIENTS[idx].col,INGREDIENTS[idx].emoji);
    dx+=itemS;
  }

  // built stack label + layers (fills the middle band)
  const g2=gridGeo();
  const stackY=(g2.gridTop+H*0.22)/2;
  X.fillStyle="#64748b";X.font=`600 ${Math.min(W*0.04,H*0.03)}px "Segoe UI",sans-serif`;
  X.textAlign="left";X.fillText("Built so far:",W*0.05,stackY-H*0.07);
  const sS=Math.min(W*0.09,H*0.07);
  let sdx=W*0.05;
  for(const n of state.stack){
    const idx=ingredientIndex(n);
    drawIngredientIcon(sdx+sS/2,stackY,sS,INGREDIENTS[idx].col,INGREDIENTS[idx].emoji);
    sdx+=sS*0.85;
  }

  // ingredient grid (buttons) anchored to bottom of play area
  const g=gridGeo();
  for(let i=0;i<INGREDIENTS.length;i++){
    const c=i%g.cols,r=Math.floor(i/g.cols);
    const gx=g.padX+c*g.cellW,gy=g.gridTop+r*g.cellH;
    const it=INGREDIENTS[i];
    rr(gx+3,gy+3,g.cellW-6,g.cellH-6,10);
    const active=state.pending[0]===it.name;
    X.fillStyle=active?"rgba(74,222,128,0.18)":"rgba(255,255,255,0.06)";
    X.fill();
    X.lineWidth=2;X.strokeStyle=active?"#4ade80":"rgba(255,255,255,0.12)";X.stroke();
    drawIngredientIcon(gx+g.cellW/2,gy+g.cellH/2-3,g.cellH*0.32,it.col,it.emoji);
    X.fillStyle=active?"#4ade80":"#cbd5e1";
    X.font=`600 ${Math.max(9,Math.min(g.cellW*0.12,g.cellH*0.12))}px "Segoe UI",sans-serif`;
    X.textAlign="center";X.textBaseline="middle";
    X.fillText(it.name, gx+g.cellW/2, gy+g.cellH-7);
  }

  // feedback
  if(state.fbT>0){
    X.globalAlpha=Math.min(1,state.fbT);
    X.font=`900 ${Math.min(W*0.2,H*0.18)}px "Segoe UI",sans-serif`;
    X.textAlign="center";X.textBaseline="middle";
    X.fillStyle=state.feedback==="✓"?"#4ade80":"#ef4444";
    X.shadowColor=X.fillStyle;X.shadowBlur=20;
    X.fillText(state.feedback,W/2,H*0.13);
    X.globalAlpha=1;X.shadowBlur=0;
  }

  // streak/combo
  if(state.streak>=4){
    X.font=`700 ${Math.min(W*0.05,H*0.04)}px "Segoe UI",sans-serif`;
    X.fillStyle="rgba(250,204,21,0.9)";X.textAlign="center";
    X.fillText("x"+state.combo+" COMBO",W/2,H*0.07);
  }
  drawConfetti();
}

function drawConfetti(){
  for(const p of state.confetti){
    X.save();X.translate(p.x,p.y);X.rotate(p.rot);X.fillStyle=p.col;X.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);X.restore();
  }
}

function draw(){
  if(state.phase==="menu"){drawMenu();return;}
  drawPlay();
}

C.addEventListener("pointerdown",e=>{
  if(state.phase==="menu"){
    const bw=Math.min(W*0.82,420),bh=Math.max(52,Math.min(H*0.13,W*0.14)),x0=(W-bw)/2,y0=Math.max(H*0.52,H*0.5);
    if(e.clientX>=x0&&e.clientX<=x0+bw&&e.clientY>=y0&&e.clientY<=y0+bh){startGame();}
    return;
  }
  const idx=tapIndex(e.clientX,e.clientY);
  if(idx>=0){if(!muted)sfxTap();tapIngredient(idx);}
});

addEventListener("keydown",e=>{
  if(e.key==="m"||e.key==="M"){muted=!muted;return;}
  if(state.phase==="menu"&&(e.key===" "||e.key==="Enter")){startGame();return;}
  if(state.phase!=="play")return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=INGREDIENTS.length){tapIngredient(n-1);}
});

function loadBest(){try{const b=parseInt(localStorage.getItem("sizzle-stack")||"0",10);if(b>0)state.best=b}catch(e){}}

let last=performance.now();
function loop(t){
  const dt=Math.min(50,t-last);last=t;
  if(state.phase==="play")update(dt);
  draw();
  requestAnimationFrame(loop);
}
loadBest();
requestAnimationFrame(loop);
</script>
</body>
</html>
