<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0807"/>
      <stop offset="100%" stop-color="#2a1a05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <g filter="url(#glow)" text-anchor="middle" font-family="Segoe UI Emoji, sans-serif">
    <text x="100" y="52" font-size="22">🍞</text>
    <rect x="58" y="40" width="84" height="14" rx="6" fill="#e8890c"/>
    <text x="100" y="95" font-size="26">🍖</text>
    <rect x="62" y="82" width="76" height="12" rx="3" fill="#7c2d12"/>
    <text x="100" y="128" font-size="22">🧀</text>
    <rect x="60" y="120" width="80" height="9" rx="4" fill="#facc15"/>
    <text x="100" y="156" font-size="20">🥬</text>
    <rect x="58" y="150" width="84" height="18" rx="8" fill="#d97706"/>
    <text x="100" y="168" font-size="16">🍔</text>
  </g>
  <text x="100" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#fff" filter="url(#glow)">Sizzle Stack</text>
</svg>
