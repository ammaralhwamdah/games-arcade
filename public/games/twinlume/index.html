<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Twinlume</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#07071a;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const C=document.getElementById("c"),X=C.getContext("2d");
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0)}
resize();addEventListener("resize",resize);

const AC=new(window.AudioContext||window.webkitAudioContext)();
function snd(freq,dur,type="sine",vol=0.12,slide=0){
  if(AC.state==="suspended")AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,AC.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
}
function sfxFlip(){snd(420,0.05,"triangle",0.07)}
function sfxMatch(){snd(660,0.09,"sine",0.1);setTimeout(()=>snd(880,0.12,"sine",0.1),70)}
function sfxBad(){snd(210,0.16,"sawtooth",0.05,110)}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,0.22,"triangle",0.11),i*120))}

const FORMS=[
  {name:"star",col:"#fbbf24"},
  {name:"moon",col:"#f472b6"},
  {name:"heart",col:"#ef4444"},
  {name:"drop",col:"#22d3ee"},
  {name:"bolt",col:"#a78bfa"},
  {name:"leaf",col:"#4ade80"},
  {name:"ring",col:"#facc15"},
  {name:"clover",col:"#2dd4bf"},
  {name:"diamond",col:"#e879f9"},
  {name:"shield",col:"#60a5fa"},
  {name:"crown",col:"#fbbf24"},
  {name:"hex",col:"#c084fc"},
  {name:"spear",col:"#fb7185"},
  {name:"smile",col:"#4ade80"},
  {name:"tower",col:"#38bdf8"},
  {name:"gem",col:"#a3e635"},
  {name:"wave",col:"#67e8f9"},
  {name:"flower",col:"#f0abfc"}
];

const LEVELS=[
  {name:"Easy",rows:3,cols:4},
  {name:"Medium",rows:4,cols:4},
  {name:"Hard",rows:4,cols:6}
];

let muted=false;
let state={level:0,cards:[],flipped:[],matched:0,moves:0,lock:false,start:0,t:0,phase:"menu",best:[0,0,0],pairs:0};

function loadBest(){try{const b=JSON.parse(localStorage.getItem("twinlume")||"null");if(b&&b.length===3)state.best=b}catch(e){}}
function saveBest(){try{localStorage.setItem("twinlume",JSON.stringify(state.best))}catch(e){}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildLevel(){
  const L=LEVELS[state.level];
  const n=L.rows*L.cols;
  const pairCount=n/2;
  const used=shuffle(FORMS.slice()).slice(0,pairCount);
  let deck=[];
  used.forEach((f,k)=>{deck.push({id:k,form:f});deck.push({id:k,form:f})});
  deck=shuffle(deck);
  state.cards=deck.map((d,i)=>({...d,pos:i,x:0,y:0,w:0,h:0,flip:0,anim:false,target:0,pair:false,glow:0}));
  state.flipped=[];state.matched=0;state.moves=0;state.lock=false;state.pairs=pairCount;state.t=0;state.phase="play";state.start=performance.now();
}

function layout(){
  const L=LEVELS[state.level];
  const nx=L.cols,ny=L.rows;
  const padX=W*0.05,padTop=H*0.155,padBot=H*0.045;
  const availW=W-padX*2,availH=H-padTop-padBot;
  const gap=Math.min(availW,availH)*0.035;
  let cw=(availW-(nx-1)*gap)/nx,ch=(availH-(ny-1)*gap)/ny;
  if(cw>ch)cw=ch;else ch=cw;
  cw*=0.98;ch*=0.98;
  const totalW=nx*cw+(nx-1)*gap,totalH=ny*ch+(ny-1)*gap;
  const ox=(W-totalW)/2,oy=padTop+((availH-totalH)/2);
  state.cards.forEach(c=>{
    const r=Math.floor(c.pos/nx),col=c.pos%nx;
    c.x=ox+col*(cw+gap);c.y=oy+r*(ch+gap);c.w=cw;c.h=ch;
  });
}

function drawForm(x,y,s,f,glow){
  X.save();
  X.translate(x,y);
  X.lineWidth=Math.max(2,s*0.09);
  X.strokeStyle=f.col;X.fillStyle=f.col;
  X.shadowColor=f.col;X.shadowBlur=glow?s*0.3:0;
  X.beginPath();
  const n=f.name;
  if(n==="star"){
    for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,R=i%2?s*0.42:s;const px=Math.cos(a)*R,py=Math.sin(a)*R;i?X.lineTo(px,py):X.moveTo(px,py)}
    X.fill();
  }else if(n==="moon"){
    X.arc(0,0,s*0.5,Math.PI/2,Math.PI*1.6);
    X.arc(s*0.2,0,s*0.42,Math.PI*1.55,Math.PI*0.5,true);
    X.closePath();X.fill();
  }else if(n==="heart"){
    const S=s*0.55;
    X.moveTo(0,S*0.3);X.bezierCurveTo(-S,-S*0.4,-S*1.2,S*0.3,0,S);X.fill();
  }else if(n==="drop"){
    X.moveTo(0,-s*0.55);X.bezierCurveTo(s*0.55,s*0.05,s*0.5,s*0.62,0,s*0.5);X.bezierCurveTo(-s*0.5,s*0.62,-s*0.55,s*0.05,0,-s*0.55);X.fill();
  }else if(n==="bolt"){
    X.moveTo(s*0.1,-s*0.6);X.lineTo(-s*0.35,s*0.12);X.lineTo(s*0.02,s*0.12);X.lineTo(-s*0.1,s*0.6);X.lineTo(s*0.35,-s*0.12);X.lineTo(s*0.02,-s*0.12);X.closePath();X.fill();
  }else if(n==="leaf"){
    X.moveTo(-s*0.5,0);X.quadraticCurveTo(-s*0.2,-s*0.55,s*0.2,-s*0.2);X.quadraticCurveTo(s*0.5,s*0.25,s*0.1,s*0.5);X.quadraticCurveTo(s*0.35,s*0.05,s*0.1,-s*0.1);X.closePath();X.fill();
  }else if(n==="ring"){
    X.arc(0,0,s*0.42,0,Math.PI*2);X.stroke();
  }else if(n==="clover"){
    const R=s*0.3;
    for(const[dx,dy]of[[0,-R],[0,R],[-R,0],[R,0]]){X.moveTo(dx+R,dy);X.arc(dx,dy,R,0,Math.PI*2)}
    X.fill();
  }else if(n==="diamond"){
    X.moveTo(0,-s*0.55);X.lineTo(s*0.4,0);X.lineTo(0,s*0.55);X.lineTo(-s*0.4,0);X.closePath();X.stroke();
    X.beginPath();X.moveTo(0,-s*0.19);X.lineTo(0,s*0.19);X.stroke();
  }else if(n==="shield"){
    X.moveTo(-s*0.3,s*0.5);X.lineTo(-s*0.42,-s*0.15);X.quadraticCurveTo(-s*0.3,-s*0.5,0,-s*0.52);X.quadraticCurveTo(s*0.3,-s*0.5,s*0.42,-s*0.15);X.lineTo(s*0.3,s*0.5);X.closePath();X.stroke();
    X.beginPath();X.moveTo(0,s*0.5);X.lineTo(-s*0.3,-s*0.15);X.stroke();
  }else if(n==="crown"){
    X.moveTo(-s*0.45,s*0.25);X.lineTo(-s*0.45,-s*0.45);X.lineTo(-s*0.15,-s*0.05);X.lineTo(0,-s*0.55);X.lineTo(s*0.15,-s*0.05);X.lineTo(s*0.45,-s*0.45);X.lineTo(s*0.45,s*0.25);X.closePath();X.fill();
  }else if(n==="hex"){
    for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2,px=Math.cos(a)*s*0.5,py=Math.sin(a)*s*0.5;i?X.lineTo(px,py):X.moveTo(px,py)}
    X.closePath();X.stroke();
  }else if(n==="spear"){
    X.moveTo(0,-s*0.6);X.lineTo(s*0.28,-s*0.15);X.lineTo(s*0.1,-s*0.15);X.lineTo(s*0.1,s*0.6);X.lineTo(-s*0.1,s*0.6);X.lineTo(-s*0.1,-s*0.15);X.lineTo(-s*0.28,-s*0.15);X.closePath();X.fill();
  }else if(n==="smile"){
    X.arc(0,0,s*0.45,0,Math.PI*2);X.stroke();
    X.beginPath();X.arc(-s*0.17,-s*0.1,s*0.05,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(s*0.17,-s*0.1,s*0.05,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(0,s*0.08,s*0.22,0.15*Math.PI,0.85*Math.PI);X.stroke();
  }else if(n==="tower"){
    X.moveTo(-s*0.42,s*0.6);X.lineTo(-s*0.42,-s*0.2);X.lineTo(-s*0.15,-s*0.55);X.lineTo(s*0.15,-s*0.55);X.lineTo(s*0.42,-s*0.2);X.lineTo(s*0.42,s*0.6);X.closePath();X.fill();
    X.fillRect(-s*0.08,-s*0.72,s*0.16,s*0.2);
  }else if(n==="gem"){
    X.moveTo(-s*0.5,0);X.lineTo(-s*0.25,-s*0.5);X.lineTo(s*0.25,-s*0.5);X.lineTo(s*0.5,0);X.lineTo(0,s*0.5);X.closePath();X.fill();
    X.beginPath();X.moveTo(-s*0.25,-s*0.02);X.lineTo(s*0.25,-s*0.02);X.stroke();
  }else if(n==="wave"){
    X.beginPath();X.moveTo(-s*0.5,-s*0.2);
    X.bezierCurveTo(-s*0.3,-s*0.5,-s*0.1,s*0.1,0,-s*0.15);
    X.bezierCurveTo(s*0.1,-s*0.4,s*0.3,s*0.1,s*0.5,-s*0.2);
    X.stroke();
  }else if(n==="flower"){
    for(let i=0;i<5;i++){const a=i*Math.PI/2.5-Math.PI/2;X.beginPath();X.arc(Math.cos(a)*s*0.3,Math.sin(a)*s*0.3,s*0.22,0,Math.PI*2);X.fill()}
    X.beginPath();X.fillStyle="#fff";X.shadowBlur=0;X.arc(0,0,s*0.15,0,Math.PI*2);X.fill();
  }
  X.restore();
}

function rr(x,y,w,h,r){
  X.beginPath();
  X.moveTo(x+r,y);
  X.arcTo(x+w,y,x+w,y+h,r);
  X.arcTo(x+w,y+h,x,y+h,r);
  X.arcTo(x,y+h,x,y,r);
  X.arcTo(x,y,x+w,y,r);
  X.closePath();
}

function fmt(t){
  const m=Math.floor(t/60),s=Math.floor(t%60);
  return m+":"+String(s).padStart(2,"0");
}

function drawBack(x,y,w,h){
  rr(x,y,w,h,12);
  const g=X.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,"#1c1640");g.addColorStop(1,"#0d0b26");
  X.fillStyle=g;X.fill();
  X.lineWidth=1.5;X.strokeStyle="rgba(167,139,250,0.45)";X.stroke();
  const cx=x+w/2,cy=y+h/2,s=Math.min(w,h)*0.32;
  X.save();
  X.translate(cx,cy);
  X.font=`800 ${s*1.1}px "Segoe UI",sans-serif`;
  X.textAlign="center";X.textBaseline="middle";
  X.fillStyle="rgba(167,139,250,0.5)";
  X.shadowColor="#a78bfa";X.shadowBlur=10;
  X.fillText("?",0,0);
  X.restore();
}

function drawFace(x,y,w,h,f,pair){
  rr(x,y,w,h,12);
  const g=X.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,pair?"#102b1c":"#14123a");g.addColorStop(1,pair?"#0a1a12":"#0b1120");
  X.fillStyle=g;X.fill();
  X.lineWidth=1.5;X.strokeStyle=pair?"rgba(74,222,128,0.8)":"rgba(167,139,250,0.55)";X.stroke();
  drawForm(x+w/2,y+h/2,Math.min(w,h)*0.42,f,true);
}

function drawLevelChooser(){
  X.fillStyle="#07071a";X.fillRect(0,0,W,H);
  X.textAlign="center";X.textBaseline="middle";
  X.font=`900 ${Math.max(26,Math.min(W*0.11,H*0.22))}px "Segoe UI",sans-serif`;
  X.fillStyle="#fff";
  X.shadowColor="#a78bfa";X.shadowBlur=24;
  X.fillText("Twinlume",W/2,H*0.18);
  X.shadowBlur=0;

  const subs=["Match the hidden pairs to clear the board.","Tap any two cards to flip them together.","Beat your best time on every grid."];
  X.font=`500 ${Math.max(11,Math.min(W*0.030,H*0.05))}px "Segoe UI",sans-serif`;
  X.fillStyle="#94a3b8";
  subs.forEach((s,i)=>X.fillText(s,W/2,H*0.28+Math.min(H*0.11,W*0.040)*i));

  const bw=Math.min(W*0.86,480),bh=Math.max(40,Math.min(H*0.13,W*0.14)),x0=(W-bw)/2;
  const step=bh+Math.min(H*0.12,W*0.035);
  const y0=Math.max(H*0.34,H*0.55-(3*step)/2);
  const cols=["#a78bfa","#22d3ee","#fb7185"];
  LEVELS.forEach((L,i)=>{
    const y=y0+i*step;
    X.shadowColor=cols[i];X.shadowBlur=18;
    rr(x0,y,bw,bh,14);X.fillStyle=i===0?"#221547":"#10122e";X.fill();
    X.shadowBlur=0;
    X.fillStyle=cols[i];
    X.font=`700 ${bh*0.3}px "Segoe UI",sans-serif`;X.textAlign="left";
    X.fillText(L.name+"  ("+L.rows+"x"+L.cols+")",x0+bw*0.06,y+bh*0.5);
    X.font=`500 ${bh*0.24}px "Segoe UI",sans-serif`;
    X.fillStyle="#cbd5e1";X.textAlign="right";
    X.fillText(state.best[i]>0?"Best "+fmt(state.best[i]):"Best —",x0+bw*0.94,y+bh*0.5);
    X.textAlign="center";
  });
  X.font=`600 ${Math.min(W,H)*0.022}px "Segoe UI",sans-serif`;
  X.fillStyle="#64748b";
  X.fillText("Touch or click a card to flip it · M to mute"+(muted?" (muted)":""),W/2,H*0.93);
}

function hitCards(px,py){
  for(let i=state.cards.length-1;i>=0;i--){
    const c=state.cards[i];
    if(!c.pair&&c.flip<=0&&px>=c.x&&px<=c.x+c.w&&py>=c.y&&py<=c.y+c.h)return c;
  }
  return null;
}

C.addEventListener("pointerdown",e=>{
  const px=e.clientX,py=e.clientY;
  if(state.phase==="menu"){
    const bw=Math.min(W*0.86,480),bh=Math.max(40,Math.min(H*0.13,W*0.14)),x0=(W-bw)/2;
    const step=bh+Math.min(H*0.12,W*0.035);
    const y0=Math.max(H*0.34,H*0.55-(3*step)/2);
    LEVELS.forEach((L,i)=>{
      const y=y0+i*step;
      if(px>=x0&&px<=x0+bw&&py>=y&&py<=y+bh)state.level=i;
    });
    buildLevel();return;
  }
  if(state.phase==="win"){state.phase="menu";return;}
  if(state.phase!=="play"||state.lock)return;
  const c=hitCards(px,py);
  if(!c||c.pair)return;
  if(!muted)sfxFlip();
  c.flip=0;c.target=1;c.anim=true;
  state.flipped.push(c);
  if(state.flipped.length===2)resolveTurn();
});

function resolveTurn(){
  state.lock=true;
  state.moves++;
  const [a,b]=state.flipped;
  if(a.id===b.id){
    a.pair=b.pair=true;
    state.matched++;
    if(!muted)sfxMatch();
    state.flipped=[];
    state.lock=false;
    if(state.matched===state.pairs)finishWin();
  }else{
    setTimeout(()=>{
      a.target=0;b.target=0;a.anim=true;b.anim=true;
      state.flipped=[];
      state.lock=false;
      if(!muted)sfxBad();
    },800);
  }
}

function finishWin(){
  const sec=Math.max(1,Math.round((performance.now()-state.start)/1000));
  state.phase="win";
  const prev=state.best[state.level];
  const better=prev===0||sec<prev;
  state.best[state.level]=better?sec:prev;
  saveBest();
  state.winMoves=state.moves;state.winTime=sec;state.winNew=better;
  if(!muted)sfxWin();
  state.confetti=[];
  for(let i=0;i<100;i++)state.confetti.push({x:Math.random()*W,y:-20-Math.random()*H*0.5,vx:(Math.random()-0.5)*3,vy:1.2+Math.random()*3,s:3+Math.random()*5,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.2,col:["#a78bfa","#22d3ee","#e879f9","#fbbf24","#4ade80"][i%5]});
}

function update(dt){
  state.t+=dt/1000;
  for(const c of state.cards){
    if(c.anim){
      c.flip+=(c.target===1?dt/0.18:-dt/0.18);
      if(c.target===1&&c.flip>=1){c.flip=1;c.anim=false;}
      else if(c.target===0&&c.flip<=0){c.flip=0;c.anim=false;}
    }
    if(c.pair&&!c.anim&&c.glow<1)c.glow=Math.min(1,c.glow+dt/0.35);
  }
  if(state.confetti)for(const p of state.confetti){p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y>H+30){p.y=-20;p.x=Math.random()*W}}
}

function draw(){
  if(state.phase==="menu"){drawLevelChooser();return;}
  X.fillStyle="#07071a";X.fillRect(0,0,W,H);
  layout();

  X.textBaseline="middle";
  const inf=()=>{
    const tT="Time "+fmt(state.t),pT=`Pairs ${state.matched}/${state.pairs}`,mT=`Moves ${state.moves}`;
    let f=Math.min(W*0.10,H*0.075);
    X.font=`700 ${f}px "Segoe UI",sans-serif`;
    const m=W*0.03,gap=W*0.02;
    while(f>10&&X.measureText(tT).width+X.measureText(pT).width+X.measureText(mT).width+m*2+gap*2>W){f-=1;X.font=`700 ${f}px "Segoe UI",sans-serif`;}
    const y=H*0.05;
    X.fillStyle="#94a3b8";X.textAlign="left";
    X.fillText(tT,m,y);
    X.textAlign="center";
    X.fillText(pT,W/2,y);
    X.textAlign="right";
    X.fillText(mT,W-m,y);
  };
  inf();

  X.shadowColor="rgba(167,139,250,0.4)";X.shadowBlur=12;
  X.fillStyle="#fff";X.font=`800 ${Math.max(11,Math.min(W*0.073,H*0.06))}px "Segoe UI",sans-serif`;
  X.textAlign="center";
  X.fillText("Twinlume",W/2,H*0.125);
  X.shadowBlur=0;

  for(const c of state.cards){
    const p=c.flip;
    const backSide=p<0.5;
    const scaleX=backSide?Math.cos(p*Math.PI):Math.cos((1-p)*Math.PI);
    if(scaleX<=0.02)continue;
    X.save();
    X.translate(c.x+c.w/2,c.y+c.h/2);
    X.scale(scaleX,1);
    if(backSide)drawBack(-c.w/2,-c.h/2,c.w,c.h);
    else drawFace(-c.w/2,-c.h/2,c.w,c.h,c.form,c.pair);
    X.restore();
    if(c.glow>0){
      X.save();
      X.globalAlpha=0.55*c.glow;
      X.strokeStyle="#4ade80";X.lineWidth=3;
      X.shadowColor="#4ade80";X.shadowBlur=16;
      rr(c.x-4,c.y-4,c.w+8,c.h+8,16);X.stroke();
      X.restore();
    }
  }

  if(state.confetti)drawConfetti();
  if(state.phase==="win")drawWin();
}

function drawConfetti(){
  for(const p of state.confetti){
    X.save();X.translate(p.x,p.y);X.rotate(p.rot);
    X.fillStyle=p.col;X.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
    X.restore();
  }
}

function drawWin(){
  X.fillStyle="rgba(4,6,14,0.72)";X.fillRect(0,0,W,H);
  const cw=Math.min(W*0.86,400),ch=Math.min(H*0.5,250),x0=(W-cw)/2,y0=(H-ch)/2;
  X.shadowColor="#a78bfa";X.shadowBlur=30;
  rr(x0,y0,cw,ch,20);X.fillStyle="#0f172a";X.fill();
  X.shadowBlur=0;
  X.strokeStyle="rgba(167,139,250,0.5)";X.lineWidth=1.5;rr(x0,y0,cw,ch,20);X.stroke();
  X.textAlign="center";X.textBaseline="middle";
  X.font=`800 ${Math.min(W,H)*0.05}px "Segoe UI",sans-serif`;
  X.fillStyle="#fff";X.shadowColor="#e879f9";X.shadowBlur=20;
  X.fillText("Board Cleared!",W/2,y0+ch*0.18);
  X.shadowBlur=0;
  X.font=`600 ${Math.min(W,H)*0.028}px "Segoe UI",sans-serif`;
  X.fillStyle="#94a3b8";
  X.fillText(`Time ${fmt(state.winTime)}  ·  Moves ${state.winMoves}`,W/2,y0+ch*0.42);
  X.font=`700 ${Math.min(W,H)*0.024}px "Segoe UI",sans-serif`;
  X.fillStyle=state.winNew?"#4ade80":"#64748b";
  X.fillText(state.winNew?"★ New best time!":"Best "+fmt(state.best[state.level]),W/2,y0+ch*0.56);
  X.font=`700 ${Math.min(W,H)*0.026}px "Segoe UI",sans-serif`;
  X.fillStyle="#cbd5e1";
  X.fillText("Tap to return to menu",W/2,y0+ch*0.78);
}

addEventListener("keydown",e=>{
  if(e.key==="m"||e.key==="M"){muted=!muted;return;}
  if(state.phase==="menu"&&e.key>="1"&&e.key<="3"){state.level=+e.key-1;buildLevel();return;}
  if(state.phase==="win"&&(e.key===" "||e.key==="Enter")){state.phase="menu";return;}
});

let last=performance.now();
function loop(t){
  const dt=Math.min(50,t-last);last=t;
  if(state.phase!=="menu")update(dt);
  draw();
  requestAnimationFrame(loop);
}
loadBest();
requestAnimationFrame(loop);
</script>
</body>
</html>
