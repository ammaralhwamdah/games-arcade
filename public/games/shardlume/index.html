<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Shardlume</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #e2e8f0; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(92vmin, 620px, calc(94vh * 9 / 9)); aspect-ratio: 1/1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 16px; background: radial-gradient(circle at 50% 30%, #141d3a 0%, #0b1020 70%); box-shadow: 0 10px 40px rgba(0,0,0,.5); touch-action: none; }
  #hud { position: absolute; top: 8px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-size: 15px; font-weight: 700; z-index: 4; pointer-events: none; }
  #hud .left { display: flex; gap: 14px; align-items: center; }
  #hud .score { color: #4ade80; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #hud .best { color: #fbbf24; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #hud .time { color: #22d3ee; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #soundBtn { pointer-events: auto; background: rgba(255,255,255,.1); border: 0; border-radius: 10px; width: 30px; height: 30px; font-size: 15px; cursor: pointer; color: #fff; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(11,16,32,.84); border-radius: 16px; text-align: center; padding: 20px; z-index: 6; backdrop-filter: blur(3px); }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 38px; letter-spacing: 1px; color: #fff; }
  #overlay h1 span { color: #22d3ee; }
  #overlay .sub { font-size: 14.5px; color: #94a3b8; max-width: 320px; line-height: 1.55; }
  #overlay .final { font-size: 18px; color: #fbbf24; font-weight: 700; display: none; }
  #overlay .btn { background: #22d3ee; color: #082f36; border: 0; border-radius: 12px; padding: 13px 34px; font-size: 17px; font-weight: 800; cursor: pointer; transition: transform .1s, filter .1s; }
  #overlay .btn:hover { filter: brightness(1.1); }
  #overlay .btn:active { transform: scale(.96); }
  .controls { display: none; grid-template-columns: repeat(3, 54px); gap: 8px; margin-top: 6px; }
  .controls button { height: 54px; border: 0; border-radius: 12px; background: rgba(255,255,255,.08); color: #e2e8f0; font-size: 22px; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  @media (hover: none), (pointer: coarse), (max-width: 768px) { .controls { display: grid; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span class="left"><span class="score">SCORE 0</span><span class="best">BEST 0</span><span class="time" id="timeEl">60s</span></span><button id="soundBtn" title="Sound: on" aria-label="Toggle sound">🔊</button></div>
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1>PRISM<span> CASCADE</span></h1>
    <div class="sub">Tap one prism, then tap a neighbour to swap. Line up 3+ of the same colour to shatter them — every cascade doubles the points. 60 seconds on the clock.</div>
    <div class="final" id="finalMsg">Time's up — Score: 0</div>
    <button class="btn" id="playBtn">PLAY</button>
  </div>
</div>
<script>
(function () {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const playBtn = document.getElementById("playBtn");
  const finalMsg = document.getElementById("finalMsg");
  const scoreEl = document.querySelector("#hud .score");
  const bestEl = document.querySelector("#hud .best");
  const timeEl = document.getElementById("timeEl");

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const ROWS = 8, COLS = 8, TYPES = 6;
  const GEM_COLORS = ["#f43f5e", "#f59e0b", "#22d3ee", "#4ade80", "#a78bfa", "#fbbf24"];

  let cell, ox, oy, board, selected, score, best, timeLeft, running, timerId, resolving;

  const KEY_BEST = "pc.best";
  best = parseInt(localStorage.getItem(KEY_BEST) || "0", 10);
  bestEl.textContent = "BEST " + best;

  function resize() {
    const size = canvas.getBoundingClientRect().width;
    canvas.width = size * DPR;
    canvas.height = size * DPR;
    cell = canvas.width / COLS;
    ox = 0; oy = 0;
    draw();
  }

  function newBoard() {
    board = [];
    for (let r = 0; r < ROWS; r++) {
      board[r] = [];
      for (let c = 0; c < COLS; c++) {
        let t;
        do { t = Math.floor(Math.random() * TYPES); } while (matchAt(r, c, t));
        board[r][c] = t;
      }
    }
  }

  function matchAt(r, c, t) {
    if (c >= 2 && board[r][c - 1] === t && board[r][c - 2] === t) return true;
    if (r >= 2 && board[r - 1][c] === t && board[r - 2][c] === t) return true;
    return false;
  }

  function findMatches() {
    const set = new Set();
    for (let r = 0; r < ROWS; r++) {
      let run = 1;
      for (let c = 1; c <= COLS; c++) {
        if (c < COLS && board[r][c] === board[r][c - 1]) run++;
        else { if (run >= 3) for (let k = c - run; k < c; k++) set.add(r + "," + k); run = 1; }
      }
    }
    for (let c = 0; c < COLS; c++) {
      let run = 1;
      for (let r = 1; r <= ROWS; r++) {
        if (r < ROWS && board[r][c] === board[r - 1][c]) run++;
        else { if (run >= 3) for (let k = r - run; k < r; k++) set.add(k + "," + c); run = 1; }
      }
    }
    return [...set].map((s) => s.split(",").map(Number));
  }

  function hasPossibleMove() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        for (const [dr, dc] of [[0, 1], [1, 0]]) {
          const r2 = r + dr, c2 = c + dc;
          if (r2 >= ROWS || c2 >= COLS) continue;
          swap([r, c], [r2, c2]);
          const ok = findMatches().length > 0;
          swap([r, c], [r2, c2]);
          if (ok) return true;
        }
      }
    }
    return false;
  }

  function swap(a, b) { const t = board[a[0]][a[1]]; board[a[0]][a[1]] = board[b[0]][b[1]]; board[b[0]][b[1]] = t; }

  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

  function startGame() {
    ensureAudio();
    if (soundOn) { musicOn = true; startMusic(); }
    sfx.go();
    newBoard();
    while (!hasPossibleMove()) newBoard();
    score = 0; timeLeft = 60; resolving = false; selected = null;
    scoreEl.textContent = "SCORE 0";
    timeEl.textContent = "60s";
    running = true;
    overlay.classList.add("hidden");
    clearInterval(timerId);
    timerId = setInterval(tick, 1000);
    draw();
  }

  function tick() {
    if (!running) return;
    timeLeft--;
    timeEl.textContent = Math.max(0, timeLeft) + "s";
    if (timeLeft <= 0) endGame();
  }

  function endGame() {
    running = false;
    clearInterval(timerId);
    stopMusic();
    sfx.crash();
    if (score > best) {
      best = score;
      localStorage.setItem(KEY_BEST, String(best));
      bestEl.textContent = "BEST " + best;
    }
    finalMsg.textContent = "Time's up — Score: " + score;
    finalMsg.style.display = "block";
    document.querySelector("#overlay h1").textContent = "TIME'S UP";
    playBtn.textContent = "PLAY AGAIN";
    overlay.classList.remove("hidden");
  }

  async function trySwap(a, b) {
    if (resolving) return;
    const [ar, ac] = a, [br, bc] = b;
    swap(a, b);
    const matches = findMatches();
    if (matches.length === 0) {
      swap(a, b);
      sfx.deny();
      selected = null;
      draw();
      return;
    }
    selected = null;
    resolving = true;
    await resolve(matches, 1);
    resolving = false;
    draw();
  }

  async function resolve(matches, mult) {
    let toRemove = matches;
    while (toRemove.length > 0) {
      const count = toRemove.length;
      const add = count * 10 * mult;
      score += add;
      scoreEl.textContent = "SCORE " + score;
      sfx.clear(mult);
      for (const [r, c] of toRemove) board[r][c] = -1;
      await sleep(220);
      await applyGravity();
      if (!hasPossibleMove()) {
        newBoard();
        sfx.reshuffle();
        await sleep(160);
      }
      const next = findMatches();
      if (next.length > 0) { mult++; toRemove = next; }
      else break;
    }
  }

  async function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== -1) { board[write][c] = board[r][c]; if (write !== r) board[r][c] = -1; write--; }
      }
      for (; write >= 0; write--) board[write][c] = Math.floor(Math.random() * TYPES);
    }
  }

  // ---------- input ----------
  function cellAt(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (canvas.width / r.width);
    const y = (e.clientY - r.top) * (canvas.height / r.height);
    const c = Math.floor((x - ox) / cell), rr = Math.floor((y - oy) / cell);
    if (c < 0 || c >= COLS || rr < 0 || rr >= ROWS) return null;
    return [rr, c];
  }

  function handleTap(e) {
    if (!running || resolving) return;
    const pos = cellAt(e);
    if (!pos) return;
    if (!selected) { selected = pos; sfx.select(); draw(); return; }
    if (selected[0] === pos[0] && selected[1] === pos[1]) { selected = null; draw(); return; }
    const dr = Math.abs(selected[0] - pos[0]), dc = Math.abs(selected[1] - pos[1]);
    if (dr + dc === 1) { trySwap(selected, pos); }
    else { selected = pos; sfx.select(); draw(); }
  }

  canvas.addEventListener("pointerdown", handleTap);

  // keyboard: arrows move cursor, space/enter swaps, esc clears
  let cur = { r: 3, c: 3 };
  document.addEventListener("keydown", (e) => {
    if (!running) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); startGame(); } return; }
    const mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (mv) {
      e.preventDefault();
      cur.r = Math.max(0, Math.min(ROWS - 1, cur.r + mv[0]));
      cur.c = Math.max(0, Math.min(COLS - 1, cur.c + mv[1]));
      selected = [cur.r, cur.c];
      sfx.select();
      draw();
      return;
    }
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (!selected) { selected = [cur.r, cur.c]; }
      else if (selected[0] === cur.r && selected[1] === cur.c) { selected = null; }
      else { trySwap(selected, [cur.r, cur.c]); }
    }
    if (e.key === "Escape") { selected = null; }
  });

  playBtn.addEventListener("click", () => startGame());

  // ---------- drawing ----------
  function gemCenter(r, c) {
    return [ox + c * cell + cell / 2, oy + r * cell + cell / 2];
  }

  function drawGem(r, c, t, flash) {
    const [gx, gy] = gemCenter(r, c);
    const s = cell * (flash ? 0.7 : 0.86);
    ctx.save();
    ctx.translate(gx, gy);
    const col = GEM_COLORS[t];
    ctx.shadowColor = col;
    ctx.shadowBlur = 14 * DPR * (flash ? 1.6 : 1);
    ctx.fillStyle = col;
    ctx.beginPath();
    if (t === 0) { // diamond
      ctx.moveTo(0, -s * 0.55); ctx.lineTo(s * 0.55, 0); ctx.lineTo(0, s * 0.55); ctx.lineTo(-s * 0.55, 0);
    } else if (t === 1) { // circle
      ctx.arc(0, 0, s * 0.42, 0, Math.PI * 2);
    } else if (t === 2) { // triangle
      ctx.moveTo(0, -s * 0.55); ctx.lineTo(s * 0.52, s * 0.45); ctx.lineTo(-s * 0.52, s * 0.45);
    } else if (t === 3) { // square
      ctx.rect(-s * 0.42, -s * 0.42, s * 0.84, s * 0.84);
    } else if (t === 4) { // star
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        const rr = i % 2 === 0 ? s * 0.5 : s * 0.24;
        if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
    } else { // hexagon
      for (let i = 0; i < 6; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 3;
        if (i === 0) ctx.moveTo(Math.cos(a) * s * 0.48, Math.sin(a) * s * 0.48); else ctx.lineTo(Math.cos(a) * s * 0.48, Math.sin(a) * s * 0.48);
      }
      ctx.closePath();
    }
    ctx.fill();
    // inner highlight
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.arc(-s * 0.13, -s * 0.15, s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    if (!board) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // subtle grid
    ctx.strokeStyle = "rgba(148,163,184,0.06)";
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(ox + i * cell, oy); ctx.lineTo(ox + i * cell, oy + ROWS * cell); ctx.stroke(); }
    for (let i = 1; i < ROWS; i++) { ctx.beginPath(); ctx.moveTo(ox, oy + i * cell); ctx.lineTo(ox + COLS * cell, oy + i * cell); ctx.stroke(); }

    const now = Date.now();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = board[r][c];
        if (t < 0) continue;
        drawGem(r, c, t, false);
      }
    }
    // selection highlight
    if (selected && running) {
      const [r, c] = selected;
      const [gx, gy] = gemCenter(r, c);
      const pulse = 1 + 0.06 * Math.sin(now / 120);
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 3 * DPR;
      ctx.shadowColor = "#fff";
      ctx.shadowBlur = 12 * DPR;
      ctx.beginPath();
      ctx.arc(gx, gy, cell * 0.52 * pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  // ---------- sound ----------
  let AC = null, master = null, soundOn = true, musicOn = false, musicTimer = null;
  function ensureAudio() {
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        master = AC.createGain();
        master.gain.value = 0.5;
        master.connect(AC.destination);
      } catch (e) { AC = null; }
    }
    if (AC && AC.state === "suspended") AC.resume();
  }
  const soundBtn = document.getElementById("soundBtn");
  soundBtn.addEventListener("click", () => {
    ensureAudio();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊" : "🔇";
    soundBtn.title = soundOn ? "Sound: on" : "Sound: off";
    if (soundOn) { musicOn = true; startMusic(); } else { musicOn = false; stopMusic(); }
  });
  function tone(freq, dur, type, vol, when) {
    if (!AC || !master || !soundOn) return;
    const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    select: function () { tone(740, 0.06, "square", 0.09); },
    deny: function () { tone(150, 0.12, "sawtooth", 0.1); },
    clear: function (m) { const base = 440 * (1 + Math.min(m, 6) * 0.22); [0, 3, 6].forEach((i) => tone(base * (i === 0 ? 1 : 1.5), 0.1, "square", 0.13, i * 0.05)); },
    reshuffle: function () { tone(392, 0.1, "triangle", 0.12); tone(523, 0.1, "triangle", 0.12, 0.09); },
    crash: function () { tone(120, 0.4, "sawtooth", 0.18); tone(70, 0.5, "square", 0.15, 0.05); },
    go: function () { tone(523, 0.1, "square", 0.12); tone(784, 0.16, "square", 0.12, 0.12); },
  };
  function startMusic() {
    if (!soundOn || !musicOn || !AC || !master) return;
    stopMusic();
    const notes = [262, 330, 392, 330, 392, 523, 392, 330];
    let idx = 0, t = AC.currentTime + 0.1;
    musicTimer = setInterval(function () {
      if (!soundOn || !musicOn || !AC) { stopMusic(); return; }
      tone(notes[idx % notes.length], 0.1, "triangle", 0.04, t - AC.currentTime);
      idx++; t += 0.14;
    }, 140);
  }
  function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

  const origStart = startGame;
  startGame = function () {
    ensureAudio();
    if (soundOn) { musicOn = true; startMusic(); }
    sfx.go();
    origStart();
  };

  window.addEventListener("resize", resize);
  resize();

  (function idle() {
    if (!board) { draw(); }
    if (!running) requestAnimationFrame(idle);
  })();
})();
</script>
</body>
</html>
