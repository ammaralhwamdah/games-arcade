<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- grass -->
  <rect x="0" y="160" width="200" height="40" fill="#065f46" opacity="0.5"/>
  <!-- goal net (back) -->
  <g stroke="#22c55e" stroke-width="1" opacity="0.25">
    <line x1="50" y1="40" x2="50" y2="160"/>
    <line x1="70" y1="40" x2="70" y2="160"/>
    <line x1="90" y1="40" x2="90" y2="160"/>
    <line x1="110" y1="40" x2="110" y2="160"/>
    <line x1="130" y1="40" x2="130" y2="160"/>
    <line x1="150" y1="40" x2="150" y2="160"/>
    <line x1="40" y1="55" x2="160" y2="55"/>
    <line x1="40" y1="75" x2="160" y2="75"/>
    <line x1="40" y1="95" x2="160" y2="95"/>
    <line x1="40" y1="115" x2="160" y2="115"/>
    <line x1="40" y1="135" x2="160" y2="135"/>
  </g>
  <!-- goal frame -->
  <rect x="40" y="40" width="120" height="120" rx="4" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- crossbar accent -->
  <rect x="40" y="40" width="120" height="5" rx="2" fill="#ffffff" opacity="0.9"/>
  <!-- soccer ball -->
  <circle cx="100" cy="170" r="18" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <!-- pentagon pattern on ball -->
  <polygon points="100,155 94,162 97,170 103,170 106,162" fill="#1e293b"/>
  <polygon points="88,166 84,160 88,154 93,156 92,163" fill="#1e293b"/>
  <polygon points="112,166 116,160 112,154 107,156 108,163" fill="#1e293b"/>
  <polygon points="96,176 90,178 88,184 94,186 98,180" fill="#1e293b"/>
  <polygon points="104,176 110,178 112,184 106,186 102,180" fill="#1e293b"/>
  <!-- net swoosh behind ball -->
  <path d="M60 42 Q100 30 140 42" stroke="#22c55e" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- corner flag left -->
  <line x1="40" y1="40" x2="36" y2="24" stroke="#fbbf24" stroke-width="2"/>
  <rect x="32" y="20" width="10" height="7" fill="#fbbf24" opacity="0.8"/>
  <!-- corner flag right -->
  <line x1="160" y1="40" x2="164" y2="24" stroke="#fbbf24" stroke-width="2"/>
  <rect x="160" y="20" width="10" height="7" fill="#fbbf24" opacity="0.8"/>
</svg>