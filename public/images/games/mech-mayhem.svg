<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="mech" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- helmet outline -->
  <path d="M58 140 L58 80 Q58 40 100 30 Q142 40 142 80 L142 140 L130 155 L70 155 Z" fill="url(#mech)" stroke="#94a3b8" stroke-width="3"/>
  <!-- face plate -->
  <path d="M68 130 L68 85 Q68 58 100 48 Q132 58 132 85 L132 130 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- visor -->
  <rect x="72" y="82" width="56" height="20" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="2"/>
  <!-- left eye -->
  <circle cx="88" cy="92" r="6" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="88" cy="92" r="3" fill="#bbf7d0"/>
  <!-- right eye -->
  <circle cx="112" cy="92" r="6" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="112" cy="92" r="3" fill="#bbf7d0"/>
  <!-- mouth grill -->
  <line x1="84" y1="118" x2="116" y2="118" stroke="#475569" stroke-width="2"/>
  <line x1="84" y1="124" x2="116" y2="124" stroke="#475569" stroke-width="2"/>
  <line x1="84" y1="130" x2="116" y2="130" stroke="#475569" stroke-width="2"/>
  <!-- antenna left -->
  <line x1="66" y1="55" x2="52" y2="28" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="52" cy="28" r="4" fill="#fb923c" filter="url(#glow)"/>
  <!-- antenna right -->
  <line x1="134" y1="55" x2="148" y2="28" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="148" cy="28" r="4" fill="#fb923c" filter="url(#glow)"/>
  <!-- shoulder bolts -->
  <circle cx="58" cy="100" r="5" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="142" cy="100" r="5" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
</svg>