<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- mannequin head -->
  <circle cx="100" cy="52" r="22" fill="#f9a8d4" stroke="#c084fc" stroke-width="2"/>
  <!-- neck -->
  <rect x="94" y="72" width="12" height="14" rx="4" fill="#f9a8d4"/>
  <!-- dress body -->
  <path d="M70 86 Q100 80 130 86 L140 170 Q100 180 60 170 Z" fill="url(#dress)" stroke="#a855f7" stroke-width="2"/>
  <!-- waist -->
  <path d="M82 120 Q100 114 118 120" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <!-- sparkles -->
  <g fill="#fbbf24">
    <polygon points="30,40 32,34 34,40 40,42 34,44 32,50 30,44 24,42"/>
    <polygon points="164,56 166,50 168,56 174,58 168,60 166,66 164,60 158,58"/>
    <polygon points="48,130 50,126 52,130 56,132 52,134 50,138 48,134 44,132"/>
    <polygon points="152,110 153.5,106 155,110 159,111.5 155,113 153.5,117 152,113 148,111.5"/>
    <polygon points="24,90 25.5,86 27,90 31,91.5 27,93 25.5,97 24,93 20,91.5"/>
  </g>
  <!-- small star sparkles -->
  <g fill="#e9d5ff" opacity="0.7">
    <circle cx="160" cy="30" r="2"/>
    <circle cx="40" cy="170" r="1.5"/>
    <circle cx="170" cy="150" r="1.8"/>
  </g>
</svg>