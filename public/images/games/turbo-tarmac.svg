<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1c0a0a"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- track surface -->
  <ellipse cx="100" cy="105" rx="80" ry="80" fill="none" stroke="#374151" stroke-width="28" opacity="0.3"/>
  <!-- track center line -->
  <ellipse cx="100" cy="105" rx="80" ry="80" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="6 5" opacity="0.35"/>
  <!-- tire marks -->
  <path d="M30 100 Q40 60 70 40" stroke="#4b5563" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M170 100 Q160 150 130 170" stroke="#4b5563" stroke-width="2" fill="none" opacity="0.2"/>
  <!-- race car top-down view -->
  <g transform="translate(100,100) rotate(-30)">
    <!-- car body -->
    <rect x="-14" y="-30" width="28" height="60" rx="10" fill="url(#car)" stroke="#fca5a5" stroke-width="1.5"/>
    <!-- windshield -->
    <rect x="-10" y="-22" width="20" height="12" rx="4" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
    <!-- rear window -->
    <rect x="-8" y="14" width="16" height="8" rx="3" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
    <!-- hood detail -->
    <rect x="-6" y="-30" width="12" height="6" rx="2" fill="#dc2626"/>
    <!-- side stripes -->
    <rect x="-14" y="-10" width="3" height="20" rx="1" fill="#fbbf24"/>
    <rect x="11" y="-10" width="3" height="20" rx="1" fill="#fbbf24"/>
    <!-- number -->
    <circle cx="0" cy="2" r="6" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#991b1b" text-anchor="middle">7</text>
    <!-- wheels -->
    <rect x="-18" y="-24" width="5" height="10" rx="2" fill="#1e293b"/>
    <rect x="13" y="-24" width="5" height="10" rx="2" fill="#1e293b"/>
    <rect x="-18" y="14" width="5" height="10" rx="2" fill="#1e293b"/>
    <rect x="13" y="14" width="5" height="10" rx="2" fill="#1e293b"/>
    <!-- headlights -->
    <rect x="-8" y="-33" width="5" height="3" rx="1" fill="#fbbf24"/>
    <rect x="3" y="-33" width="5" height="3" rx="1" fill="#fbbf24"/>
    <!-- tail lights -->
    <rect x="-8" y="27" width="5" height="3" rx="1" fill="#ef4444" opacity="0.8"/>
    <rect x="3" y="27" width="5" height="3" rx="1" fill="#ef4444" opacity="0.8"/>
  </g>
  <!-- speed lines -->
  <line x1="55" y1="130" x2="40" y2="155" stroke="#ef4444" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="65" y1="138" x2="52" y2="162" stroke="#ef4444" stroke-width="1" opacity="0.25" stroke-linecap="round"/>
  <!-- checkered flag accent top-right -->
  <g transform="translate(160,15)" opacity="0.5">
    <rect x="0" y="0" width="6" height="6" fill="#ffffff"/>
    <rect x="6" y="0" width="6" height="6" fill="#1e293b"/>
    <rect x="12" y="0" width="6" height="6" fill="#ffffff"/>
    <rect x="0" y="6" width="6" height="6" fill="#1e293b"/>
    <rect x="6" y="6" width="6" height="6" fill="#ffffff"/>
    <rect x="12" y="6" width="6" height="6" fill="#1e293b"/>
    <rect x="0" y="12" width="6" height="6" fill="#ffffff"/>
    <rect x="6" y="12" width="6" height="6" fill="#1e293b"/>
    <rect x="12" y="12" width="6" height="6" fill="#ffffff"/>
  </g>
</svg>