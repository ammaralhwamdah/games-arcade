<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#270e33"/>
      <stop offset="1" stop-color="#4a154b"/>
    </linearGradient>
    <linearGradient id="dress2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- mannequin head -->
  <circle cx="100" cy="54" r="20" fill="#fbcfe8" stroke="#f472b6" stroke-width="2"/>
  <!-- hair with salon flip -->
  <path d="M78 48 Q64 26 86 22 Q100 26 114 22 Q136 26 122 48 Q112 40 100 44 Q88 40 78 48 Z" fill="#7c3aed"/>
  <!-- neck -->
  <rect x="95" y="72" width="10" height="12" rx="4" fill="#fbcfe8"/>
  <!-- salon cape / dress -->
  <path d="M70 84 Q100 78 130 84 L142 162 Q100 178 58 162 Z" fill="url(#dress2)" stroke="#ec4899" stroke-width="2"/>
  <path d="M86 118 Q100 110 114 118" stroke="#be185d" stroke-width="2" fill="none"/>
  <!-- scissors -->
  <g transform="translate(26,58) rotate(-20)">
    <circle cx="6" cy="10" r="5" fill="#fbbf24"/>
    <rect x="8" y="8" width="22" height="4" rx="2" fill="#fbbf24"/>
    <rect x="8" y="12" width="22" height="4" rx="2" fill="#fbbf24"/>
  </g>
  <!-- comb -->
  <g transform="translate(156,52) rotate(25)">
    <rect x="0" y="0" width="6" height="26" rx="3" fill="#fbbf24"/>
    <rect x="0" y="24" width="18" height="3" fill="#fbbf24"/>
    <rect x="0" y="28" width="16" height="3" fill="#fbbf24"/>
    <rect x="0" y="32" width="12" height="3" fill="#fbbf24"/>
  </g>
  <!-- salon chair base -->
  <rect x="80" y="168" width="40" height="8" rx="4" fill="#f472b6"/>
  <!-- sparkles -->
  <g fill="#fbbf24">
    <polygon points="34,96 35.5,92 37,96 41,97.5 37,99 35.5,103 34,99 30,97.5"/>
    <polygon points="158,118 159.5,114 161,118 165,119.5 161,121 159.5,125 158,121 154,119.5"/>
    <circle cx="42" cy="138" r="2" fill="#e9d5ff" opacity="0.8"/>
    <circle cx="164" cy="90" r="2" fill="#e9d5ff" opacity="0.8"/>
    <circle cx="26" cy="26" r="2" fill="#e9d5ff" opacity="0.8"/>
    <circle cx="174" cy="34" r="3" fill="#f9a8d4" opacity="0.9"/>
  </g>
</svg>