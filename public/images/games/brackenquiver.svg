<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Brackenquiver archery castle defence game">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="0.55" stop-color="#5b2a4a"/>
      <stop offset="1" stop-color="#c96a3a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="322" cy="292" r="46" fill="#ffd08a" opacity="0.22"/>
  <circle cx="322" cy="292" r="26" fill="#ffe0ad" opacity="0.4"/>

  <!-- far ridge -->
  <path d="M0 268 L58 232 L104 258 L150 216 L206 262 L258 224 L318 258 L372 236 L400 254 L400 400 L0 400 Z" fill="#2a1a35" opacity="0.85"/>
  <path d="M0 300 L70 276 L138 300 L210 270 L280 298 L350 274 L400 292 L400 400 L0 400 Z" fill="#1d1230"/>

  <!-- ground -->
  <rect x="0" y="318" width="400" height="82" fill="#140c22"/>

  <!-- left bastion (player's wall) -->
  <g fill="#17102a">
    <rect x="18" y="252" width="86" height="76"/>
    <path d="M14 252 h14 v-16 h15 v16 h15 v-16 h15 v16 h15 v-16 h14 v16 Z"/>
  </g>
  <rect x="86" y="252" width="6" height="76" fill="#f0a868" opacity="0.35"/>

  <!-- right bastion (enemy's tower) -->
  <g fill="#120b22">
    <rect x="296" y="214" width="92" height="114"/>
    <path d="M292 214 h15 v-18 h16 v18 h16 v-18 h16 v18 h16 v-18 h15 v18 Z"/>
  </g>
  <rect x="296" y="214" width="6" height="114" fill="#f0a868" opacity="0.45"/>

  <!-- enemy archer on the right tower -->
  <g transform="translate(344 250)" fill="#ffd08a" opacity="0.95">
    <path d="M-9 0 c0 -11 4 -17 9 -17 s9 6 9 17 Z"/>
    <circle cx="0" cy="-24" r="7"/>
    <path d="M9 -10 L24 -2" stroke="#ffd08a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M368 240 q12 10 0 20" stroke="#ffd08a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- bow, drawn back on the left wall -->
  <g transform="translate(104 268)">
    <path d="M0 -34 C18 -18 18 18 0 34" fill="none" stroke="#e8d9b0" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 -34 L-15 0 L0 34" fill="none" stroke="#e8d9b0" stroke-width="3" stroke-linecap="round"/>
    <path d="M-15 0 L46 0" stroke="#e8d9b0" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M46 -6 L60 0 L46 6 Z" fill="#e8d9b0"/>
  </g>

  <!-- dotted flight path -->
  <path d="M164 268 Q232 118 330 246" fill="none" stroke="#ffd93d" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 15" opacity="0.92"/>

  <!-- arrow in flight -->
  <g transform="translate(243 176) rotate(24)">
    <path d="M-26 0 L20 0" stroke="#f4f0ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M20 -8 L36 0 L20 8 Z" fill="#f4f0ff"/>
    <path d="M-26 0 l10 -7 v14 Z" fill="#ffd93d"/>
    <path d="M-26 0 l10 7 v-14 Z" fill="#ffd93d"/>
  </g>

  <!-- bracken fronds -->
  <g stroke="#6fbf73" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M26 400 C22 356 40 330 58 318"/>
    <path d="M30 366 C18 360 12 350 12 340"/>
    <path d="M34 348 C48 342 56 332 58 322"/>
    <path d="M374 400 C378 358 362 332 346 320"/>
    <path d="M370 368 C382 362 388 352 388 342"/>
    <path d="M366 350 C352 344 344 334 342 324"/>
  </g>
</svg>
