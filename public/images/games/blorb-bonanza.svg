<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- small blobs in background -->
  <circle cx="30" cy="40" r="10" fill="#7c3aed" opacity="0.2"/>
  <circle cx="170" cy="50" r="14" fill="#7c3aed" opacity="0.15"/>
  <circle cx="160" cy="160" r="8" fill="#a855f7" opacity="0.2"/>
  <circle cx="40" cy="170" r="12" fill="#a855f7" opacity="0.15"/>
  <!-- main blorb body -->
  <ellipse cx="100" cy="110" rx="52" ry="48" fill="url(#blob)" stroke="#86efac" stroke-width="2.5"/>
  <!-- blob highlight -->
  <ellipse cx="86" cy="92" rx="20" ry="14" fill="#bbf7d0" opacity="0.35" transform="rotate(-15 86 92)"/>
  <!-- eyes -->
  <ellipse cx="84" cy="100" rx="11" ry="12" fill="#ffffff"/>
  <ellipse cx="116" cy="100" rx="11" ry="12" fill="#ffffff"/>
  <circle cx="87" cy="101" r="6" fill="#1e293b"/>
  <circle cx="119" cy="101" r="6" fill="#1e293b"/>
  <circle cx="89" cy="98" r="2.5" fill="#ffffff"/>
  <circle cx="121" cy="98" r="2.5" fill="#ffffff"/>
  <!-- happy mouth -->
  <path d="M88 120 Q100 134 112 120" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="74" cy="118" rx="7" ry="4" fill="#f472b6" opacity="0.35"/>
  <ellipse cx="126" cy="118" rx="7" ry="4" fill="#f472b6" opacity="0.35"/>
  <!-- little arms -->
  <path d="M50 108 Q38 100 34 108" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M150 108 Q162 100 166 108" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- sparkles -->
  <g fill="#c084fc" opacity="0.7">
    <polygon points="150,72 152,66 154,72 160,74 154,76 152,82 150,76 144,74"/>
    <polygon points="46,78 47.5,74 49,78 53,79.5 49,81 47.5,85 46,81 42,79.5"/>
  </g>
</svg>