<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- speed lines -->
  <line x1="10" y1="90" x2="45" y2="90" stroke="#06b6d4" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="5" y1="105" x2="50" y2="105" stroke="#06b6d4" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="15" y1="120" x2="42" y2="120" stroke="#06b6d4" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
  <line x1="20" y1="75" x2="48" y2="75" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <!-- stickman head -->
  <circle cx="120" cy="62" r="14" fill="none" stroke="#22d3ee" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="116" cy="59" r="2.5" fill="#ecfeff"/>
  <circle cx="125" cy="59" r="2.5" fill="#ecfeff"/>
  <!-- body -->
  <line x1="120" y1="76" x2="115" y2="120" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
  <!-- front arm -->
  <line x1="118" y1="90" x2="148" y2="80" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
  <!-- back arm -->
  <line x1="118" y1="90" x2="90" y2="100" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
  <!-- front leg (extended) -->
  <line x1="115" y1="120" x2="150" y2="145" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="150" y1="145" x2="160" y2="140" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  <!-- back leg (kicked back) -->
  <line x1="115" y1="120" x2="80" y2="148" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="80" y1="148" x2="70" y2="142" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  <!-- ground -->
  <line x1="20" y1="160" x2="180" y2="160" stroke="#164e63" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
  <!-- trailing particles -->
  <g fill="#06b6d4" opacity="0.5">
    <circle cx="68" cy="98" r="2"/>
    <circle cx="60" cy="108" r="1.5"/>
    <circle cx="72" cy="112" r="1.8"/>
  </g>
</svg>