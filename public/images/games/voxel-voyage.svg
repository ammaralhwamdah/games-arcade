<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0c1445"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="20" cy="30" r="1.2" opacity="0.8"/><circle cx="55" cy="15" r="0.8" opacity="0.6"/>
    <circle cx="180" cy="25" r="1.4" opacity="0.9"/><circle cx="140" cy="12" r="0.9" opacity="0.5"/>
    <circle cx="30" cy="160" r="1" opacity="0.7"/><circle cx="170" cy="170" r="1.2" opacity="0.6"/>
    <circle cx="90" cy="20" r="1" opacity="0.5"/><circle cx="155" cy="45" r="0.8" opacity="0.7"/>
    <circle cx="15" cy="100" r="1" opacity="0.4"/><circle cx="185" cy="110" r="1.1" opacity="0.6"/>
  </g>
  <!-- engine trail -->
  <path d="M100 140 Q96 160 90 190" stroke="#06b6d4" stroke-width="6" opacity="0.2" fill="none" stroke-linecap="round"/>
  <path d="M100 140 Q104 160 110 190" stroke="#06b6d4" stroke-width="6" opacity="0.2" fill="none" stroke-linecap="round"/>
  <path d="M100 140 Q98 155 94 180" stroke="#22d3ee" stroke-width="3" opacity="0.35" fill="none" stroke-linecap="round"/>
  <path d="M100 140 Q102 155 106 180" stroke="#22d3ee" stroke-width="3" opacity="0.35" fill="none" stroke-linecap="round"/>
  <!-- spaceship body (voxel style) -->
  <!-- main hull -->
  <rect x="80" y="80" width="40" height="50" rx="3" fill="url(#hull)" stroke="#67e8f9" stroke-width="2"/>
  <!-- nose cone -->
  <polygon points="88,80 100,52 112,80" fill="#06b6d4" stroke="#67e8f9" stroke-width="1.5"/>
  <!-- cockpit -->
  <rect x="92" y="62" width="16" height="18" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="95" y="65" width="10" height="12" rx="2" fill="#0f172a" opacity="0.8"/>
  <circle cx="100" cy="71" r="3" fill="#22d3ee" filter="url(#glow)"/>
  <!-- wings -->
  <polygon points="80,95 50,120 52,130 80,115" fill="#0e7490" stroke="#67e8f9" stroke-width="1.5"/>
  <polygon points="120,95 150,120 148,130 120,115" fill="#0e7490" stroke="#67e8f9" stroke-width="1.5"/>
  <!-- engine pods -->
  <rect x="48" y="118" width="12" height="16" rx="3" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
  <rect x="140" y="118" width="12" height="16" rx="3" fill="#164e63" stroke="#22d3ee" stroke-width="1"/>
  <!-- engine glow -->
  <circle cx="54" cy="138" r="5" fill="#22d3ee" opacity="0.6" filter="url(#glow)"/>
  <circle cx="146" cy="138" r="5" fill="#22d3ee" opacity="0.6" filter="url(#glow)"/>
  <!-- thruster flames -->
  <ellipse cx="54" cy="145" rx="3" ry="6" fill="#ecfeff" opacity="0.5"/>
  <ellipse cx="146" cy="145" rx="3" ry="6" fill="#ecfeff" opacity="0.5"/>
  <!-- pixel accents -->
  <rect x="82" y="100" width="5" height="5" fill="#a5f3fc" opacity="0.5"/>
  <rect x="113" y="100" width="5" height="5" fill="#a5f3fc" opacity="0.5"/>
</svg>