<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="rgba(139,92,246,0.12)" stroke-width="1">
    <line x1="40" y1="40" x2="40" y2="160"/>
    <line x1="80" y1="40" x2="80" y2="160"/>
    <line x1="120" y1="40" x2="120" y2="160"/>
    <line x1="160" y1="40" x2="160" y2="160"/>
    <line x1="40" y1="40" x2="160" y2="40"/>
    <line x1="40" y1="80" x2="160" y2="80"/>
    <line x1="40" y1="120" x2="160" y2="120"/>
    <line x1="40" y1="160" x2="160" y2="160"/>
  </g>
  <!-- Powered circuit paths -->
  <g filter="url(#glow)">
    <!-- Horizontal path -->
    <rect x="42" y="73" width="38" height="14" rx="3" fill="#22d3ee" opacity="0.9"/>
    <rect x="82" y="73" width="38" height="14" rx="3" fill="#22d3ee" opacity="0.9"/>
    <!-- Vertical path -->
    <rect x="113" y="42" width="14" height="38" rx="3" fill="#8b5cf6" opacity="0.9"/>
    <rect x="113" y="82" width="14" height="38" rx="3" fill="#8b5cf6" opacity="0.9"/>
    <!-- Corner piece -->
    <rect x="82" y="113" width="38" height="14" rx="3" fill="url(#line1)" opacity="0.9"/>
    <rect x="113" y="113" width="14" height="38" rx="3" fill="url(#line2)" opacity="0.9"/>
    <!-- T-junction -->
    <rect x="42" y="113" width="38" height="14" rx="3" fill="#22d3ee" opacity="0.7"/>
    <rect x="153" y="73" width="14" height="38" rx="3" fill="#8b5cf6" opacity="0.7"/>
  </g>
  <!-- Power node -->
  <circle cx="120" cy="48" r="8" fill="#f59e0b" filter="url(#glow)"/>
  <!-- Title -->
  <text x="100" y="188" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-weight="bold" font-size="11" letter-spacing="2">NEON CIRCUIT</text>
</svg>
