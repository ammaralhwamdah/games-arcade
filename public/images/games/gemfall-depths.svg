<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- ambient glow -->
  <circle cx="100" cy="95" r="70" fill="#065f46" opacity="0.15"/>
  <!-- main gem -->
  <g transform="translate(100,90)">
    <!-- gem back facet -->
    <polygon points="0,-55 38,-18 24,35 -24,35 -38,-18" fill="url(#gem)" stroke="#6ee7b7" stroke-width="2.5"/>
    <!-- gem front highlight facet -->
    <polygon points="0,-55 18,-12 0,35 -18,-12" fill="#a7f3d0" opacity="0.3"/>
    <!-- gem bottom facet -->
    <polygon points="24,35 -24,35 0,50" fill="#065f46" opacity="0.6"/>
    <!-- inner sparkle -->
    <circle cx="0" cy="-18" r="7" fill="#ecfdf5" opacity="0.7" filter="url(#glow)"/>
    <circle cx="-6" cy="-24" r="3" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- smaller gems -->
  <g transform="translate(42,150)">
    <polygon points="0,-22 16,-7 10,14 -10,14 -16,-7" fill="#22d3ee" stroke="#67e8f9" stroke-width="1.5"/>
    <polygon points="0,-22 8,-4 0,14 -8,-4" fill="#a5f3fc" opacity="0.25"/>
  </g>
  <g transform="translate(158,155)">
    <polygon points="0,-20 14,-6 9,13 -9,13 -14,-6" fill="#34d399" stroke="#6ee7b7" stroke-width="1.5"/>
    <polygon points="0,-20 7,-4 0,13 -7,-4" fill="#a7f3d0" opacity="0.25"/>
  </g>
  <!-- crystal shards floating -->
  <polygon points="30,60 34,50 38,60 34,65" fill="#34d399" opacity="0.4"/>
  <polygon points="165,55 168,46 171,55 168,60" fill="#22d3ee" opacity="0.4"/>
  <polygon points="50,100 53,92 56,100 53,104" fill="#6ee7b7" opacity="0.3"/>
  <!-- sparkle particles -->
  <g fill="#6ee7b7" opacity="0.6">
    <circle cx="60" cy="40" r="1.5"/>
    <circle cx="145" cy="35" r="1.8"/>
    <circle cx="150" cy="110" r="1.2"/>
    <circle cx="55" cy="130" r="1"/>
  </g>
  <g fill="#67e8f9" opacity="0.5">
    <circle cx="80" cy="25" r="1.2"/>
    <circle cx="130" cy="145" r="1.5"/>
  </g>
  <!-- ground crystals -->
  <polygon points="30,185 33,172 36,185" fill="#0e7490" opacity="0.5"/>
  <polygon points="168,188 171,175 174,188" fill="#0e7490" opacity="0.5"/>
</svg>