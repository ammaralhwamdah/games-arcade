<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a2e"/>
      <stop offset="1" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="sword-blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.5" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="sword-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44403c"/>
      <stop offset="1" stop-color="#292524"/>
    </linearGradient>
    <radialGradient id="torch-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gem-blue" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="gem-red" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="1" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="gem-green" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#166534"/>
    </radialGradient>
  </defs>
  <!-- background -->
  <rect width="512" height="384" fill="url(#bg)"/>
  <!-- stone floor texture -->
  <g opacity="0.12" fill="#a8a29e">
    <rect x="0" y="280" width="512" height="104" fill="#292524"/>
    <line x1="0" y1="300" x2="512" y2="300" stroke="#44403c" stroke-width="1"/>
    <line x1="0" y1="330" x2="512" y2="330" stroke="#44403c" stroke-width="1"/>
    <line x1="80" y1="280" x2="80" y2="384" stroke="#44403c" stroke-width="0.8"/>
    <line x1="200" y1="280" x2="200" y2="384" stroke="#44403c" stroke-width="0.8"/>
    <line x1="320" y1="280" x2="320" y2="384" stroke="#44403c" stroke-width="0.8"/>
    <line x1="430" y1="280" x2="430" y2="384" stroke="#44403c" stroke-width="0.8"/>
  </g>
  <!-- dungeon archway -->
  <g>
    <path d="M140,280 L140,80 Q256,20 372,80 L372,280" fill="none" stroke="url(#arch)" stroke-width="28" stroke-linecap="round"/>
    <path d="M140,280 L140,80 Q256,20 372,80 L372,280" fill="none" stroke="#57534e" stroke-width="22" stroke-linecap="round"/>
    <!-- stone blocks on arch -->
    <g fill="#78716c" opacity="0.3">
      <rect x="130" y="100" width="20" height="12" rx="2"/>
      <rect x="130" y="140" width="20" height="12" rx="2"/>
      <rect x="130" y="180" width="20" height="12" rx="2"/>
      <rect x="130" y="220" width="20" height="12" rx="2"/>
      <rect x="362" y="100" width="20" height="12" rx="2"/>
      <rect x="362" y="140" width="20" height="12" rx="2"/>
      <rect x="362" y="180" width="20" height="12" rx="2"/>
      <rect x="362" y="220" width="20" height="12" rx="2"/>
    </g>
  </g>
  <!-- torch left -->
  <g transform="translate(155,130)">
    <circle cx="0" cy="0" r="50" fill="url(#torch-glow)"/>
    <rect x="-3" y="8" width="6" height="28" rx="2" fill="#78716c"/>
    <ellipse cx="0" cy="4" rx="6" ry="10" fill="#f59e0b" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="4" ry="7" fill="#fbbf24"/>
    <ellipse cx="0" cy="-2" rx="2" ry="4" fill="#fef3c7"/>
  </g>
  <!-- torch right -->
  <g transform="translate(357,130)">
    <circle cx="0" cy="0" r="50" fill="url(#torch-glow)"/>
    <rect x="-3" y="8" width="6" height="28" rx="2" fill="#78716c"/>
    <ellipse cx="0" cy="4" rx="6" ry="10" fill="#f59e0b" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="4" ry="7" fill="#fbbf24"/>
    <ellipse cx="0" cy="-2" rx="2" ry="4" fill="#fef3c7"/>
  </g>
  <!-- hero silhouette in center -->
  <g transform="translate(256,195)" opacity="0.85">
    <!-- body -->
    <rect x="-8" y="-10" width="16" height="36" rx="4" fill="#334155"/>
    <!-- head -->
    <circle cx="0" cy="-20" r="10" fill="#334155"/>
    <!-- cape -->
    <path d="M-8,-5 Q-18,15 -14,30 L8,30 Q14,15 8,-5" fill="#1e3a5f" opacity="0.7"/>
  </g>
  <!-- sword (held by hero, angled) -->
  <g transform="translate(280,155) rotate(25)">
    <rect x="-2.5" y="40" width="5" height="30" rx="2" fill="#92400e"/>
    <rect x="-6" y="36" width="12" height="6" rx="2" fill="url(#sword-glow)"/>
    <rect x="-3" y="-20" width="6" height="58" rx="1.5" fill="url(#sword-blade)"/>
    <rect x="-1" y="-18" width="2" height="54" rx="1" fill="#f1f5f9" opacity="0.4"/>
    <!-- sword tip -->
    <polygon points="0,-26 -3,-20 3,-20" fill="#cbd5e1"/>
    <!-- glow on blade -->
    <rect x="-4" y="-16" width="8" height="50" rx="2" fill="#fbbf24" opacity="0.08"/>
  </g>
  <!-- gems scattered on ground -->
  <g transform="translate(195,300)">
    <polygon points="0,-12 10,-4 6,10 -6,10 -10,-4" fill="url(#gem-blue)" stroke="#67e8f9" stroke-width="1.5"/>
    <polygon points="0,-12 5,-2 0,10 -5,-2" fill="#a5f3fc" opacity="0.25"/>
  </g>
  <g transform="translate(310,310)">
    <polygon points="0,-10 8,-3 5,8 -5,8 -8,-3" fill="url(#gem-red)" stroke="#fca5a5" stroke-width="1.5"/>
    <polygon points="0,-10 4,-2 0,8 -4,-2" fill="#fecaca" opacity="0.25"/>
  </g>
  <g transform="translate(240,320)">
    <polygon points="0,-8 7,-3 4,7 -4,7 -7,-3" fill="url(#gem-green)" stroke="#86efac" stroke-width="1.2"/>
    <polygon points="0,-8 3,-2 0,7 -3,-2" fill="#bbf7d0" opacity="0.25"/>
  </g>
  <!-- gold coins -->
  <g transform="translate(220,295)" fill="#fbbf24" stroke="#d97706" stroke-width="1">
    <ellipse cx="0" cy="0" rx="7" ry="5"/>
    <text x="0" y="2" font-family="Arial" font-size="7" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>
  </g>
  <g transform="translate(295,298)" fill="#fbbf24" stroke="#d97706" stroke-width="1">
    <ellipse cx="0" cy="0" rx="7" ry="5"/>
    <text x="0" y="2" font-family="Arial" font-size="7" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>
  </g>
  <!-- treasure chest right side -->
  <g transform="translate(380,270)">
    <rect x="-14" y="0" width="28" height="18" rx="3" fill="#92400e" stroke="#78350f" stroke-width="1.5"/>
    <path d="M-14,0 Q-14,-10 0,-10 Q14,-10 14,0" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
    <rect x="-3" y="-4" width="6" height="6" rx="1" fill="#fbbf24"/>
    <circle cx="0" cy="-1" r="1.5" fill="#f59e0b"/>
    <!-- gold glow from chest -->
    <ellipse cx="0" cy="-5" rx="10" ry="6" fill="#fbbf24" opacity="0.12"/>
  </g>
  <!-- bat silhouettes -->
  <g fill="#1e1b4b" opacity="0.4">
    <g transform="translate(100,60) scale(0.5)">
      <path d="M0,0 Q-12,-10 -20,-4 Q-12,-2 -8,0 Q-4,-8 0,-12 Q4,-8 8,0 Q12,-2 20,-4 Q12,-10 0,0Z"/>
    </g>
    <g transform="translate(400,45) scale(0.4)">
      <path d="M0,0 Q-12,-10 -20,-4 Q-12,-2 -8,0 Q-4,-8 0,-12 Q4,-8 8,0 Q12,-2 20,-4 Q12,-10 0,0Z"/>
    </g>
  </g>
  <!-- floating dust particles -->
  <g fill="#d4d4d8" opacity="0.3">
    <circle cx="180" cy="100" r="1.2"/>
    <circle cx="330" cy="80" r="1"/>
    <circle cx="250" cy="60" r="0.8"/>
    <circle cx="200" cy="200" r="1.1"/>
    <circle cx="310" cy="180" r="0.9"/>
  </g>
  <!-- title bar -->
  <rect x="0" y="340" width="512" height="44" fill="rgba(2,6,23,0.8)"/>
  <text x="256" y="368" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fbbf24" text-anchor="middle">GEMFALL DEPTHS</text>
  <!-- GameVerse badge -->
  <g transform="translate(330,14)">
    <rect width="176" height="42" rx="10" fill="rgba(9,12,24,0.82)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
    <g transform="translate(12,5) scale(0.72)" fill="none">
      <defs><linearGradient id="gvw-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
      <rect x="0" y="0" width="34" height="34" rx="9" fill="url(#gvw-bg)"/>
      <rect x="7" y="9" width="20" height="16" rx="4" fill="#ffffff"/>
      <rect x="12" y="12" width="3" height="9" rx="1" fill="#0f172a"/>
      <rect x="10" y="16" width="8" height="3" rx="1" fill="#0f172a"/>
      <circle cx="22" cy="17" r="1.6" fill="#0f172a"/><circle cx="25" cy="17" r="1.6" fill="#0f172a"/>
    </g>
    <text x="44" y="27" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Game</text>
    <text x="92" y="27" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#22d3ee">Verse</text>
  </g>
</svg>