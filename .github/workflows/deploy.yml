
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/tsc.log || true
          echo "---- type errors ----" >> $GITHUB_STEP_SUMMARY
          grep -E "error TS" /tmp/tsc.log | head -40 >> $GITHUB_STEP_SUMMARY || echo "no TS error lines found" >> $GITHUB_STEP_SUMMARY
          while IFS= read -r line; do
            echo "::error title=tsc::$line"
          done < <(grep -E "error TS" /tmp/tsc.log | head -40)
          if grep -qE "error TS" /tmp/tsc.log; then
            echo "typecheck failed" >&2
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://playkrux.com
          NEXT_PUBLIC_CONTACT_EMAIL: playkrux@gmail.com
          NEXT_PUBLIC_SITE_EDITOR: Ammar Yaser
          NEXT_PUBLIC_ADMIN_EMAIL: ammar.alhwamdah@gmail.com
          NEXT_PUBLIC_ADMIN_USERNAME: ammar
          NEXT_PUBLIC_SUPABASE_URL: https://ggcsianuhafonuzphzjw.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnY3NpYW51aGFmb251enBoemp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDY1MzUsImV4cCI6MjEwMTUyMjUzNX0.T2TCUJUyZuIsc6cLftp5hmSfnwYN890IAgpNQjF7nXQ
          NEXT_PUBLIC_ADSENSE_CLIENT: 3801707354489723
          NEXT_PUBLIC_GA_ID: G-GR5DG65ZK7
          NEXT_PUBLIC_GTM_ID: GTM-PC37BFTH

      - name: Verify build output
        run: npm run verify:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test live site
        run: node scripts/smoke-test.mjs "${{ vars.PRODUCTION_URL || 'https://playkrux.com' }}"
