
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build first: Next generates the typed-route globals (LayoutProps /
      # PageProps) into .next/types during the build, so tsc cannot see them
      # before this step runs.
      - name: Build
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          echo $? > /tmp/build.exit
          cat /tmp/build.log
          exit $(cat /tmp/build.exit)
        env:
          NEXT_PUBLIC_SITE_URL: https://playkrux.com
          NEXT_PUBLIC_CONTACT_EMAIL: playkrux@gmail.com
          NEXT_PUBLIC_SITE_EDITOR: Ammar Yaser
          NEXT_PUBLIC_ADMIN_EMAIL: ammar.alhwamdah@gmail.com
          NEXT_PUBLIC_ADMIN_USERNAME: ammar
          NEXT_PUBLIC_SUPABASE_URL: https://ggcsianuhafonuzphzjw.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnY3NpYW51aGFmb251enBoemp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDY1MzUsImV4cCI6MjEwMTUyMjUzNX0.T2TCUJUyZuIsc6cLftp5hmSfnwYN890IAgpNQjF7nXQ
          NEXT_PUBLIC_ADSENSE_CLIENT: 3801707354489723
          NEXT_PUBLIC_GA_ID: G-GR5DG65ZK7

      - name: Type check
        run: |
          set +e
          npm run typecheck > /tmp/tsc.log 2>&1
          echo $? > /tmp/tsc.exit
          cat /tmp/tsc.log
          exit $(cat /tmp/tsc.exit)

      - name: Verify build output
        run: |
          set +e
          npm run verify:build > /tmp/verify.log 2>&1
          echo $? > /tmp/verify.exit
          cat /tmp/verify.log
          exit $(cat /tmp/verify.exit)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # On failure, commit the compiler output to the repo ROOT (never public/,
      # so it can never be published) so the error is readable without GitHub
      # Actions log access.
      - name: Publish CI diagnostics
        if: failure()
        run: |
          {
            echo "commit=${{ github.sha }}"
            echo "build_exit=$(cat /tmp/build.exit 2>/dev/null || echo 'n/a')"
            echo "tsc_exit=$(cat /tmp/tsc.exit 2>/dev/null || echo 'n/a')"
            echo "verify_exit=$(cat /tmp/verify.exit 2>/dev/null || echo 'n/a')"
            echo "==== BUILD LOG ===="
            cat /tmp/build.log 2>/dev/null || echo "(no build log)"
            echo "==== TSC LOG ===="
            cat /tmp/tsc.log 2>/dev/null || echo "(no tsc log)"
            echo "==== VERIFY LOG ===="
            cat /tmp/verify.log 2>/dev/null || echo "(no verify log)"
          } > ci-errors.txt
          git config user.email "ci@playkrux.com"
          git config user.name "CI Diagnostics"
          git add -f ci-errors.txt
          git commit -m "ci: publish build/typecheck diagnostics [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The deploy job runs on a clean runner, so it needs its own checkout:
      # scripts/smoke-test.mjs and public/data/games.json are not carried over
      # from the build job.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test live site
        run: |
          set +e
          node scripts/smoke-test.mjs "${{ vars.PRODUCTION_URL || 'https://playkrux.com' }}" > /tmp/smoke.log 2>&1
          echo $? > /tmp/smoke.exit
          cat /tmp/smoke.log
          exit $(cat /tmp/smoke.exit)

      # The smoke test runs after the site is already live, so a failure here
      # must not block a valid deployment. Commit the report to the repo ROOT
      # (never public/) so the cause is readable without Actions log access.
      - name: Publish smoke test diagnostics
        if: failure()
        run: |
          {
            echo "commit=${{ github.sha }}"
            echo "smoke_exit=$(cat /tmp/smoke.exit 2>/dev/null || echo 'n/a')"
            echo "==== SMOKE LOG ===="
            cat /tmp/smoke.log 2>/dev/null || echo "(no smoke log)"
          } > ci-errors.txt
          git config user.email "ci@playkrux.com"
          git config user.name "CI Diagnostics"
          git add -f ci-errors.txt
          git commit -m "ci: publish smoke test diagnostics [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
